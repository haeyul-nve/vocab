learn to practice [economy] for the environment.","우리는 환경을 위해 절약을 실천하는 법을 배워야 한다."]]},{"u":21,"n":603,"w":"astronaut","m":"우주비행사","ex":[["There lived a former [astronaut] named Cooper and his daughter, Murphy.","Cooper라는 이름의 전직 우주비행사와 그의 딸 Murphy가 살았다."]]},{"u":21,"n":604,"w":"signal","m":"신호; 신호등; 신호를 보내다","ex":[["Murphy found some strange [signals] and told Cooper about them.","Murphy는 어떤 이상한 신호를 발견하고 Cooper에게 그것에 대해 말했다."],["The teacher [signaled] at me to start the presentation.","신호를 보내셨다 선생님께서 나에게 발표를 시작하라고."]]},{"u":21,"n":605,"w":"interpret","m":"1. 해석하다; 이해하다 2. 통역하다","ex":[["Cooper was able to [interpret] what the signals meant.","Cooper는 그 신호가 무엇을 의미하는지 이해할 수 있었다."]]},{"u":21,"n":606,"w":"indicate","m":"가리키다; 나타내다","ex":[["The signals [indicated] that NASA was still active.","그 신호는 NASA가 여전히 활동하고 있다는 것을 나타냈다."]]},{"u":21,"n":607,"w":"universe","m":"우주; ((the -)) 전 세계","ex":[["NASA wanted to find a new hope in the [universe].","NASA는 우주에서 새로운 희망을 찾고 싶어 했다."]]},{"u":21,"n":608,"w":"exist","m":"존재하다, 실재하다; (힘든 상황에서) 살아가다","ex":[["They tried to figure out whether a planet suitable for humans [existed] in space.","그들은 인간에게 적합한 행성이 우주에 존재하는지 알아내려고 했다."]]},{"u":21,"n":609,"w":"persuade","m":"설득하다","ex":[["NASA [persuaded] Cooper to join the project.","NASA는 Cooper가 그 프로젝트에 참여하도록 설득했다."]]},{"u":21,"n":610,"w":"laboratory","m":"실험실, 연구소","ex":[["Scientists worked in the [laboratory] to prepare the spaceship.","과학자들은 우주선을 준비하기 위해 연구소에서 일했다."]]},{"u":21,"n":611,"w":"advanced","m":"1. 진보한, 선진의 2. 상급의, 고등의","ex":[["The spaceship was built with [advanced] technology.","그 우주선은 진보한 기술로 만들어졌다."],["an [advanced] student of Spanish","스페인어가 상급 수준인 학생"]]},{"u":21,"n":612,"w":"observe","m":"1. 관찰하다 2. 보다, 목격하다 3. (~라고) 말하다 4. (법, 규칙 등을) 지키다","ex":[["They [observed] the universe to gain further information.","그들은 추가 정보를 얻기 위해 우주를 관찰했다."],["The police [observed] a man entering the bank.","경찰은 한 남자가 은행에 들어가는 것을 목격했다."],["“It’s time to leave,” he [observed].","‘이제 떠날 시간이야’라고 그가 말했다."],["We should [observe] good manners.","우리는 예절을 지켜야 한다."]]},{"u":21,"n":613,"w":"contact","m":"연락하다; 접촉하다; 연락; 접촉","ex":[["Cooper and the other astronauts [contacted] the earth regularly.","Cooper와 다른 우주비행사들은 지구와 정기적으로 연락했다."],["Physical [contact] with a mother makes the baby feel comforted.","엄마와의 신체적 접촉은 아기가 안락함을 느끼도록 만들어준다."]]},{"u":21,"n":614,"w":"document","m":"기록하다; 서류, 문서","ex":[["Cooper [documented] his life in space with videos.","Cooper는 우주에서의 자신의 생활을 비디오로 기록했다."],["Please check the attached [document] and sign it.","첨부된 서류를확인하고 서명해 주시기 바랍니다."]]},{"u":21,"n":615,"w":"explore","m":"탐험하다; 탐구하다","ex":[["They [explored] three planets which could possibly support human life.","그들은 어쩌면 인간의 삶을 지속시켜 줄 수도 있을 세 개의 행성을 탐험했다."]]},{"u":21,"n":616,"w":"genius","m":"천재성; 천재","ex":[["When Murphy grew up, her [genius] became clear.","Murphy는 성장하여, 천재성이 명확해졌다."]]},{"u":21,"n":617,"w":"examine","m":"1. 검사[검토]하다, 조사하다 2. 진찰하다","ex":[["She [examined] NASA’s theories about Cooper’s space travel.","그녀는 Cooper의 우주여행에 대한 NASA의 이론들을 검토했다."],["The doctor [examined] her but could find nothing wrong.","의사가 그녀를 진찰했지만 아무 문제도 찾을 수 없었다."]]},{"u":21,"n":618,"w":"acknowledge","m":"1. (사실로) 인정하다 2. (공식적으로) 감사를 표하다","ex":[["She had to [acknowledge] that her father had followed a poor plan.","그녀는 아버지가 형편없는 계획을 따랐다는 것을 인정해야만 했다."],["He [acknowledged] her behavior with a gift.","그는 그녀의 행동에 선물로 감사를 표했다."]]},{"u":21,"n":619,"w":"assume","m":"1. 가정하다, 추정하다 2. (역할 등을) 맡다 3. (~인) 척하다","ex":[["As time went on, she [assumed] Cooper had died in space.","시간이 흐르면서, 그녀는 Cooper가 우주에서 세상을 떠났다고 추정했다."],["Last year, Garvey [assumed] the role of head chef.","작년에, Garvey는 주방장의 역할을 맡았다."],["He was disturbed by the news, but he [assumed] indifference.","그는 그 소식에 동요했지만 무심한 척했다."]]},{"u":21,"n":620,"w":"relative","m":"상대적인, 비교상의; 1. 친척 2. 동족, 동류","ex":[["A [relative] time difference existed between Earth and Cooper’s location.","지구와 Cooper의 위치 사이에 상대적인 시간 차이가 존재했다."],["People think Jay and Kim are [relatives] because they look alike.","친척 Jay와 Kim이 서로 닮았기 때문에, 사람들은 그들이 이라고 생각한다."],["The house cat is a distant [relative] of the tiger.","집고양이는 호랑이의 먼 동족이다."]]},{"u":21,"n":621,"w":"alive","m":"1. 살아 있는 2. 활발한, 생기 넘치는","ex":[["If he had been on Earth, he would have been [alive] for more than 100 years.","만약에 그가 지구에 있었다면, 그는 100년이 넘도록 살아 있는 것이었다."],["Eric looked [alive] at his picnic.","Eric은 자신의 소풍날 활발해 보였다."]]},{"u":21,"n":622,"w":"imply","m":"암시하다, 시사하다","ex":[["Murphy received a message from Cooper which [implied] a solution.","Murphy는 Cooper로부터 해결책을 암시하는 메시지를 받았다."]]},{"u":21,"n":623,"w":"effective","m":"1. 효과적인 2. (법률 등이) 시행되는","ex":[["Then, she found an [effective] way to save everyone on Earth.","그 후, 그녀는 지구상의 모든 이를 구할 효과적인 방법을 찾아냈다."],["The new rules will become [effective] in the next few days.","새 규정은 수일 후에 시행될 것이다."]]},{"u":21,"n":624,"w":"mankind","m":"인류; (모든) 인간","ex":[["Thanks to her, [mankind] successfully moved to a new planet.","그녀 덕분에, 인류는 성공적으로 새 행성으로 이주했다."]]},{"u":21,"n":625,"w":"achieve","m":"(일, 목적 등을) 이루다, 성취하다","ex":[["Cooper found that he’d [achieved] his purpose eventually.","Cooper는 마침내 자신의 목적을 이뤘다는 것을 깨달았다."]]},{"u":21,"n":626,"w":"last","m":"1. 마지막의 2. 지난; 최근의; 1. 마지막으로 2. 지난번에; 최근에; 계속되다, 지속되다","ex":[["Luckily, they caught the [last] bus.","다행히도, 그들은 마지막 버스에 탔다."],["My family took a trip to Hawaii [last] year.","지난해에 우리 가족은 하와이로 여행을 떠났다."],["The heavy rain [lasted] for more than a week.","폭우가 일주일 넘게 계속되었다."]]},{"u":21,"n":627,"w":"will","m":"~할 것이다; 1. 의지 2. 유언장","ex":[["I [will] go to the library to study for the final exam.","나는 기말고사 공부를 하기 위해 도서관에 갈 것이다."],["The runner had a strong [will] to win the race.","그 주자는 경주에서 이기려는 강한 의지를 가졌다."],["Sam’s father left him a house in his [will].","Sam의 아버지는 자신의 유언장에서 그에게 집 한 채를 남기셨다."]]},{"u":21,"n":628,"w":"meet","m":"1. 만나다; 마중 가다 2. 충족시키다","ex":[["She [meets] her friends regularly on the weekend.","그녀는 주말에 친구들을 정기적으로 만난다."],["The school proposed new rules to [meet] the needs of students.","충족시키기 그 학교는 학생들의 요구를 위해 새 규칙을 제안했다."]]},{"u":21,"n":629,"w":"still","m":"잘, 좋게; 건강한; 우물","ex":[["I [still] haven’t finished my composition homework.","나는 아직 나의 작문 숙제를 끝내지 못했다."],["It’s only seasoned with salt, but it [still] tastes good.","이것은 소금으로만 간을 했지만 그런데도 맛이 좋았다."],["The girl sat [still] on the bench until her mom came back.","그 소녀는 자신의 엄마가 돌아오실 때까지 벤치에 가만히 앉아 있었다."]]},{"u":21,"n":630,"w":"well","m":"1. 아직(도), 여전히 2. 그런데도; 가만히 있는, 정지한","ex":[["He plays the piano and the guitar very [well].","그는 피아노와 기타를 매우 잘 연주한다."],["I hope you’re [well].","건강하시길 바랍니다."],["A long time ago, people used to get water from a [well].","오래전에 사람들은 우물에서 물을 얻곤 했다."]]},{"u":22,"n":631,"w":"nursery","m":"유아원; (가정집의) 아이들 놀이방","ex":[["My younger brother goes to a [nursery].","내 남동생은 유아원에 간다."]]},{"u":22,"n":632,"w":"kindergarten","m":"유치원","ex":[["My little sister wears a uniform to [kindergarten].","내 여동생은 유치원 원복을 입는다."]]},{"u":22,"n":633,"w":"stuff","m":"물건; 일; (빽빽이) 채워 넣다","ex":[["I put necessary [stuff] in my backpack before going to school.","나는 학교에 가기 전 필요한 물건을 배낭에 넣는다."],["She [stuffed] her bag with groceries.","그녀는 자신의 가방에 식료품을 채워 넣었다."]]},{"u":22,"n":634,"w":"routine","m":"일과; 틀에 박힌 일; 일상적인; 틀에 박힌","ex":[["These things are a part of my family’s morning [routine].","이런 일들이 우리 가족의 아침 일과의 한 부분이다."]]},{"u":22,"n":635,"w":"chore","m":"1. (집안)일, 가사; 잡일 2. 하기 싫은 일, 따분한 일","ex":[["Our family does [chores] together onthe weekend.","우리 가족은 주말에 집안일을 함께 한다."],["He found shopping to be a real [chore].","그는 쇼핑이 정말 따분한 일이라는 것을 알게 됐다."]]},{"u":22,"n":636,"w":"blanket","m":"담요","ex":[["My mom washes the [blankets] for my younger brother and sister.","엄마는 남동생과 여동생의 담요를 세탁하신다."]]},{"u":22,"n":637,"w":"stitch","m":"바느질하다, 꿰매다; (한) 바늘, (한) 땀","ex":[["My dad looks for clothes which may need to be [stitched].","아빠는 바느질할 필요가 있는 옷들을 찾아보신다."],["A [stitch] in time saves nine.","제때의 한 바늘이 아홉 바늘을 던다. (→ 문제를 즉각 처리하면 수월하게 해결할 수 있다.)"]]},{"u":22,"n":638,"w":"closet","m":"옷장, 벽장","ex":[["I fold the laundry and put it back in the [closet].","나는 빨래를 개어 옷장에 다시 넣는다."]]},{"u":22,"n":639,"w":"polish","m":"광내다, 닦다; 광택, 닦기; 광택제","ex":[["My mom uses an old cloth to [polish] the windows.","엄마는 창문을 닦기 위해 낡은 천을 사용하신다."]]},{"u":22,"n":640,"w":"scrub","m":"(솔로) 문질러 씻다[청소하다]","ex":[["My brother [scrubs] the bathroom walls.","남동생은 욕실 벽을 문질러 청소한다."]]},{"u":22,"n":641,"w":"broom","m":"(쓰레기 따위를 치우는) 빗자루, 비","ex":[["My sister and I use a [broom] to clean up the kitchen floor.","여동생과 나는 부엌 바닥을 청소하기 위해 빗자루를 사용한다."]]},{"u":22,"n":642,"w":"garbage","m":"쓰레기; 음식 찌꺼기","ex":[["Dad puts old food into a [garbage] bag.","아빠는 오래된 음식을 쓰레기 봉지에 넣으신다."]]},{"u":22,"n":643,"w":"mend","m":"1. 수선하다, 고치다 2. (사태 등을) 개선하다","ex":[["I ask my mom to [mend] my clothes.","나는 엄마에게 내 옷을 수선해 달라고 부탁드린다."]]},{"u":22,"n":644,"w":"sweat","m":"1. 땀 2. 노력, 수고; 땀을 흘리다","ex":[["Although we’re covered with [sweat], it is really fun to work together.","비록 우리는 땀으로 범벅이 되지만, 함께 일하는 것은 정말 즐겁다."],["It took a lot of [sweat] to pass the exam.","시험을 통과하는 데에는 많은 노력이 들었다."]]},{"u":22,"n":645,"w":"tidy","m":"잘 정돈된, 단정한","ex":[["When we finish cleaning, our home looks so [tidy] and clean.","청소를 마치면, 우리 집은 굉장히 잘 정돈되고 깨끗해 보인다."]]},{"u":22,"n":646,"w":"outlet","m":"1. 할인매장 2. (감정 등의) 표현 수단; 배출구","ex":[["We visited an [outlet] to buy necessary stuff for our family.","우리는 우리 가족에게 필요한 물건들을 사기 위해 할인매장에 방문했다."],["Sport became the perfect [outlet] for his anger.","스포츠는 그의 분노의 완벽한 배출구가 되었다."]]},{"u":22,"n":647,"w":"display","m":"1. 전시하다, 진열하다 2. (감정 등을) 드러내다; 전시, 진열","ex":[["Lots of products were [displayed] there.","그곳에는 많은 상품들이 진열되어 있었다."],["In this picture, no one is [displaying] any emotion on their face.","이 사진에서 누구도 얼굴에 표정을 드러내지않고 있다."]]},{"u":22,"n":648,"w":"scatter","m":"1. (뿔뿔이) 흩어지다 2. 흩뿌리다","ex":[["We [scattered] around the mall to find items on our shopping list.","우리는 쇼핑 목록에 있는 물건들을 찾기 위해 매장 곳곳으로 흩어졌다."],["The strong wind [scattered] the leaves all over the ground.","강한 바람이 나뭇잎들을 땅 여기저기에 흩뿌렸다."]]},{"u":22,"n":649,"w":"stack","m":"(쌓아 올린) 더미, 무더기; 쌓다, 쌓아 올리다","ex":[["I saw a [stack] of jeans and chose one pair for myself.","나는 청바지 더미를 봤고 내가 입을 청바지 한 벌을 골랐다."],["Is it okay to [stack] books on this shelf?","이 선반 위에 책을 쌓아도 될까요?"]]},{"u":22,"n":650,"w":"discount","m":"할인; 할인하다","ex":[["We could get a 5%[discount] if we spent over 100,000 won.","10만 원 넘게 구입하면 우리는 5% 할인을 받을 수 있었다."]]},{"u":22,"n":651,"w":"await","m":"기다리다","ex":[["When we finished shopping, we [awaited] our turn to pay patiently.","우리는 쇼핑을 마친 후 참을성 있게 계산할 차례를 기다렸다."]]},{"u":22,"n":652,"w":"starve","m":"몹시 배고프다, 굶주리다; 굶어 죽다","ex":[["After paying, we were [starving], so we went home to eat dinner right away.","계산한 후에, 우리는 몹시 배고파서저녁을 먹기 위해 바로 집으로 갔다."]]},{"u":22,"n":653,"w":"stereotype","m":"고정관념; 정형화하다, 틀에 박히게 하다","ex":[["It’s a [stereotype] that women have to do all the chores.","여자가 모든 집안일을 해야 한다는 것은 고정관념이다."]]},{"u":22,"n":654,"w":"depress","m":"1. 의기소침하게 하다 2. 부진하게 하다","ex":[["It [depresses] some to do chores alone.","홀로 집안일을 하는 것은 어떤 사람들을 의기소침하게 한다."],["The stock market has been [depressed] for two years.","주식 시장은 2년간 부진했다."]]},{"u":22,"n":655,"w":"burden","m":"부담, 짐; 부담을 주다","ex":[["Doing chores can be a [burden].","집안일을 하는 것은 부담이 될 수 있다."]]},{"u":22,"n":656,"w":"tolerate","m":"참다, 견디다; 용인하다","ex":[["It’s easier to [tolerate] these burdens together.","이런 부담을 함께 견디는 것이 더 쉽다."]]},{"u":22,"n":657,"w":"character","m":"1. 기호; 문자 2. 특징, 특성 3. 성격, 인격 4. (책, 영화 등의) 등장인물","ex":[["The password must include special [characters].","비밀번호는 반드시 특수 기호들을 포함해야 한다."],["Each rural area of Korea has its own distinctive [character].","한국의 각 지방은 고유의 두드러진 특징을 가지고 있다."],["He has a cheerful and outgoing [character].","그는 명랑하고 외향적인 성격을 가지고 있다."],["The film’s main [characters] are women in their late 30s.","그 영화의 주요 등장인물은 30대 후반의 여성들이다."]]},{"u":22,"n":658,"w":"matter","m":"1. 물질, 물체 2. (처리해야 할) 사항, 일 3. 상황, 사태 4. (걱정의 원인이 되는) 문제; 문제가 되다 5. 중요하다","ex":[["[Matter] exposed to these chemicals can harm your health.","이 화학 약품에 노출된 물질은 건강을 해칠 수 있다."],["I always consulted my sister on [matters] of school life.","나는 학교생활의 일을 항상 우리 언니와 상의했다."],["Her angry attitude didn’t improve [matters].","그녀의 화가 난 태도는 상황을 개선하지 못했다."],["What’s the [matter]?","문제가 뭐니?"],["Her wealth doesn’t [matter] to me.","그녀의 부(富)는 내게 중요하지 않다."]]},{"u":22,"n":659,"w":"raise","m":"1. (들어) 올리다 2. 인상하다; 인상, 증가 3. 모금하다 4. 기르다, 키우다 5. (문제 등을) 제기하다 6. (감정, 반응을) 불러일으키다","ex":[["She [raised] her hand above her head to ask a question.","그녀는 질문을 하기 위해 자신의 머리 위로 손을 들어 올렸다."],["The company [raises] salaries for its workers once a year.","그 회사는 직원들을 위해 일 년에 한 번 급여를 인상한다."],["The students [raised] money to help victims of an earthquake.","학생들은 지진 피해자들을 돕기 위해 돈을 모금했다."],["He was born and [raised] in the country.","그는 시골에서 태어나고 자랐다."],["The scientist [raised] many questions about a popular theory.","그 과학자는 한 유명한 이론에 대해 많은 의문을 제기했다."],["The accident [raises] doubts about the safety of the airline.","그 사고는 항공사의 안정성에 대한 의구심을 불러일으켰다."]]},{"u":22,"n":660,"w":"degree","m":"1. 정도 2. 도 ((각도, 온도의 단위)) 3. 학위","ex":[["We can predict the weather with a surprising [degree] of accuracy.","우리는 놀라운 정도의 정확도로 날씨를 예측할 수 있다."],["The angle of a corner of a square is 90 [degrees].","정사각형의 한 모서리의 각은 90도이다."],["a [degree] in economics","경제학 학위"]]},{"u":23,"n":661,"w":"commute","m":"통근하다, 통학하다; 통근 (거리), 통학","ex":[["I [commute] to my school by bus every morning.","나는 매일 아침 학교에 버스로 통학한다."]]},{"u":23,"n":662,"w":"traffic","m":"(왕래하는) 차량, 교통(량)","ex":[["Every morning, the downtown roads are busy with [traffic].","매일 아침, 도심의 도로는 차량으로 혼잡하다."]]},{"u":23,"n":663,"w":"vehicle","m":"탈것, 차량","ex":[["The roads are filled with various [vehicles] of all kinds.","도로는 모든 종류의 다양한 차량으로 가득하다."]]},{"u":23,"n":664,"w":"rush","m":"서두르다; 돌진하다; 분주함; 돌진","ex":[["Sometimes we should [rush] to catch the bus.","때때로 우리는 버스를 잡기 위해 서둘러야 한다."],["Firefighters [rushed] to the scene of the accident.","소방관들이 사고 현장으로 돌진했다."]]},{"u":23,"n":665,"w":"irritated","m":"1. 짜증 난 2. (피부 등이) 따끔거리는; 염증이 일어난","ex":[["If we can’t catch the bus on time, we feel [irritated].","제때 버스를 잡지 못하면, 우리는 짜증 난다."],["My skin is [irritated] from too much sun.","내 피부가 너무 많은 햇볕으로 인해 따끔거린다."]]},{"u":23,"n":666,"w":"exhausted","m":"1. 매우 지친 2. 고갈된, 다 써버린","ex":[["Commuting to school every day makes me [exhausted].","매일 통학하는 것이 나를 매우 지치게 한다."],["Oil will be [exhausted] in the near future.","석유는 가까운 미래에 고갈될 것이다."]]},{"u":23,"n":667,"w":"stress","m":"1. 스트레스 2. 강조; 1. 스트레스를 받다 2. 강조하다","ex":[["Continuous [stress] makes it hard to concentrate.","지속적인 스트레스는 집중하는 것을 어렵게 한다."],["The teacher laid [stress] on the need for good study habits.","선생님은 좋은 학습 습관의 필요성을 강조하셨다."]]},{"u":23,"n":668,"w":"fatigue","m":"피로, 피곤","ex":[["Stress from studying is one of the causes of [fatigue].","학업으로 인한 스트레스가 피로의 원인 중 하나이다."]]},{"u":23,"n":669,"w":"sore","m":"아픈, 따가운","ex":[["Due to fatigue, my neck and shoulders are [sore].","피로로 인해, 내 목과 어깨가 아프다."]]},{"u":23,"n":670,"w":"anxiety","m":"1. 걱정, 근심 2. 열망, 갈망","ex":[["The thought of exams fills me with [anxiety].","시험에 대한 생각으로 나는 걱정이 많다."],["She has always had an [anxiety] to succeed.","그녀는 항상 성공하고픈 열망을 가지고 있었다."]]},{"u":23,"n":671,"w":"disturb","m":"1. 방해하다 2. 불안하게 만들다","ex":[["Don’t [disturb] me when I’m studying.","내가 공부 중일 때는 방해하지 마라."],["The news shocked and [disturbed] her.","그 소식은 그녀에게 충격을 주었고 그녀를 불안하게 만들었다."]]},{"u":23,"n":672,"w":"dramatic","m":"1. 급격한; 극적인 2. 연극의; 희곡의","ex":[["Many of us long for a [dramatic] rise in our school grades.","우리 중 많은 이들이 학교 성적의 급격한 상승을 바란다."],["a [dramatic] critic","연극 평론가"]]},{"u":23,"n":673,"w":"inhale","m":"(숨을) 들이마시다, 흡입하다","ex":[["[Inhale] deeply, with your arms wide open.","양팔을 넓게 벌리며 깊게 숨을 들이마셔라."]]},{"u":23,"n":674,"w":"sight","m":"1. 시력; 시야 2. 보기, 봄 3. ((the 복수형)) 관광지, 명소; (눈에 보이는) 광경; 보다, 발견하다","ex":[["To protect your [sight], don’t read in dark rooms.","시력을 보호하려면, 어두운 방에서 책을 읽지 마라."],["The [sights] near the ocean were famous.","바다 근처에 있는 그 관광지는 유명했다."],["The pilot [sighted] the airport and attempted to land.","조종사는 공항을 발견하고 착륙을 시도했다."]]},{"u":23,"n":675,"w":"stiff","m":"뻣뻣한, 굳은; 딱딱한, 완고한","ex":[["If you sit on a small chair for a long time, your back gets [stiff].","작은 의자에 오랫동안 앉아 있으면, 허리가 뻣뻣해진다."]]},{"u":23,"n":676,"w":"straighten","m":"곧게 하다, 똑바르게 되다","ex":[["It is good to sit up and [straighten] your back when you study.","공부할 때는 똑바로 앉아서 등을 곧게 하는 것이 좋다."]]},{"u":23,"n":677,"w":"muscle","m":"근육; 힘, 근력","ex":[["Stretching helps your [muscles] relax.","스트레칭은 근육이 이완되는 것을 도와준다."]]},{"u":23,"n":678,"w":"refresh","m":"상쾌하게 하다; 기운 나게 하다","ex":[["A cool glass of water will [refresh] you.","시원한 물 한 잔이 너를 상쾌하게 할 것이다."]]},{"u":23,"n":679,"w":"bathe","m":"(몸을) 씻다; 세척하다","ex":[["[Bathing] with warm water helps you sleep well at night.","따뜻한 물로 씻는 것은 밤에 숙면을 취하도록 도와준다."]]},{"u":23,"n":680,"w":"improve","m":"향상시키다, 개선되다","ex":[["Good physical health can help [improve] your mental health.","좋은 신체적 건강은 정신적 건강을 향상시키는 데 도움이 될 수 있다."]]},{"u":23,"n":681,"w":"patience","m":"참을성, 인내(심)","ex":[["You will learn [patience] if you do yoga.","요가를 하면 인내심을 배우게 될 것이다."]]},{"u":23,"n":682,"w":"academic","m":"1. 학업의, 학교의 2. 학구적인","ex":[["Students’ health is closely linked to their [academic] performance.","학생들의 건강은 학업 성취와 밀접하게 관련이 있다."],["[academic] interest","학구적인 관심"]]},{"u":23,"n":683,"w":"steady","m":"1. 꾸준한; 한결같은 2. 안정된, 흔들림 없는","ex":[["Slow and [steady] exercise is good for our health.","느리더라도 꾸준한 운동이 우리의 건강에 좋다."],["To persuade others, your voice should be [steady] and firm.","다른 이들을 설득하기 위해서는 목소리가 안정되고단호해야 한다."]]},{"u":23,"n":684,"w":"decrease","m":"감소하다, 감소시키다; 감소","ex":[["If you do more exercise, your weight will [decrease].","운동을 더 많이 하면 체중이 감소할 것이다."]]},{"u":23,"n":685,"w":"loose","m":"헐거운, 느슨한; 매여 있지 않은","ex":[["Wearing [loose] clothes can help your blood circulation.","헐거운 옷을 입는 것은 혈액 순환에 도움이 될 수 있다."]]},{"u":23,"n":686,"w":"rate","m":"1. 비율, -율 2. 속도 3. 요금; (시간당) 급료 4. 등급을 매기다, 평가하다; 등급","ex":[["Crime [rates] have declined in recent years.","범죄율이 최근 몇 년간 감소해 왔다."],["The population of India has been growing at an alarming [rate].","인도의 인구는 놀라운 속도로 증가해오고 있다."],["Regular admission to the theater is $12, and the student [rate] is $8.","그 극장의 일반 입장료는 12달러이며, 학생 요금은 8달러이다."],["The movie was [rated] “15.”","그 영화는 ‘15세 관람가’로 등급이 매겨졌다."]]},{"u":23,"n":687,"w":"beat","m":"1. (반복적으로) 두드리다 2. (북 등의 악기가) 둥둥 울리다 3. 박자, 장단 4. (심장이) 뛰다; 고동, 맥박 5. 때리다 6. 이기다","ex":[["The raindrops [beat] on the roof.","빗방울이 지붕을 두드린다."],["music with a slow [beat]","느린 박자의 음악"],["My heart started to [beat] fast with excitement.","내 심장은 흥분하여 빠르게 뛰기 시작했다."],["My brother was so angry that he [beat] me.","우리 형은 너무 화가 나서 나를 때렸다."],["Our team has [beaten] the other team 5 to 3.","우리 팀은 상대 팀을 5대 3으로 이겼다."]]},{"u":23,"n":688,"w":"order","m":"1. 순서 2. 정돈; 질서; 정돈하다 3. 명령, 지시; 명령하다 4. 주문; 주문하다","ex":[["The children lined up in [order] of age.","아이들은 나이 순서대로 줄을 섰다."],["[Order] your ideas before beginning to write.","글쓰기를 시작하기 전에 너의 생각을 정돈해라."],["A police officer [ordered] the car to stop.","한 경찰관이 그 차에게 멈추라고 명령했다."],["I placed an [order] for a book yesterday.","나는 어제 책 한 권을 주문했다."]]},{"u":23,"n":689,"w":"class","m":"1. (사회의) 계층, 계급 2. 등급 3. 종류, 부류 4. 반, 학급; 반 학생들 5. 수업","ex":[["People from all social [classes] should be given equal rights.","모든 사회 계층의 사람들은 동등한 권리를 부여받아야 한다."],["The airline upgraded my seat [class] to a better one.","그 항공사는 내 좌석 등급을 더 좋은 등급으로 올려주었다."],["Be careful when you take different [classes] of drugs.","서로 다른 종류의 약을 복용할 때는 주의하라."],["I was named [class] president.","나는 학급 회장으로 임명되었다."],["I missed science [class] last week.","나는 지난주에 과학 수업을 듣지 못했다."]]},{"u":23,"n":690,"w":"draw","m":"1. 끌다 2. 그리다 3. 무승부; 비기다 4. 끌어내다 5. (제비를) 뽑다; 추첨","ex":[["a carriage [drawn] by horses","말에 의해 끌리는 마차"],["A man [drew] me a rough map to the hospital.","한 남자가 나에게 병원까지 가는 약도를 그려주었다."],["The game ended in a [draw].","그 경기는 무승부로 끝났다."],["I finally [drew] a conclusion from the facts.","나는 마침내 그 사실들에서 결론을 끌어냈다."],["The host [drew] the winning ticket from a box.","사회자는 상자에서 당첨권을 뽑았다."]]},{"u":24,"n":691,"w":"aim","m":"1. 목표, 목적 2. 겨냥, 조준; 1. 목표로 하다 2. 겨냥하다, 겨누다","ex":[["The [aims] of learning vary from person to person.","학습의 목표는 사람마다 다르다."],["I [aimed] at the tree, but I missed.","나는 그 나무를 겨냥했지만 빗나갔다."]]},{"u":24,"n":692,"w":"target","m":"목표; (공격의) 표적; 목표로 삼다; 표적으로 삼다","ex":[["Try to set clear [targets] when you study.","공부할 때는 분명한 목표를 정하도록 노력해라."],["Tourists are more likely to be [targeted] by the thieves.","관광객들은 절도범들의 표적이 될 가능성이 더 크다."]]},{"u":24,"n":693,"w":"ongoing","m":"진행 중인","ex":[["Remember to do things that keep your interest in the subject [ongoing].","진행 중인 주제에 대한 흥미를 유지할 것을 명심해라."]]},{"u":24,"n":694,"w":"amazing","m":"놀라운, 놀랄 만한","ex":[["A vacation can be an [amazing] opportunity to learn something new.","방학은 새로운 것을 배울 놀라운 기회가 될 수 있다."]]},{"u":24,"n":695,"w":"master","m":"통달하다, 완전히 익히다; 1. 대가, 거장 2. 주인","ex":[["However, it’s not easy to [master] a language in a short period of time.","그러나 짧은 기간 안에 언어를 통달하는 것은 쉽지 않다."],["The magician is known as a [master] of card tricks.","그 마술사는 카드 마술의 대가로 알려져 있다."],["He is the [master] of this house.","그는 이 집의 주인이다."]]},{"u":24,"n":696,"w":"situation","m":"상황, 환경","ex":[["You need to make a plan, considering your [situation].","너의 상황을 고려하여 계획을 세워야 한다."]]},{"u":24,"n":697,"w":"semester","m":"(1년 2학기 제도에서의) 학기","ex":[["The math classes were especially difficult last [semester].","지난 학기에 수학 수업이 특히 어려웠다."]]},{"u":24,"n":698,"w":"embarrassed","m":"당황스러운, 난처한","ex":[["Tony was [embarrassed] by his low math grade.","Tony는 수학 성적이 낮아 당황스러웠다."]]},{"u":24,"n":699,"w":"struggle","m":"애쓰다, 분투하다; 분투, 투쟁","ex":[["This semester, he has [struggled] to do well in math tests.","이번 학기에 그는 수학 시험을 잘 보려고 애썼다."]]},{"u":24,"n":700,"w":"primary","m":"1. 주된, 주요한 2. 초기의, 최초의","ex":[["His [primary] goal is to be better at math.","그의 주된 목표는 수학을 더 잘하는 것이다."],["The patient’s disease is still in its [primary] stage.","그 환자의 병은 아직 초기 단계에 있다."]]},{"u":24,"n":701,"w":"devote","m":"(시간, 노력 등을) 바치다, 쏟다","ex":[["Every night he [devotes] one hour to solving math problems.","매일 밤 그는 한 시간씩을 수학 문제를 푸는 데 쏟는다."]]},{"u":24,"n":702,"w":"accurate","m":"정확한, 정밀한","ex":[["He needs to be more [accurate] with his calculations.","그는 계산에 더 정확해야한다."]]},{"u":24,"n":703,"w":"acquire","m":"(노력으로) 얻다, 습득하다","ex":[["He should take his time to [acquire] that accuracy.","그는 그 정확성을 얻기 위해 시간을 들여야 한다."]]},{"u":24,"n":704,"w":"chart","m":"도표; 도표를 만들다","ex":[["You can make a study plan using a [chart].","도표를 활용하여 공부 계획을 짤 수 있다."]]},{"u":24,"n":705,"w":"detail","m":"세부 사항, 상세한 설명; 상세히 설명하다","ex":[["Try to put [details] in your chart.","도표에 세부 사항들을 넣도록 노력하라."]]},{"u":24,"n":706,"w":"regular","m":"1. 규칙적인, 정기적인 2. 평상시의, 보통의","ex":[["David made a [regular] schedule for studying English and math.","David는 영어와 수학 공부를 위한 규칙적인 일정을 세웠다."],["The restaurant’s [regular] opening hours are 11 a.m. to 10 p.m.","그 식당의 평상시 영업시간은 오전 11시부터 오후 10시까지이다."]]},{"u":24,"n":707,"w":"arrange","m":"1. (미리) 준비하다, 마련하다 2. 정리하다, 배열하다","ex":[["He [arranged] his study schedule on a weekly basis.","그는 일주일 단위로 공부 계획을 준비했다."],["She [arranged] her photos on the desk.","그녀는 탁자에 자신의 사진들을 정리했다."]]},{"u":24,"n":708,"w":"specific","m":"1. 구체적인; 명확한 2. 특정한","ex":[["Make [specific] study plans before you start studying.","공부를 시작하기 전에 구체적인 공부 계획을 세워라."],["She only eats a [specific] type of bread.","그녀는 특정한 종류의 빵만을 먹는다."]]},{"u":24,"n":709,"w":"effort","m":"노력, 수고","ex":[["Make an [effort] to eat well and exercise regularly.","잘 먹고 규칙적으로 운동하도록 노력하라."]]},{"u":24,"n":710,"w":"constant","m":"1. 끊임없는, 계속되는 2. 일정한, 변함없는","ex":[["Be careful not to make yourself too tired from [constant] studying.","계속되는 공부로 자신을 너무 지치게 만들지 않도록 조심하라."],["In this experiment, it is important to keep the temperature [constant].","이 실험에서는, 온도를 일정하게 유지하는 것이 중요하다."]]},{"u":24,"n":711,"w":"input","m":"1. 조언 2. (시간 등의) 투입 3. ((컴퓨터)) 입력","ex":[["Sometimes, other people’s [input] helps you make a better decision.","때로는 다른 사람들의 조언이 네가 더 나은 결정을 내리는 데 도움이 된다."],["I didn’t have much [input] into the project.","나는 그 프로젝트에 많이 (시간을) 투입하지 않았다."],["A mouse is a type of computer [input] device.","마우스는 컴퓨터 입력 장치의 한 종류이다."]]},{"u":24,"n":712,"w":"stimulate","m":"자극하다, 격려하다; 흥미를 불러일으키다","ex":[["Setting high goals can [stimulate] you.","높은 목표를 설정하는 것은 너를 자극할 수 있다."]]},{"u":24,"n":713,"w":"attempt","m":"시도하다; 시도","ex":[["[Attempt] to create good study habits.","좋은 공부 습관을 만들도록 시도하라."],["The athlete broke the world record in his first [attempt].","그 육상선수는 자신의 첫 번째 시도에서 세계 신기록을 경신했다."]]},{"u":24,"n":714,"w":"range","m":"범위, 범주; (범위에) 이르다","ex":[["Try to read books covering a wide [range] of topics.","광범위한 주제를 다루는 책들을 읽으려 노력하라."],["This class consists of children whose ages [range] from 4 to 7.","이 수업은 나이가 4세부터 7세까지 이르는아이들로 구성된다."]]},{"u":24,"n":715,"w":"text","m":"1. 글; 본문 2. 교과서; 문자 메시지를 보내다","ex":[["Many people find it easier to remember images rather than [text].","많은 사람들은 글보다 이미지로 기억하기가 더 쉽다는 것을 알게 된다."],["[Text] me when you’re on your way home.","집에 가는 길에 내게 문자 메시지를 보내."]]},{"u":24,"n":716,"w":"summarize","m":"요약하다, 간략하게 말하다","ex":[["[Summarizing] the main points can help you review more easily.","요점을 요약하는 것은 네가 복습하기 더 쉽게 해줄 수 있다."]]},{"u":24,"n":717,"w":"chance","m":"1. 우연(한 일) 2. 운, 운수 3. (좋은) 기회 4. 가능성, 가망","ex":[["I met my old friend at the grocery store by [chance].","나는 내 옛 친구를 식료품점에서 우연히 만났다."],["Dice and roulette are games of [chance].","주사위 게임과 룰렛은 운에 의한 게임이다."],["He was given a second [chance] to prove his abilities.","그는 자신의 능력을 증명할 두 번째 기회를 얻었다."],["The [chance] of rain this afternoon is less than 20%.","오늘 오후에 비가 올 가능성은 20퍼센트 미만이다."]]},{"u":24,"n":718,"w":"bear","m":"1. 나르다, 가져가다[오다] 2. (몸에) 지니다, (마음에) 품다 3. (무거운 것을) 지탱하다 4. 참다, 견디다 5. (아이를) 낳다; 열매를 맺다","ex":[["The town still [bears] the wounds of the bombings during the war.","그 도시는 전쟁 중 폭격의 상처들을 여전히 지니고 있다."],["The ice is too thin to [bear] your weight.","그 얼음은 너무 얇아서 네 체중을 지탱할 수 없다."],["I can’t [bear] the heat very well.","나는 더위를 그다지 잘 참지 못한다."],["Most animals [bear] their young in the spring.","대부분의 동물은 봄에 새끼를 낳는다."]]},{"u":24,"n":719,"w":"support","m":"1. 떠받치다; 버팀대 2. 뒷받침하다; 근거 3. 지지하다; 지지, 옹호 4. 지원하다; 지원, 후원 5. 부양하다","ex":[["The huge columns [support] the roof of the temple.","거대한 기둥들이 그 사원의 지붕을 떠받친다."],["The lawyer called a witness to [support] his case.","그 변호사는 자신의 주장을 뒷받침할 증인을 소환했다."],["Galileo strongly [supported] the theory that the center of the solar system was not Earth but the sun.","Galileo는 태양계의 중심은 지구가 아니라 태양이라는 이론을 강력하게 지지했다."],["My dream is to make an organization that [supports] poor children.","나의 꿈은 빈곤 아동을 지원하는 기관을 설립하는 것이다."],["Parents [support] their children until they become adults.","부모들은 자신의 아이들이 어른이 될 때까지 부양한다."]]},{"u":24,"n":720,"w":"match","m":"1. 어울리다; 잘 어울리는 사람[것] 2. 일치하다, 아주 비슷하다 3. 경쟁 상대; 필적하다 4. 경기, 시합 5. 성냥","ex":[["The curtain seems to [match] the carpet perfectly.","그 커튼은 카펫과 완벽하게 어울리는 것처럼 보인다."],["The thief’s fingerprint [matched] the evidence at the crime scene.","그 도둑의 지문은 범죄 현장에 있던 증거와 일치했다."],["Carlos was no [match] for me at tennis.","Carlos는 테니스에서 내 경쟁 상대가 아니었다."],["Our team lost a close [match].","우리 팀은 막상막하의 경기에서 졌다."],["I lit some candles with a [match].","나는 성냥으로 초 몇 개에 불을 붙였다."]]},{"u":25,"n":721,"w":"deny","m":"1. 부인[부정]하다 2. 거부[거절]하다","ex":[["We cannot [deny] that cultural differences exist.","우리는 문화 차이가 존재하는 것을 부인할 수 없다."],["[deny] the favor","호의를 거절하다"]]},{"u":25,"n":722,"w":"ethnic","m":"민족의, 인종의; 민족 전통의","ex":[["There are various [ethnic] groups in the world.","세계에는 다양한 민족 집단이 있다."]]},{"u":25,"n":723,"w":"insist","m":"1. 고집하다, 우기다 2. (사실이라고) 주장하다","ex":[["We shouldn’t [insist] our own culture is better.","우리 문화가 더 좋은 것이라고 고집하면 안 된다."],["Frank [insisted] that the problems were not his fault.","Frank는 그 문제들이 자신의 잘못이 아니라고 주장했다."]]},{"u":25,"n":724,"w":"narrow-minded","m":"편협한, 속이 좁은","ex":[["A [narrow-minded] attitude is not helpful for understanding other cultures.","편협한 태도는 다른 문화를 이해하는 데 도움이 되지 않는다."]]},{"u":25,"n":725,"w":"convince","m":"1. 확신시키다, 납득시키다 2. 설득하다","ex":[["We are [convinced] that each culture has its own value.","우리는 문화마다 각자의 가치를 지닌다고 확신한다."],["The police tried to [convince] the man to drop the weapon.","경찰은 그 남자에게 무기를 내려놓으라고 설득하려고 노력했다."]]},{"u":25,"n":726,"w":"mutual","m":"1. 상호의, 서로의 2. 공통의, 공동의","ex":[["[Mutual] respect is important when you make foreign friends.","외국인 친구들을 사귈 때는 상호 존중이 중요하다."],["a [mutual] friend","공통의친구"]]},{"u":25,"n":727,"w":"accustom","m":"익숙해지게 하다, 익히다","ex":[["It takes time for you to [accustom] yourself to a new culture.","새로운 문화에 익숙해지는 것은 시간이 걸린다."]]},{"u":25,"n":728,"w":"suburb","m":"(도시에 인접한) 교외, 근교","ex":[["When you live abroad, you could live in the city or a [suburb].","해외에서 살 때, 너는 도시에서 살 수도 있고 교외에서 살 수도 있다."]]},{"u":25,"n":729,"w":"hospitality","m":"환대, 친절","ex":[["The great [hospitality] of local people will make you feel at home.","현지 사람들의 큰 환대는 너의 마음을 편하게 해줄 것이다."]]},{"u":25,"n":730,"w":"hometown","m":"고향","ex":[["However, people usually miss their [hometown] when they are abroad.","하지만 사람들은 외국에 있을 때 대개 자신의 고향을 그리워한다."]]},{"u":25,"n":731,"w":"homesick","m":"향수병의, 고향을 그리워하는","ex":[["It’s natural to feel [homesick] when traveling overseas.","해외로 여행을 다닐 때 향수를 느끼는 것은 당연하다."]]},{"u":25,"n":732,"w":"racism","m":"인종 차별, 인종주의; 인종적 우월감","ex":[["[Racism] could be caused by a misunderstanding of cultural differences.","인종 차별은 문화적 차이에 대한 오해로 발생할 수 있다."]]},{"u":25,"n":733,"w":"frustrated","m":"좌절한, 낙담한","ex":[["Those who experience it may feel [frustrated].","그것을 겪는 사람들은 좌절감을 느낄지도 모른다."]]},{"u":25,"n":734,"w":"ignore","m":"무시하다, 모르는 체하다","ex":[["People should not [ignore] the problem of racism.","사람들은 인종 차별 문제를 무시해서는 안 된다."]]},{"u":25,"n":735,"w":"courtesy","m":"공손함, 정중함","ex":[["Try to treat others with [courtesy] all the time.","항상 타인을 공손하게 대하도록 노력하라."]]},{"u":25,"n":736,"w":"swear","m":"1. 맹세하다 2. 욕을 하다","ex":[["[Swear] to yourself that you’ll always respect other people’s cultures.","다른 사람들의 문화를 항상 존중할 것이라고 스스로 맹세해라."],["Don’t [swear] in front of the children.","아이들 앞에서 욕하지 마라."]]},{"u":25,"n":737,"w":"awkward","m":"어색한; 서투른","ex":[["You could feel [awkward] when you meet foreign friends.","외국인 친구들을 만나면 어색할 수도 있다."]]},{"u":25,"n":738,"w":"passive","m":"수동적인, 소극적인","ex":[["Don’t be [passive], and try to talk as much as you can.","소극적으로 굴지 말고 가능한 한 많이 얘기하도록 노력해라."]]},{"u":25,"n":739,"w":"appeal","m":"1. 호소하다 2. 관심을 끌다; 1. 호소 2. 매력","ex":[["Sometimes, [appeal] to your friends for help.","때로는 친구들에게 도움을 호소해라."],["The job fair [appealed] to students from many different majors.","취업 박람회는 다양한 전공의 학생들의 관심을 끌었다."],["The newly decorated rooms will improve the [appeal] of this hotel.","새롭게 꾸며진 방은 이 호텔의 매력을 향상시킬 것이다."]]},{"u":25,"n":740,"w":"solitary","m":"혼자의; 혼자 있기를 좋아하는","ex":[["Instead of being [solitary], associate with them.","혼자 있기보다는 그들과 어울려라."]]},{"u":25,"n":741,"w":"peninsula","m":"반도 ((3면이 바다로 둘러싸인 땅))","ex":[["Korea is a [peninsula] surrounded by water on three sides.","한국은 3면이 바다로 둘러싸인 반도이다."]]},{"u":25,"n":742,"w":"costume","m":"의상, 복장; 분장","ex":[["Hanbok is the Korean traditional [costume].","한복은 한국의 전통 의상이다."]]},{"u":25,"n":743,"w":"oriental","m":"동양의, 동양인의; 동양인","ex":[["Korean [oriental] paintings are called hangukhwa.","한국의 동양화는 한국화라고 불린다."]]},{"u":25,"n":744,"w":"currency","m":"1. 통화, 화폐 2. 통용","ex":[["The Korean won is the official [currency] of Korea.","원화는 한국의 공식 화폐이다."]]},{"u":25,"n":745,"w":"specialty / speciality","m":"1. 특산품, 명물 2. 전문, 전공","ex":[["Kimchi is a [specialty] of Korea.","김치는 한국의 특산품이다."],["a doctor whose [specialty] is skin problems","피부 질환 전문 의사"]]},{"u":25,"n":746,"w":"skyscraper","m":"고층 건물","ex":[["Seoul has both beautiful palaces and large [skyscrapers].","서울에는 아름다운 궁들과 큰 고층 건물들이 모두 있다."]]},{"u":25,"n":747,"w":"treat","m":"1. 취급하다, 다루다 2. 논의하다 3. 치료하다 4. 대접하다; 한턱내다; 대접","ex":[["My sister still [treats] me like a baby.","우리 언니는 나를 아직도 아기처럼 다룬다."],["The matter of global warming was [treated] specifically in my report.","내 보고서에서 지구 온난화에 관한 문제가 구체적으로 논의되었다."],["He was [treated] for heart disease.","그는 심장병으로 치료받았다."],["I’ll [treat] you to dinner tonight.","오늘 밤에 내가 너에게 저녁을 대접할게."]]},{"u":25,"n":748,"w":"spot","m":"1. 점, 반점 2. 얼룩 3. (피부의) 발진, 뾰루지 4. (특정한) 장소 5. 발견하다, 알아채다","ex":[["Leopards have black [spots] on their body.","표범은 몸에 검은 점을 가지고 있다."],["His jacket was covered with [spots] of mud.","그의 재킷은 진흙 얼룩으로 뒤덮였다."],["The doctor advised him not to touch the [spots] on his skin.","의사는 그에게 피부의 뾰루지를 만지지 말라고 충고했다."],["The park near the ocean is the perfect [spot] for a picnic.","바다 근처의 그 공원은 소풍을 위한 완벽한 장소이다."],["Nobody [spotted] that the cake on the table was fake.","탁자 위의 그 케이크가 가짜라는 것을 아무도 알아채지 못했다."]]},{"u":25,"n":749,"w":"change","m":"1. 변하다; 바꾸다; 변화 2. 색다른 것; 기분 전환 3. 갈아타다 4. 갈아입다 5. 환전하다 6. 잔돈, 거스름돈","ex":[["Let’s eat out for a [change].","기분 전환을 위해서 외식하자."],["Passengers for City Hall should [change] to line 1.","시청으로 가는 승객분들은 1호선으로 갈아타야 합니다."],["I [changed] into my swimsuit and ran to the pool.","나는 수영복으로 갈아입고 수영장으로 뛰어갔다."],["I need to [change] some dollars into pounds.","나는 달러를 파운드화로 좀 환전해야 한다."],["Here’s $10. You can keep the [change].","여기 10달러입니다. 잔돈은 가지세요."]]},{"u":25,"n":750,"w":"present","m":"1. 현재; 현재의 2. 참석[출석]한, (~에) 있는 3. 주다, 수여하다 4. 보여주다; 제시[제출]하다 5. 선물 6. (문제 등을) 일으키다","ex":[["Obsessing about the past causes unhappiness in the [present].","과거에 집착하는 것은 현재에 불행을 일으킨다."],["There were 35 artists [present] at the music festival.","음악 페스티벌에 참석한 35명의 예술가들이 있었다."],["The first prize of the essay contest was [presented] to her.","글짓기 대회의 1등상이 그녀에게 수여되었다."],["She tried to [present] herself as smart when she took an interview.","그녀는 면접을 볼 때 자신을 똑똑하게 보여주기 위해 노력했다."],["Santa Claus is known for giving [presents] to children.","Santa Claus는 아이들에게 선물을 주는 것으로 알려져 있다."],["Her request didn’t [present] us with any problems.","그녀의 요청은 우리에게 어떠한 문제도 일으키지 않았다."]]},{"u":26,"n":751,"w":"dynasty","m":"왕조, 왕가","ex":[["China’s Ming [Dynasty] was famous for its art.","중국의 명 왕조는 예술로 유명했다."]]},{"u":26,"n":752,"w":"pioneer","m":"개척자, 선구자; 개척하다","ex":[["The [pioneers] of America were mostly Europeans.","미국의 개척자들은 주로 유럽인들이었다."],["Charles Darwin [pioneered] a theory of evolution.","Charles Darwin은 진화론을 개척했다."]]},{"u":26,"n":753,"w":"revolution","m":"1. 혁명, 대변혁 2. 회전; ((천문)) 공전","ex":[["The French [Revolution] made farmers rich.","프랑스 혁명은 농부들을 부유하게 만들었다."],["the [revolution] of Earth around the sun","태양의 주위를 도는 지구의 공전"]]},{"u":26,"n":754,"w":"triumph","m":"(큰) 업적; 승리(감); 승리를 거두다","ex":[["The Sphinx was built in honor of the [triumph] of a powerful king.","그 스핑크스상은 한 강력한 왕의 업적을 기리기 위해 지어졌다."]]},{"u":26,"n":755,"w":"warrior","m":"전사, 무사","ex":[["Sparta, an ancient Greek city, was famous for its brave [warriors].","고대 그리스의 도시인 스파르타는 용감한 전사들로 유명했다."]]},{"u":26,"n":756,"w":"ceremony","m":"의식, 식","ex":[["There are many special [ceremonies] that tourists can experience.","관광객들이 경험할 수 있는 특별한 의식이 많이 있다."]]},{"u":26,"n":757,"w":"landmark","m":"1. 유명한 지형지물, 랜드마크 2. 획기적인 사건[발견]","ex":[["The Eiffel Tower is a [landmark] of Paris.","에펠탑은 파리의 랜드마크이다."],["The moon landing was a [landmark] in space exploration.","달 착륙은 우주 탐사에 있어서 획기적인 사건이었다."]]},{"u":26,"n":758,"w":"exhibit","m":"1. 전시하다 2. (감정, 관심 등을) 보이다, 드러내다; 전시(품)","ex":[["The museum [exhibits] Renaissance paintings.","그 박물관은 르네상스 시대의 그림들을 전시한다."],["He [exhibited] an interest in music when he was young.","어렸을 때 그는 음악에 관심을 보였다."]]},{"u":26,"n":759,"w":"portrait","m":"1. 초상(화); 인물 사진 2. (상세한) 묘사","ex":[["It also has [portraits] of kings and queens.","그곳에는 왕들과 왕비들의 초상화들도 있다."],["The book presents a [portrait] of life in a small town.","그 책은 작은 마을에서의 삶에 대한 묘사를 보여준다."]]},{"u":26,"n":760,"w":"masterpiece","m":"걸작, 명작","ex":[["The Mona Lisa is Leonardo da Vinci’s [masterpiece].","‘모나리자’는 Leonardo da Vinci의 걸작이다."]]},{"u":26,"n":761,"w":"statue","m":"조각상, 상(像)","ex":[["The U.S. was given the [Statue] of Liberty by the people of France in 1884.","미국은 1884년에 프랑스인들로부터 자유의 여신상을 받았다."]]},{"u":26,"n":762,"w":"sculpture","m":"조각(상)","ex":[["The [sculpture] of the king was carved from one large stone.","그 왕의 조각상은 하나의 커다란 돌로 조각되었다."]]},{"u":26,"n":763,"w":"folk","m":"민속의; (일반적인) 사람들","ex":[["The [folk] music of Argentina is known mostly for the Tango.","아르헨티나의 민속 음악은 주로 탱고로 알려져 있다."],["Some [folks] think gun laws should be changed.","어떤 사람들은 총기 규제법이 바뀌어야 한다고 생각한다."]]},{"u":26,"n":764,"w":"performance","m":"1. 공연, 연주 2. 수행, 실행 3. 성과","ex":[["We can enjoy [performances] of folk dances on weekends.","우리는 주말마다 민속춤 공연을 즐길 수 있다."],["She was careful in the [performance] of her duty.","그녀는 자신의 업무 수행에 있어서 신중했다."],["employees with strong job [performances]","업무 성과가 높은 직원들"]]},{"u":26,"n":765,"w":"pitch","m":"1. 음의 높이 2. (감정, 활동의) 정도; 최고조; 내던지다","ex":[["Soprano singers can sing at a very high [pitch].","소프라노 가수들은 매우 높은 음의 높이로 노래 부를 수 있다."],["Conflict between the two groups has risen to a high [pitch].","두 집단 사이의 갈등이 높은 정도로 고조되었다."],["She [pitched] the empty box into the wastebasket.","그녀는 빈 상자를 쓰레기통에 내던졌다."]]},{"u":26,"n":766,"w":"journey","m":"(특히 멀리 가는) 여행, 여정","ex":[["We had a long [journey] from Korea to the USA.","우리는 한국에서 미국까지 긴 여행을 했다."]]},{"u":26,"n":767,"w":"destination","m":"목적지, 행선지","ex":[["Your ticket shows how long it’ll take to get to your [destination].","티켓은 목적지까지 가는 데 얼마나 걸릴지를 알려준다."]]},{"u":26,"n":768,"w":"passenger","m":"승객, 탑승객","ex":[["[Passengers] should arrive three hours before their flight.","승객들은 비행 세 시간 전에 도착해야 한다."]]},{"u":26,"n":769,"w":"transportation","m":"교통수단; 운송, 수송 (수단)","ex":[["You need to find [transportation] from the airport to your hotel.","공항에서 호텔까지 가는 교통수단을 찾을 필요가 있다."]]},{"u":26,"n":770,"w":"shortcut","m":"1. 지름길 2. 손쉬운 방법","ex":[["We took a [shortcut] to avoid the traffic jam.","우리는 교통 체증을 피하고자 지름길로 갔다."],["There are no [shortcuts] to learning another language.","외국어를 배우는 데 손쉬운 방법은 없다."]]},{"u":26,"n":771,"w":"avenue","m":"(도시의) 대로, 거리, –가(街)","ex":[["We searched for an [avenue] to our hotel on the map.","우리는 호텔로 가는 대로를 지도에서 찾았다."]]},{"u":26,"n":772,"w":"hike","m":"도보 여행, 하이킹; 도보 여행[하이킹]을 가다","ex":[["We took a short [hike] to somewhere nice.","우리는 어딘가 멋진 곳으로 짧은 도보 여행을 떠났다."]]},{"u":26,"n":773,"w":"compass","m":"1. 나침반; (제도용) 컴퍼스 2. 범위","ex":[["When hiking, we need a map and [compass].","도보 여행을 할 때, 우리는 지도와 나침반이 필요하다."],["beyond the [compass] of imagination","상상력이 미치는 범위 밖의"]]},{"u":26,"n":774,"w":"purchase","m":"사다, 구매하다; 구매; 산 물건","ex":[["She would like to [purchase] a present for her parents.","그녀는 부모님께 드릴 선물을 사고 싶어 한다."],["Before making a [purchase], I always read product reviews.","구매하기 전에, 나는 항상 상품 후기를 읽는다."]]},{"u":26,"n":775,"w":"souvenir","m":"(휴가지 등에서 사는) 기념품, 선물","ex":[["I bought a mug as a [souvenir] of my trip.","나는 여행의 기념품으로 머그잔을 샀다."]]},{"u":26,"n":776,"w":"craft","m":"1. 수공예(품) 2. 선박; 비행기; 우주선; 공들여 만들다","ex":[["The gift shop sold traditional [crafts].","그 선물 가게는 전통적인 수공예품을 팔고 있었다."],["The [craft] landed safely on Mars despite engine trouble.","그 우주선은 엔진 이상에도 불구하고 화성에 무사히 착륙했다."],["The chair is [crafted] from natural materials.","그 의자는 천연 재료로 공들여 만들어졌다."]]},{"u":26,"n":777,"w":"check / cheque","m":"1. 억제하다, 억누르다 2. 확인하다, 점검하다; 확인, 점검 3. 수표; 계산서","ex":[["The vaccine is being supplied to [check] the spread of malaria.","그 백신은 말라리아의 확산을 억제하기 위해 보급되고 있다."],["[Check] the label before you put clothes in the washing machine.","세탁기에 옷을 넣기 전에 라벨을 확인해라."],["I wrote a [check] and handed it to the cashier.","나는 수표를 써서 계산대 직원에게 건넸다."]]},{"u":26,"n":778,"w":"move","m":"1. 움직이다; 움직임 2. (일이) 진행되다, 나아가다 3. 이사하다; 이사 4. 감동시키다","ex":[["She [moved] toward the door when somebody knocked from outside.","누군가 밖에서 노크했을 때, 그녀는 문 쪽으로 움직였다."],["Research about the universe is [moving] in a new direction.","우주에 관한 연구는 새로운 방향으로 진행되고 있다."],["My family [moved] to Busan when I was seven.","우리 가족은 내가 일곱 살일 때 부산으로 이사했다."],["My boyfriend was deeply [moved] by his surprise birthday party.","내 남자친구는 자신의 깜짝 생일 파티에 몹시 감동했다."]]},{"u":26,"n":779,"w":"pay","m":"1. 지불하다 2. 이득이 되다, 수익을 내다 3. 임금, 보수 4. (신념, 행동에 대한) 대가를 치르다","ex":[["My brother [paid] $450 for concert tickets for my whole family.","우리 오빠는 가족 전체의 콘서트 표 비용으로 450달러를 지불했다."],["It [pays] to get some advice before you make an important decision.","중요한 결정을 내리기 전에 조언을 받는 것은 이득이 된다."],["a [pay] raise","임금 인상"],["You have to [pay] for your lies.","너는 네가 한 거짓말에 반드시 대가를 치러야 한다."]]},{"u":26,"n":780,"w":"track","m":"1. 지나간 흔적, (발)자국 2. (밟아서 생긴) 길 3. 추적하다 4. 선로 5. 경주로, 트랙","ex":[["a lion’s [tracks]","사자의 발자국"],["I walked down the sandy [track] to the beach.","나는 해변으로 향하는 모래투성이인 길을 따라 걸어 내려갔다."],["Hunters can [track] a bear by its footsteps.","사냥꾼들은 발자국으로 곰을 추적할 수 있다."],["railroad [tracks]","철도 선로"],["The racer running in [track] 1 is my brother.","1번 트랙에서 달리고 있는 선수는 우리 오빠이다."]]},{"u":27,"n":781,"w":"chef","m":"요리사, 주방장","ex":[["Nowadays, there are many TV programs that [chefs] appear in.","요즘에는 요리사들이 출연하는 TV 프로그램이 많다."]]},{"u":27,"n":782,"w":"popularity","m":"인기; 대중성","ex":[["Some of the chefs have gained great [popularity].","그 요리사들 중 일부는 큰 인기를 얻었다."]]},{"u":27,"n":783,"w":"publish","m":"1. 출판하다, 발행하다 2. 발표하다, 공개하다","ex":[["Books about the famous chefs have been [published].","유명 요리사들에 관한 책들이 출판되어 왔다."],["The findings of the research will be [published] today.","조사 결과가 오늘 발표될 것이다."]]},{"u":27,"n":784,"w":"celebrity","m":"1. 유명 인사 2. 명성","ex":[["Chefs cook with [celebrities] on TV shows.","요리사들은 TV 프로그램에서 유명 인사들과 요리한다."],["The woman gained [celebrity] as an actress.","그 여자는 여배우로서의 명성을 얻었다."]]},{"u":27,"n":785,"w":"entertain","m":"1. 즐겁게 해주다 2. (손님을) 대접하다","ex":[["They [entertain] the viewers with their cooking.","그들은 요리로 시청자들을 즐겁게 해준다."],["We were [entertained] with tea and snacks.","우리는 차와 간식을 대접받았다."]]},{"u":27,"n":786,"w":"instruction","m":"1. (자세한) 설명(서) 2. 지시 3. 교육, 가르침","ex":[["The TV shows give easy and simple [instructions] for cooking.","그 TV 프로그램들은 요리를 위한 쉽고 간단한 설명을 해준다."],["I have strict [instructions] not to let anyone else in.","나는 아무도 들여보내지 말라는 엄격한 지시를 받았다."],["The course of [instruction] covers six months.","교육과정은 6개월이다."]]},{"u":27,"n":787,"w":"ingredient","m":"1. (특히 요리의) 재료, 성분 2. 구성 요소","ex":[["They also explain how to keep [ingredients] fresh.","그들은 어떻게 재료를 신선하게 유지하는지도 설명해준다."],["The family is the most important [ingredient] in society.","가족은 사회를 이루는 가장 중요한 구성 요소이다."]]},{"u":27,"n":788,"w":"create","m":"창조하다; 만들어내다","ex":[["Sometimes, the chefs show a new dish they [created].","때때로 요리사들은 그들이 만들어낸 새로운 요리를 보여준다."]]},{"u":27,"n":789,"w":"combine","m":"결합하다, 결합되다","ex":[["They [combine] ingredients in unexpected ways and surprise us.","그들은 재료를 예상치 못한 방식으로 결합하고우리를 놀라게 한다."]]},{"u":27,"n":790,"w":"recipe","m":"요리법, 조리법","ex":[["The [recipe] needed various kinds of ingredients.","그 요리법은 다양한 종류의 재료가 필요했다."]]},{"u":27,"n":791,"w":"raw","m":"1. 날것의, 익히지 않은 2. 가공하지 않은","ex":[["I prepared some [raw] meat for the stew.","나는 스튜에 쓸 날것의 고기를 약간 준비했다."]]},{"u":27,"n":792,"w":"vegetarian","m":"채식주의자; 채식주의자의","ex":[["I used beans instead of meat for [vegetarians].","나는 채식주의자들을 위해서 고기 대신 콩을 사용했다."]]},{"u":27,"n":793,"w":"chop","m":"(고기, 채소 등을) 잘게 썰다, 자르다","ex":[["I [chopped] the vegetables quickly.","나는 빠르게 채소를 잘게 썰었다."]]},{"u":27,"n":794,"w":"rotten","m":"1. 썩은, 부패한 2. 끔찍한, 형편없는","ex":[["I threw away the [rotten] potato and used a fresh one.","나는 썩은 감자를 버리고 신선한 것을 사용했다."],["I’ve had a [rotten] day today.","난 오늘 끔찍한 하루를 보냈다"]]},{"u":27,"n":795,"w":"stir","m":"1. 휘젓다, 섞다 2. (감정, 기억 등을) 불러일으키다; (마음의) 동요","ex":[["I [stirred] the stew well so it didn’t burn.","나는 스튜가 타지 않도록 잘 휘저었다."],["Her controversial speech caused quite a [stir] at the conference.","논란의 여지가 있는 그녀의 연설은 회의에서 상당한 동요를 일으켰다."]]},{"u":27,"n":796,"w":"spicy","m":"매운; 향이 강한","ex":[["I put some [spicy] sauce into the stew.","나는 스튜에 매운 소스를 조금 넣었다."]]},{"u":27,"n":797,"w":"flavor / flavour","m":"맛, 풍미; 맛을 내다","ex":[["I used some spice to add [flavor] to the food.","나는 음식에 맛을 더하기 위해 양념을 약간 사용했다."],["Mom [flavored] the potatoes with butter, herbs and cheese.","엄마는 감자를 버터, 허브, 그리고 치즈로 맛을 냈다."]]},{"u":27,"n":798,"w":"roast","m":"굽다, 볶다; 구운 요리","ex":[["I also [roasted] the shrimp and some vegetables.","나는 또한 새우와 약간의 야채를 구웠다."]]},{"u":27,"n":799,"w":"lid","m":"1. 뚜껑, 덮개 2. 눈꺼풀","ex":[["The stew started to boil hard, so I took off the [lid] to check on it.","스튜가 펄펄 끓기 시작해서 나는 그것을 살펴보려고 뚜껑을 열었다."],["the upper [lid] of the left eye","왼쪽 눈의 윗눈꺼풀"]]},{"u":27,"n":800,"w":"sip","m":"조금씩 마시다, 홀짝거리다; (음료의) 한 모금","ex":[["The guests [sipped] their wine.","손님들은 와인을 조금씩 마셨다."]]},{"u":27,"n":801,"w":"sour","m":"1. (맛이) 신, 시큼한 2. (우유가) 상한","ex":[["The wine was a little [sour], but they liked it.","와인은 약간 셨지만, 그들은 마음에 들어 했다."],["Milk easily goes [sour] in this hot weather.","이런 더운 날씨에는 우유가 쉽게 상한다."]]},{"u":27,"n":802,"w":"dip","m":"살짝 담그다, 살짝 적시다","ex":[["They [dipped] some bread into the olive oil.","그들은 약간의 빵을 올리브 오일에 살짝 담갔다."]]},{"u":27,"n":803,"w":"chew","m":"씹다; 깨물다","ex":[["They [chewed] the bread well.","그들은 빵을 꼭꼭 씹었다."]]},{"u":27,"n":804,"w":"swallow","m":"삼키다; 1. 삼킴 2. 제비","ex":[["Always chew food well before [swallowing] it.","항상 음식을 삼키기 전에 꼭꼭 씹어라."],["One [swallow] does not make a summer.","제비 한 마리가 왔다고 여름이 오는 것은 아니다. (→ 속단하지 마라.)"]]},{"u":27,"n":805,"w":"leftover","m":"(먹다) 남은 음식; 먹다 남은, 나머지의","ex":[["There were no [leftovers] after they finished their meals.","그들이 식사를 마친 후에 남은 음식은 없었다."],["yesterday’s [leftover] pizza","어제 먹다 남은 피자"]]},{"u":27,"n":806,"w":"count","m":"1. (수를) 세다; 계산하다; 계산 2. 중요하다 3. ((on)) 믿다; 확신하다","ex":[["Hold your breath and [count] to five.","숨을 참고 5까지 세라."],["First impressions really do [count] when meeting people.","사람들을 만날 때 첫인상은 정말로 중요하다."],["You can [count] on me.","나를 믿어도 좋아."]]},{"u":27,"n":807,"w":"condition","m":"1. 조건 2. 환경, 상황 3. (건강) 상태","ex":[["Investment is an essential [condition] of economic growth.","투자는 경제 성장의 필수적인 조건이다."],["Some types of plants can live in very dry [conditions].","어떤 종류의 식물은 매우 건조한 환경에서 살 수 있다."],["a serious heart [condition]","심각한 심장 상태"]]},{"u":27,"n":808,"w":"volume","m":"1. 책(의 크기); 권 2. (물건의) 크기, 부피, 양 3. 음량","ex":[["I’ve read two out of the five [volumes] in the series.","나는 그 시리즈 5권 중 2권을 읽었다."],["The mayor built new bridges to treat the increased [volume] of traffic.","시장은 증가한 교통량(양)을 처리하기 위해 새 다리들을 건설했다."],["She turned the radio’s [volume] up to hear the urgent news.","그녀는 긴급 뉴스를 듣기 위해 라디오의 음량을 높였다."]]},{"u":27,"n":809,"w":"plain","m":"1. 평지 2. 분명한, 명백한 3. 간결한, 소박한 4. 솔직한, 있는 그대로의 5. 무늬 없는","ex":[["There was a lake in the middle of the [plain].","호수가 평지 한가운데에 있었다."],["She made her meaning [plain].","그녀는 자신의 뜻을 분명히 했다."],["It was a [plain] room with no curtains.","그것은 커튼이 없는 소박한 방이었다."],["She was respected for her [plain] speaking.","그녀는 솔직한 화법으로 존경받았다."],["She likes to wear a [plain] blouse and skirt.","그녀는 무늬 없는 블라우스와 치마를 즐겨 입는다."]]},{"u":27,"n":810,"w":"sign","m":"1. 기호, 부호 2. 표지판, 간판 3. 신호; 신호하다 4. 징후, 조짐 5. 서명하다; 계약하다","ex":[["the plus [sign]","더하기 기호"],["There was a warning [sign] beside the old bridge.","그 낡은 다리 옆에는 경고 표지판이 있었다."],["He [signed] that he was ready to start.","그는 시작할 준비가 되었다고 신호했다."],["The gloomy weather shows no [sign] of changing.","우울한 날씨는 바뀔 징후를 보이지 않는다."],["The actor [signed] a contract for the new movie.","그 배우는 새 영화를 위한 계약서에 서명했다."]]},{"u":28,"n":811,"w":"ecosystem","m":"생태계","ex":[["People threaten [ecosystems] by producing waste.","사람들은 쓰레기를 만들어냄으로써 생태계를 위협한다."]]},{"u":28,"n":812,"w":"junk","m":"쓰레기, 폐물","ex":[["There is a lot of [junk] to remove.","치워야 할 쓰레기가 많다."]]},{"u":28,"n":813,"w":"decay","m":"1. 썩다, 부패하다 2. 쇠퇴하다; 1. 부패 2. 쇠퇴","ex":[["Plastic bags don’t [decay].","비닐봉지는 썩지 않는다."],["the [decay] of the manufacturing industry","제조업의 쇠퇴"]]},{"u":28,"n":814,"w":"environment","m":"1. (자연) 환경 2. 주변 환경, 주위 상황","ex":[["Various types of trash cause damage to the [environment].","다양한 종류의 쓰레기가 환경에 해를 끼친다."],["Students learn best in a clean, light [environment].","학생들은 깨끗하고 밝은 주변 환경에서 가장 잘 학습한다."]]},{"u":28,"n":815,"w":"toxic","m":"유독한, 독성의","ex":[["[Toxic] waste poured into the river can kill fish.","강으로 흘려보내진 유독한 폐기물이 물고기를 죽일 수 있다."]]},{"u":28,"n":816,"w":"coal","m":"석탄","ex":[["Air pollution caused by the burning of [coal] is a huge problem.","석탄의 연소로 인한 대기 오염은 큰 문제이다."]]},{"u":28,"n":817,"w":"gasoline / gas","m":"휘발유, 가솔린","ex":[["Most cars use [gasoline] as fuel.","대부분의 차는 휘발유를 연료로 사용한다."]]},{"u":28,"n":818,"w":"pollute","m":"오염시키다, 더럽히다","ex":[["Heavy traffic [pollutes] the air in cities.","극심한 교통량이 도시의 공기를 오염시킨다."]]},{"u":28,"n":819,"w":"greenhouse","m":"온실","ex":[["The [greenhouse] effect is caused by air pollution.","온실 효과는 대기 오염으로 인한 것이다."]]},{"u":28,"n":820,"w":"atmosphere","m":"1. 대기, 공기 2. 분위기","ex":[["The earth’s [atmosphere] is getting warmer.","지구의 대기가 점점 더 따뜻해지고 있다."],["Wooden furniture creates a comfortable [atmosphere] at home.","나무로 된 가구는 집에 편안한 분위기를 만들어준다."]]},{"u":28,"n":821,"w":"acid","m":"1. 산성의 2. 신, 신맛이 나는; ((화학)) 산","ex":[["[Acid] rain is also a result of air pollution.","산성비 역시 대기 오염의 결과이다."],["[acid] fruit","신 과일"]]},{"u":28,"n":822,"w":"iceberg","m":"빙산","ex":[["Climate change has an effect on [icebergs].","기후 변화는 빙산에 영향을 미친다."]]},{"u":28,"n":823,"w":"melt","m":"1. 녹다, 녹이다 2. (감정 등을) 누그러뜨리다","ex":[["Icebergs are [melting] due to global warming.","빙하가 지구 온난화로 인해 녹고 있다."],["Her bright smile [melted] his heart.","그녀의 밝은 웃음이 그의 마음을 누그러뜨렸다."]]},{"u":28,"n":824,"w":"flood","m":"홍수; 물에 잠기게 하다, 물에 잠기다","ex":[["Climate change can cause severe [floods].","기후 변화는 심각한 홍수를 일으킬 수 있다."],["Heavy rains [flood] the plain every summer.","매년 여름 폭우가 평지를 물에 잠기게 한다."]]},{"u":28,"n":825,"w":"earthquake","m":"지진","ex":[["Severe climate change can also cause [earthquakes].","심각한 기후 변화는 또한 지진을 일으킬 수 있다."]]},{"u":28,"n":826,"w":"freeze","m":"얼다, 얼리다; (물가, 임금 등의) 동결","ex":[["This winter was mild, so the lake didn’t [freeze].","이번 겨울은 온화해서 호수가 얼지 않았다."],["a price [freeze]","가격 동결"]]},{"u":28,"n":827,"w":"protect","m":"보호하다, 지키다","ex":[["We should [protect] our environment.","우리는 환경을 보호해야 한다."]]},{"u":28,"n":828,"w":"reduce","m":"줄이다, 축소하다; 할인하다","ex":[["Riding a bicycle can [reduce] air pollution.","자전거를 타는 것은 대기 오염을 줄일 수 있다."]]},{"u":28,"n":829,"w":"resource","m":"자원, 재료; 자원을 제공하다","ex":[["We have to use [resources] efficiently.","우리는 자원을 효율적으로 사용해야 한다."],["The government should make sure all schools are adequately [resourced].","정부는 반드시 모든 학교가 충분히 자원을 제공받을 수 있도록 해야 한다."]]},{"u":28,"n":830,"w":"consume","m":"1. 소비하다, 소모하다 2. 먹다; 마시다","ex":[["Let’s [consume] less water and electricity.","물과 전기를 덜 소비하자."],["It is highly recommended to [consume] vegetables daily.","매일 채소를 먹는것이 적극적으로 권장된다."]]},{"u":28,"n":831,"w":"seek","m":"1. 찾다 2. 구하다","ex":[["People are [seeking] a new way to produce eco-friendly energy.","사람들은 친환경 에너지를 생산할 새로운 방법을 찾고 있다."],["He [sought] his mother’s forgiveness for his mistakes.","그는 어머니에게 자신의 실수에 대한 용서를 구했다."]]},{"u":28,"n":832,"w":"alternative","m":"대체의; 기존의 방식과는 다른; 대안","ex":[["[Alternative] energy sources use the sun, wind and so much more.","대체 에너지원은 태양과 바람, 그리고 훨씬 더 많은 것들을 이용한다."],["The medicine is offered as an [alternative] to surgery.","그 약은 수술의 대안으로 제안된다."]]},{"u":28,"n":833,"w":"oxygen","m":"산소","ex":[["Trees make [oxygen] and reduce air pollution.","나무는 산소를 만들고 대기 오염을 줄인다."]]},{"u":28,"n":834,"w":"preserve","m":"보존하다; 지키다, 보호하다","ex":[["Let’s drink water with reusable cups to [preserve] trees.","나무를 보존하기 위해 재사용할 수 있는 컵으로 물을 마시도록 하자."]]},{"u":28,"n":835,"w":"recycle","m":"(폐품을) 재활용하다, 재생하다","ex":[["We can [recycle] paper to save trees.","우리는 나무를 보호하기 위해 종이를 재활용할 수 있다."]]},{"u":28,"n":836,"w":"adapt","m":"1. 적응하다; 조정하다 2. (책 등을) 각색하다","ex":[["With some extra help, the elderly can [adapt] well to new technology.","약간의 도움이 있다면 노인들은 새 기술에 잘 적응할 수 있다."],["The latest novel of the famous author was [adapted] into a film.","한 유명 작가의 최신 소설이 영화로 각색되었다."]]},{"u":28,"n":837,"w":"adopt","m":"1. 채택하다; (특정한 방식이나 태도를) 취하다 2. 입양하다","ex":[["The company [adopted] one of the ideas of its employees.","그 회사는 직원들의 의견 중에서 하나를 채택했다."],["[Adopt] a positive attitude and try to enjoy your life.","긍정적인 태도를 취하고 인생을 즐기려고 노력해라."],["It is encouraged to [adopt] homeless dogs rather than to buy them.","(반려견을) 사기보다는 유기견을 입양하는 것이 권장된다."]]},{"u":28,"n":838,"w":"saw","m":"톱; 톱질하다","ex":[["This [saw] is not sharp enough to cut trees.","이 톱은 나무를 자를 만큼 날카롭지 않다."]]},{"u":28,"n":839,"w":"sew","m":"꿰매다, 바느질하다","ex":[["She was [sewing] a new button on her shirt.","그녀는 자신의 셔츠에 새 단추를 꿰매고 있었다."]]},{"u":28,"n":840,"w":"sow","m":"(씨를) 뿌리다, 심다","ex":[["In spring, farmers usually [sow] seeds in the fields.","봄에 농부들은 보통 밭에 씨를 뿌린다."]]},{"u":29,"n":841,"w":"evolve","m":"1. 진화하다 2. (점진적으로) 발전하다, 발달하다","ex":[["Life on Earth has [evolved] in various ways.","지구상의 생명체들은 다양한 방식으로 진화했다."],["The small online bookstore has [evolved] into a global company.","그 작은 온라인 서점은 세계적인 회사로 발전했다."]]},{"u":29,"n":842,"w":"survive","m":"1. 살아남다, 생존하다 2. (~보다) 오래 살다","ex":[["They adapted to their environment to [survive].","그들은 살아남기 위해 주어진 환경에 적응했다."],["He [survived] his wife by five years.","그는 아내보다 5년 더 오래 살았다."]]},{"u":29,"n":843,"w":"desert","m":"사막; 버리다; 떠나다","ex":[["Plants living in the [desert] usually bloom at night to avoid the heat during the day.","사막에 사는 식물들은 낮 동안의 열기를 피하려고 보통 밤에 꽃을 피운다."],["This town has been [deserted] for a long time.","이 마을은 오랫동안 버려져 있었다."]]},{"u":29,"n":844,"w":"native","m":"원산(지)의, 자생의; 출생지의; 현지인; 토착민","ex":[["Sand cats, [native] to sandy deserts, have furred paws to walk over hot sand.","모래사막 원산의 모래고양이는 뜨거운 모래 위를 걸을 수 있도록 털이 난 발바닥이 있다."],["I would like to speak English as a [native].","나는 영어를 현지인처럼 말하고 싶다."]]},{"u":29,"n":845,"w":"habitat","m":"(동식물의) 서식지","ex":[["To blend into the snowy [habitat], some polar animals have white coloring.","눈 덮인 서식지에 섞여 들기 위해, 몇몇 극지방의 동물들은 흰색을 띤다."]]},{"u":29,"n":846,"w":"detect","m":"발견하다, 감지하다","ex":[["Polar bears’ white fur makes it hard for them to be [detected] by their prey.","북극곰들의 흰 털은 그들이 사냥감에게 발견되는 것을 어렵게 만든다."]]},{"u":29,"n":847,"w":"descendant","m":"후손, 자손","ex":[["These adaptations have allowed their [descendants] to survive better.","이러한 적응은 그들의 후손들이 더 잘 살아남을 수 있게 해주었다."]]},{"u":29,"n":848,"w":"dominant","m":"우세한, 지배적인","ex":[["Living things compete to hold a [dominant] position.","생물들은 우세한위치를 차지하기 위해 경쟁한다."]]},{"u":29,"n":849,"w":"participate","m":"참여하다, 참가하다","ex":[["They [participate] in a battle for limited resources such as space and food.","그들은 영역이나 먹이와 같은 제한된 자원을 둘러싼 전투에 참여한다."]]},{"u":29,"n":850,"w":"invade","m":"1. 침입하다, 침략하다 2. (사생활 등을) 침해하다","ex":[["Ants [invade] and take over other ant colonies.","개미는 다른 개미 군집들을 침략하고 탈취한다."],["We should not [invade] other people’s privacy.","우리는 다른 사람들의 사생활을 침해해서는 안 된다."]]},{"u":29,"n":851,"w":"decorate","m":"장식하다, 꾸미다","ex":[["Some birds [decorate] their nest with feathers.","어떤 새들은 그것들의 둥지를 깃털로 장식한다."]]},{"u":29,"n":852,"w":"tactic","m":"전략, 전술","ex":[["Their [tactic] is to deceive enemies by making the nest look dangerous.","그것들의 전략은 둥지를 위험하게 보이게 만듦으로써 적을 속이는 것이다."]]},{"u":29,"n":853,"w":"generation","m":"세대, 같은 시대의 사람들; 1세대, 1대 ((자식이 부모와 교체되기까지의 약 30년간))","ex":[["Animals also compete to pass their genes to the next [generation].","세대 동물들은 또한 다음 에 자신의 유전자를 남기기 위해 경쟁한다."],["a [generation] ago","한 세대 전"]]},{"u":29,"n":854,"w":"fabulous","m":"1. 멋진, 굉장한 2. (양이나 크기가) 엄청난","ex":[["Male peacocks show off their [fabulous] feathers to attract females.","수컷 공작새들은 암컷을 유혹하기 위해 자신의 멋진 깃털을 뽐낸다."],["He decided to donate his [fabulous] wealth to his country.","그는 자신의 엄청난재산을 고국에 기부하기로 결심했다."]]},{"u":29,"n":855,"w":"ecological","m":"생태계의; 생태학적인","ex":[["Having an [ecological] balance is very important in the natural world.","자연계에서 생태계의 균형을 이루는 것은 매우 중요하다."]]},{"u":29,"n":856,"w":"predator","m":"포식자, 포식 동물; 약탈자","ex":[["The gray wolf was a dominant [predator] in Yellowstone National Park when it was established in 1872.","1872년 옐로스톤 국립공원이 설립되었을 때 회색늑대는 지배적인 포식자였다."]]},{"u":29,"n":857,"w":"massive","m":"거대한, 엄청난","ex":[["The gray wolf’s main prey was a [massive] grass-eating animal, the elk.","회색늑대의 주된 먹잇감은 거대한초식동물인 엘크였다."]]},{"u":29,"n":858,"w":"territory","m":"영토; 영역","ex":[["To protect the elk, the wolves were killed off from their [territory] in the 1920s.","엘크를 보호하기 위해 1920년대에 늑대들은 그들의 영역에서 몰살당했다."]]},{"u":29,"n":859,"w":"vanish","m":"사라지다, 없어지다","ex":[["Gray wolves [vanished] from the park for more than 70 years.","회색늑대는 공원에서 70년이 넘는 기간 동안 사라졌다."]]},{"u":29,"n":860,"w":"transform","m":"변형시키다, 변화시키다","ex":[["However, it [transformed] the food web and led to an unexpected problem.","하지만 그것은 먹이 그물을 변형시켰고 예상치 못한 문제로 이어졌다."]]},{"u":29,"n":861,"w":"explode","m":"1. 폭증하다 2. 폭발하다, 폭파시키다","ex":[["The elk population [exploded], and the plants the elk eat couldn’t survive.","엘크의 개체수가 폭증했고, 엘크가 먹는 식물들은 살아남을 수 없었다."],["We were afraid that the bomb might [explode].","우리는 폭탄이 폭발할까 봐 두려웠다."]]},{"u":29,"n":862,"w":"species","m":"(생물 분류상의) 종(種)","ex":[["People realized the wolves were an essential [species] in the food chain and introduced them back.","사람들은 늑대가 먹이 사슬에서 필수적인 종이라는 것을 깨닫고 그들을 다시 들여왔다."]]},{"u":29,"n":863,"w":"restore","m":"1. 회복시키다 2. 복원하다, 복구하다","ex":[["After that, the number of elk decreased, and the park was [restored] to its former condition.","그 후 엘크의 수는 줄어들었고, 공원은 예전의 상태로 회복되었다."],["That building was recently [restored].","저 건물은 최근에 복원되었다."]]},{"u":29,"n":864,"w":"wildlife","m":"야생동물, 야생식물","ex":[["This issue proved that adiversity of [wildlife] is important to the harmony of the natural world.","이 결과는 자연계의 조화에 야생동물의 다양성이 중요하다는 것을 증명했다."]]},{"u":29,"n":865,"w":"principal","m":"주요한, 으뜸가는; 교장; 우두머리","ex":[["CO2 emissions are the [principal] cause of global warming.","이산화탄소 배출은 지구 온난화의 주요한원인이다."],["We planned a party for the retirement of our [principal].","우리는 교장 선생님의 은퇴식을 위한 파티를 계획했다."]]},{"u":29,"n":866,"w":"principle","m":"원칙, 원리","ex":[["One of my [principles] is to be honest.","내 원칙 중 하나는 정직하자는 것이다."]]},{"u":29,"n":867,"w":"loyal","m":"충실한, 충성스러운","ex":[["They are [loyal] supporters of the political party.","그들은 그 정당의 충실한 지지자들이다."]]},{"u":29,"n":868,"w":"royal","m":"왕의, 여왕의; 왕실의","ex":[["He insists that he comes from [royal] blood.","그는 자신이 왕실의 혈통이라고 주장한다."]]},{"u":29,"n":869,"w":"affect","m":"(~에) 영향을 미치다","ex":[["Your attitude will [affect] how successful you are.","너의 태도는 네가 얼마나 성공하는지에 영향을 미칠 것이다."]]},{"u":29,"n":870,"w":"effect","m":"결과, 효과; 영향; (어떤 결과를) 가져오다","ex":[["The [effects] of caffeine can vary from person to person.","카페인의 효과는 사람마다 다를 수 있다."],["The government’s new policies will have an [effect] on every citizen.","정부의 새 정책들은 모든 시민에게 영향을 미칠 것이다."]]},{"u":30,"n":871,"w":"poverty","m":"가난, 빈곤","ex":[["There are many areas where the problems of [poverty] still continue.","빈곤 문제가 여전히 지속되고 있는 지역들이 많다."]]},{"u":30,"n":872,"w":"drought","m":"가뭄","ex":[["A [drought] is one of the main causes of hunger and poverty.","가뭄은 기아와 빈곤의 주요 원인들 중 하나이다."]]},{"u":30,"n":873,"w":"necessity","m":"1. 필수품; 필요(성) 2. 필연(성), 불가피","ex":[["Some people lack basic [necessities] such as food and drinking water.","일부 사람들은 음식과 식수와 같은 기본적인 필수품이 부족하다."]]},{"u":30,"n":874,"w":"shortage","m":"부족, 결핍","ex":[["The poor are facing serious food [shortages].","가난한 사람들은 심각한 식량 부족에 직면해 있다."]]},{"u":30,"n":875,"w":"lifespan","m":"수명","ex":[["The average [lifespan] in that poor country is less than 60 years.","그 빈곤국의 평균 수명은 60세가 안 된다."]]},{"u":30,"n":876,"w":"cancer","m":"암","ex":[["The number of people who die from [cancer] in poor countries is very high.","빈곤국들에서 암으로 사망하는 사람의 수는 매우 많다."]]},{"u":30,"n":877,"w":"unemployment","m":"실업(률), 실직","ex":[["Most poor countries suffer from high rates of [unemployment].","대부분의 빈곤국들은 높은 실업률로 고통받는다."]]},{"u":30,"n":878,"w":"hire","m":"고용하다","ex":[["Companies are not willing to [hire] new employees.","기업들은 새로운 직원을 고용하는 것을 꺼린다."]]},{"u":30,"n":879,"w":"worsen","m":"악화시키다, 악화되다","ex":[["High rates of unemployment cause the economy to [worsen].","높은 실업률이 경제를 악화시키는 원인이다."]]},{"u":30,"n":880,"w":"hardship","m":"(돈 등의 부족에서 오는) 어려움, 고난","ex":[["The homeless suffer many [hardships] during cold winters.","노숙자들은 추운 겨울 동안 많은 어려움을 겪는다."]]},{"u":30,"n":881,"w":"violent","m":"1. 폭력적인 2. (정도가) 격렬한","ex":[["When the economy struggles, [violent] crime tends to increase.","경제가 어려울 때,폭력적인 범죄가 증가하는 경향이 있다."],["We had a [violent] argument and James just went out.","우리는 격렬한 말다툼을 했고 James는 밖으로 나가버렸다."]]},{"u":30,"n":882,"w":"chaos","m":"혼돈, 혼란","ex":[["In the [chaos], people are forced to help themselves.","혼돈 속에서, 사람들은 스스로를 돌보아야만 한다."]]},{"u":30,"n":883,"w":"border","m":"1. 국경 (지역); 경계 2. 가장자리","ex":[["They cross the [border] illegally to survive.","그들은 생존을 위해 불법으로 국경을 넘는다."],["a white plate with a gold [border]","금빛 가장자리가 있는 흰색 접시"]]},{"u":30,"n":884,"w":"physician","m":"(내과) 의사","ex":[["The people need a [physician] to consult about their health.","그 사람들은 자신들의 건강에 대해 상담해줄 의사가 필요하다."]]},{"u":30,"n":885,"w":"surgery","m":"1. (외과) 수술 2. 외과 (의원)","ex":[["There are many people who need urgent [surgery].","긴급한 수술이 필요한 사람들이 많다."],["plastic [surgery]","성형 외과"]]},{"u":30,"n":886,"w":"medicine","m":"1. (내복)약 2. 의학","ex":[["The organization provides free [medicine] for developing countries.","그 기구는 개발도상국에 약을 무상 공급한다."],["Their study has led to many important advances in modern [medicine].","그들의 연구는 현대 의학에 있어서 많은 중요한 진보를 이끌었다."]]},{"u":30,"n":887,"w":"cure","m":"1. 치유하다 2. 해결하다; 1. 치유(법) 2. 해결책","ex":[["Most diseases can be [cured] with medicine.","대부분의 질병들은 약으로 치유할 수 있다."],["For some people, religion [cures] the emptiness in their lives.","어떤 사람들에게는, 종교가 그들의 삶의 공허함을 해결한다."]]},{"u":30,"n":888,"w":"therapy","m":"치료(법), 요법","ex":[["Improving access to drug [therapy] in poor countries is an important issue.","빈곤국에서 약물 치료에 대한 접근성을 향상시키는 것은 중요한 문제이다."]]},{"u":30,"n":889,"w":"pharmacy","m":"1. 약국 2. ((학문)) 약학","ex":[["The man at the [pharmacy] gave them the right drugs.","약국에 있는 남자가 그들에게 적합한 약을 줬다."]]},{"u":30,"n":890,"w":"tablet","m":"1. 정제 ((둥글넓적한 모양의 약)) 2. (돌 등으로 된) 판, 명판(名板) 3. 태블릿 ((소형 휴대용 컴퓨터))","ex":[["The pharmacist gave him a bottle of thick, round [tablets].","약사는 그에게 두껍고 둥근 정제가 들어있는 병 하나를 주었다."],["a bronze [tablet]","청동판"],["She keeps a journal on her [tablet] PC.","그녀는 태블릿 PC에 일기를 쓴다."]]},{"u":30,"n":891,"w":"budget","m":"예산(안); 예산을 세우다","ex":[["The special [budget] will be used to help the poor farmers.","그 특별 예산은 가난한 농부들을 돕는 데 사용될 것이다."]]},{"u":30,"n":892,"w":"intend","m":"1. 의도하다, 작정하다 2. 의미하다","ex":[["The support is [intended] to help them stand by themselves.","그 지원은 그들이 자립하는 것을 돕도록 의도되었다."],["What do you [intend] by your words?","네 말이 무슨 의미이니?"]]},{"u":30,"n":893,"w":"cultivate","m":"1. 경작하다; 재배하다 2. (재능, 행동 방식 등을) 기르다, 계발하다","ex":[["They can [cultivate] crops with better equipment.","그들은 더 좋은 장비로 농작물을 재배할 수 있다."],["He’s trying to [cultivate] a more caring image.","그는 더욱 상냥한 이미지를 기르려고 노력하고 있다."]]},{"u":30,"n":894,"w":"produce","m":"1. 생산하다, 제조하다 2. (결과를) 일으키다, 야기하다; 농산물; 생산물","ex":[["They will [produce] enough food to feed themselves.","그들은 자신들이 먹기에 충분한 식량을 생산할 것이다."],["Stress can [produce] changes in the brain and affect cognitive processes.","스트레스는 뇌에 변화를 일으킬수 있고 인지 과정에 영향을 미칠 수 있다."],["The shop sells only fresh local [produce].","그 가게는 신선한 지역 농산물만을 판다."]]},{"u":30,"n":895,"w":"income","m":"수입, 소득","ex":[["The farmers’ [income] rises with the increased production.","생산량의 증가로 농부들의 소득이 오른다."]]},{"u":30,"n":896,"w":"lie","m":"거짓말하다; 거짓말","ex":[["Tony [lied] about his age.","Tony는 자신의 나이에 대해 거짓말했다."],["She admitted that she had [lied] to the police.","그녀는 자신이 경찰에게 거짓말했다는 것을 인정했다."]]},{"u":30,"n":897,"w":"lie (누워있다)","m":"1. 눕다; 누워 있다 2. 놓여 있다","ex":[["She had to [lie] on the ground because of dizziness.","그녀는 어지러움 때문에 땅바닥에 누워야 했다."],["I [lay] awake last night worrying about the interview.","나는 면접에 대해 걱정하느라 지난밤에 깬 채로 누워있었다."],["The book [lay] open on his desk.","그 책은 그의 책상 위에 펼쳐진 채로 놓여있었다."]]},{"u":30,"n":898,"w":"lay","m":"1. 놓다, 두다 2. (알을) 낳다","ex":[["Dad [laid] his car key on the table.","아빠는 자동차 열쇠를 탁자 위에 두셨다."],["Frogs need water to [lay] their eggs in.","개구리는 알을 낳을 물이 필요하다."]]},{"u":30,"n":899,"w":"leap","m":"1. (높이) 뛰다 2. 급증하다, 급격히 상승하다; 1. 도약 2. 급증","ex":[["The dog tried to [leap] over the fence.","그 개는 울타리를 뛰어넘으려 했다."],["Eric’s grades have been [leaping] upward.","Eric의 성적은 급격히 상승했다."],["the [leap] in unemployment","급증 실업률의"]]},{"u":30,"n":900,"w":"reap","m":"거두다, 수확하다","ex":[["The students are now [reaping] the fruits of their hard studying.","학생들은 이제 열심히 공부한 것에 대한 성과를 거두는 중이다."]]},{"u":31,"n":901,"w":"society","m":"사회 (집단); -회(會), 협회","ex":[["Many people are interested in
