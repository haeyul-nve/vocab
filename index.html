{"u":31,"n":924,"w":"distribute","m":"분배하다, 나누어 주다","ex":[["Volunteers [distribute] meals to the homeless for free.","자원 봉사자들은 노숙자들에게 무료로 식사를 나누어 준다."]]},{"u":31,"n":925,"w":"expenditure","m":"비용, 경비; 지출","ex":[["The charities pay for all [expenditures] related to volunteering.","자선 단체들은 자원 봉사 활동과 관련된 모든 비용을 부담한다."]]},{"u":31,"n":926,"w":"expand","m":"확장하다, 확대시키다","ex":[["The restaurant [expanded] its seating area because it was so successful.","그 레스토랑은 매우 성공해서 좌석 구역을 확장했다."]]},{"u":31,"n":927,"w":"expend","m":"(시간, 노력 등을) 들이다, 소비하다","ex":[["We [expended] much time and effort on this team project.","우리는 이 팀 프로젝트에 많은 시간과 노력을 들였다."]]},{"u":31,"n":928,"w":"diary","m":"일기","ex":[["Keeping a [diary] helps preserve your memories about the past.","일기를 쓰는 것은 과거의 기억을 간직하는 것을 도와준다."]]},{"u":31,"n":929,"w":"daily","m":"매일의; 매일, 날마다; 일간 신문","ex":[["Let me tell you about my [daily] schedule.","제 매일의 일과를 말씀드리겠습니다."],["The library is open [daily] from 8 a.m. to 9 p.m.","그 도서관은 매일 오전 8시부터 오후 9시까지 연다."]]},{"u":31,"n":930,"w":"dairy","m":"유제품; 1. 유제품의 2. 낙농의","ex":[["Some vegetarians eat [dairy] and others don’t.","어떤 채식주의자들은 유제품을 먹고 어떤 채식주의자들은 먹지 않는다."]]},{"u":32,"n":931,"w":"democracy","m":"민주주의; 민주(주의) 국가","ex":[["[Democracy] means that people themselves rule over their country.","민주주의는 국민이 스스로 나라를 다스리는 것을 의미한다."]]},{"u":32,"n":932,"w":"communism","m":"공산주의","ex":[["[Communism] rejects class distinction in society.","공산주의는 사회에서의 계급 차별을 거부한다."]]},{"u":32,"n":933,"w":"capitalism","m":"자본주의","ex":[["[Capitalism] encourages competition in the market.","자본주의는 시장에서의 경쟁을 장려한다."]]},{"u":32,"n":934,"w":"socialism","m":"사회주의","ex":[["[Socialism] is a system based on public ownership.","사회주의는 공공 소유에 기초한 제도이다."]]},{"u":32,"n":935,"w":"republic","m":"공화국","ex":[["A [republic] is a country where the ruler has been chosen by vote.","공화국은 지도자가 투표로 선출된 국가이다."]]},{"u":32,"n":936,"w":"government","m":"정부, 정권; 통치 (체제)","ex":[["The [government] is responsible for the country’s security.","정부는 국가의 안전에 대하여 책임이 있다."]]},{"u":32,"n":937,"w":"parliament","m":"국회, 의회","ex":[["A [parliament] makes the laws of a country.","국회는 나라의 법을 만든다."]]},{"u":32,"n":938,"w":"committee","m":"위원회","ex":[["The government [committee] was formed in October 2020.","그 정부 위원회는 2020년 10월에 설립되었다."]]},{"u":32,"n":939,"w":"council","m":"(지방 자치 단체의) 의회; 협의회","ex":[["The city [council] decided to give more money to schools.","시 의회는 학교들에 더 많은 돈을 지급하기로 결정했다."]]},{"u":32,"n":940,"w":"union","m":"1. (국가 등의) 연합, 연방 2. 조합, 협회 3. 결합, 통합","ex":[["The European [Union] (EU)was formed to increase the cooperation of European nations.","유럽 연합은 유럽 국가들 사이의 협력을 증대시키기 위해 결성되었다."],["The labor [union] asked for more rights from the government.","노동 조합은 정부에 더 많은 권리를 요구했다."]]},{"u":32,"n":941,"w":"politician","m":"정치인","ex":[["Each [politician] has a different social and cultural background.","각각의 정치인은 다양한 사회, 문화적 배경을 가지고 있다."]]},{"u":32,"n":942,"w":"minister","m":"1. 장관 2. 목사, 성직자","ex":[["He was appointed [Minister] of Environment.","그는 환경부 장관으로 임명되었다."],["Christians often look to the [minister] of their church for advice.","기독교인들은 종종 교회 목사가 조언해주기를 기대한다."]]},{"u":32,"n":943,"w":"representative","m":"1. 대표(자) 2. 대리인; 대표하는; 상징하는","ex":[["Politicians are [representatives] of the people.","정치인들은 국민의 대표자들이다."],["a sales [representative]","영업 대리인"],["The students’ test results are [representative] of their effort.","학생들의 시험 결과는 그들의 노력을 상징한다."]]},{"u":32,"n":944,"w":"spokesperson","m":"대변인","ex":[["A government [spokesperson] explains the national policies.","정부 대변인은 국가의 정책을 설명한다."]]},{"u":32,"n":945,"w":"candidate","m":"후보자, 지원자","ex":[["Presidential [candidates] asked people to vote for them.","대통령 후보자들은 사람들에게 자신에게 투표해줄 것을 요청했다."]]},{"u":32,"n":946,"w":"announce","m":"1. 발표하다, 알리다 2. 선언하다","ex":[["The government [announced] a new plan.","정부는 새로운 계획을 발표했다."],["Jenny [announced] that she would move to Brazil in the coming year.","Jenny는 내년에 브라질로 이주할 것이라고 선언했다."]]},{"u":32,"n":947,"w":"remark","m":"발언, 언급; 발언하다, 언급하다","ex":[["His [remark] about the plan was quite surprising.","그 계획에 관한 그의 발언은 아주 놀라웠다."]]},{"u":32,"n":948,"w":"controversy","m":"논란, 논쟁","ex":[["The announcement caused [controversy] among politicians.","그 발표는 정치인들 사이에 논란을 일으켰다."]]},{"u":32,"n":949,"w":"oppose","m":"1. (계획, 정책 등에) 반대하다 2. 겨루다; 대항하다","ex":[["Some of them [opposed] the plan for a variety of reasons.","그들 중 몇몇은 다양한 이유로 그 계획에 반대했다."],["I wonder who will [oppose] me in the next match.","나는 다음 경기에서 누가 나와 겨루게 될지 궁금하다."]]},{"u":32,"n":950,"w":"poll","m":"1. 여론 조사 2. 투표","ex":[["Opinion [polls] are used to discover what people think.","여론 조사는 사람들이 생각하는 바를 알아내기 위해 사용된다."],["[Polls] close at 6 p.m.","투표는 오후 6시에 마감된다."]]},{"u":32,"n":951,"w":"tax","m":"세금; 세금을 부과하다","ex":[["The government needs a balanced [tax] program.","정부는 균형 잡힌 세금 제도가 필요하다."]]},{"u":32,"n":952,"w":"nationality","m":"1. 국적 2. 민족","ex":[["A passport serves as proof of [nationality] and identity.","여권은 국적과 신분을 증명하는 역할을 한다."],["We should respect different [nationalities] and cultures.","우리는 다른 민족과 문화를 존중해야 한다."]]},{"u":32,"n":953,"w":"military","m":"군대, 군사; 군대의, 군사의","ex":[["The [military] protects the country day and night.","군대는 국가를 밤낮으로 지킨다."],["joint [military] drills","합동 군사 훈련"]]},{"u":32,"n":954,"w":"patriot","m":"애국자","ex":[["[Patriots] often take an active part in their country’s politics.","애국자들은 종종 자국의 정치에 적극적으로 참여한다."]]},{"u":32,"n":955,"w":"aboard","m":"~에 탄, ~에 탑승한; 탄, 탑승한","ex":[["Hurry up! It’s time to get [aboard] the plane.","서둘러! 비행기에 탑승할 시간이야."]]},{"u":32,"n":956,"w":"abroad","m":"해외에(서), 해외로","ex":[["My mom wants me to study [abroad] next year.","우리 엄마는 내년에 내가 해외에서 공부하기를 바라신다."]]},{"u":32,"n":957,"w":"quite","m":"1. 꽤, 상당히 2. 완전히, 전적으로","ex":[["Sally spent [quite] a lot of time studying for her final exam.","Sally는 기말고사를 위해 공부하는 데 꽤 많은 시간을 보냈다."],["Although it was Sunday evening, the theater was not [quite] full.","일요일 저녁이었는데도 불구하고 그 극장은 완전히 다 차지는 않았다."]]},{"u":32,"n":958,"w":"quiet","m":"조용한, 고요한","ex":[["When the teacher handed out report cards, everyone was [quiet].","선생님께서 성적표를 나눠주셨을 때, 모두가 조용했다."]]},{"u":32,"n":959,"w":"wind","m":"바람; 1. 감다, 휘감다 2. (도로, 강 등이) 굽이치다","ex":[["I [wound] a scarf around my neck because it was so cold.","너무 추워서 나는 목에 목도리를 감았다."],["The river [winds] along the valley.","그 강은 골짜기를 따라 굽이쳐 흐른다."]]},{"u":32,"n":960,"w":"wound","m":"상처, 부상; 상처[부상]를 입히다","ex":[["A nurse bandaged the knife [wound] of the patient.","간호사가 환자의 칼에 찔린 상처에 붕대를 감았다."],["Both players were [wounded] in yesterday’s boxing match.","두 선수 모두 어제 복싱 경기에서 상처를 입었다."]]},{"u":33,"n":961,"w":"ancestor","m":"조상, 선조","ex":[["Our [ancestors] made their own clothes, which took lots of effort.","우리 조상들은 자신의 옷을 직접 만들었는데, 그것은 많은 수고가 들었다."]]},{"u":33,"n":962,"w":"provide","m":"제공하다, 공급하다","ex":[["Materials such as wool were not [provided] in large quantities.","양모와 같은 직물들은 대량으로 공급되지 않았다."]]},{"u":33,"n":963,"w":"outfit","m":"옷, 복장; 채비하다, 공급하다","ex":[["So people in the old days usually had only a few [outfits].","그래서 옛날 사람들은 보통 몇 벌의 옷만 가지고 있었다."]]},{"u":33,"n":964,"w":"fabric","m":"천, 직물","ex":[["It was common to make new clothes by using the [fabric] of old ones.","입던 옷의 천을 사용해서 새 옷을 만드는 것은 흔했다."]]},{"u":33,"n":965,"w":"experienced","m":"능숙한, 경험이 있는","ex":[["Only the rich wore luxurious clothes made by [experienced] tailors.","부자들만이 능숙한 재단사가 만든 호화로운 옷을 입었다."]]},{"u":33,"n":966,"w":"boast","m":"자랑하다, 과시하다; 자랑","ex":[["They used their clothes to [boast] about their wealth.","그들은 자신의 부유함을 과시하기 위해 옷을 이용했다."]]},{"u":33,"n":967,"w":"ordinary","m":"보통의, 일반적인","ex":[["Conversely, [ordinary] people didn’t have many options.","반대로, 보통 사람들은 선택의 여지가 많지 않았다."]]},{"u":33,"n":968,"w":"opportunity","m":"기회","ex":[["They had few [opportunities] to access fine clothes.","그들은 좋은 옷을 이용할 기회가 거의 없었다."]]},{"u":33,"n":969,"w":"entail","m":"(~을) 수반하다, 포함하다","ex":[["Technological advancement in the 18th century [entailed] a lot of changes.","18세기의 기술적 진보는 많은 변화를 수반했다."]]},{"u":33,"n":970,"w":"manufacture","m":"제조하다, 생산하다; 제조, 생산","ex":[["Clothing started to be [manufactured] in large factories.","의류는 대형 공장에서 제조되기 시작했다."]]},{"u":33,"n":971,"w":"complicated","m":"복잡한; 이해하기 어려운","ex":[["Clothing production was no longer [complicated] work.","의류의 제작은 더 이상 복잡한 작업이 아니었다."]]},{"u":33,"n":972,"w":"enable","m":"(~을) 가능하게 하다, 할 수 있게 하다","ex":[["Improved transportation [enabled] cheaper and easier shipping.","개선된 운송 수단은 더 저렴하고 쉬운 운송을 가능하게 했다."]]},{"u":33,"n":973,"w":"attractive","m":"매력적인, 멋진","ex":[["Clothing became widely available at an [attractive] price.","의류는 매력적인 가격에 널리 이용 가능해졌다."]]},{"u":33,"n":974,"w":"strain","m":"부담, 압박(감)","ex":[["Buying new clothes put less [strain] on people financially.","새 옷을 사는 것은 사람들에게 재정적으로 덜 부담이 되었다."]]},{"u":33,"n":975,"w":"crucial","m":"중대한, 결정적인","ex":[["Today, fashion has become a [crucial] way to show one’s personality.","오늘날, 패션은 자신의 개성을 드러내기 위한 중대한 수단이 되었다."]]},{"u":33,"n":976,"w":"vary","m":"1. 각기 다르다, 가지각색이다 2. 바꾸다, 변화하다","ex":[["The clothes that we wear [vary] in shape, color, or style.","우리가 입는 옷들은 모양이나 색, 스타일이 가지각색이다."],["She [varied] her hairstyle.","그녀는 자신의 머리 모양을 바꿨다."]]},{"u":33,"n":977,"w":"reflection","m":"1. 반사; 반영 2. 심사숙고","ex":[["Our clothes are often a [reflection] of ourselves.","우리의 옷은 종종 우리 자신의 반영이다."],["I needed some time for [reflection] before answering.","나는 대답하기 전에 심사숙고할 시간이 조금 필요했다."]]},{"u":33,"n":978,"w":"intrigue","m":"호기심을 자극하다","ex":[["New fashion trends always [intrigue] people.","새로운 패션 트렌드는 항상 사람들의 호기심을 자극한다."]]},{"u":33,"n":979,"w":"thrive","m":"1. 번창하다, 번성하다 2. (사람, 동식물이) 잘 자라다","ex":[["So the fast fashion industry, which provides cheap and trendy clothing, has been [thriving].","그래서 값싸고 유행하는 의류를 제공하는 패스트 패션 산업은 번창해 왔다."],["The cactus can [thrive] with very little water.","선인장은 아주 적은 양의 물로도 잘 자랄 수 있다."]]},{"u":33,"n":980,"w":"hazard","m":"위험 (요소)","ex":[["However, fast fashion has become a [hazard] to the environment.","하지만 패스트 패션은 환경에 위험 요소가 되었다."]]},{"u":33,"n":981,"w":"supply","m":"공급; 공급하다","ex":[["Abundant [supply] allowed people to throw away clothes easily.","풍부한 공급은 사람들이 옷을 쉽게 버릴 수 있도록 했다."],["The restaurant’s vegetables are [supplied] by local farms.","그 식당의 채소들은 지역 농장들로부터 공급받는다."]]},{"u":33,"n":982,"w":"remove","m":"1. 제거하다; 치우다 2. 옮기다, 이동시키다","ex":[["Items that have gone out of fashion are quickly [removed] from our closets.","유행이 지난 물품들은 우리의 옷장에서 빠르게 제거된다."],["Before you start cleaning, [remove] the vase to another room.","청소를 시작하기 전에 꽃병을 다른 방으로 옮겨라."]]},{"u":33,"n":983,"w":"vast","m":"어마어마한, 방대한","ex":[["[Vast] amounts of water are needed to produce the clothes we wear.","어마어마한양의 물이 우리가 입는 옷을 생산하는 데 필요하다."]]},{"u":33,"n":984,"w":"chemical","m":"화학 물질; 화학의, 화학적인","ex":[["Toxic [chemicals] are used in the production process and pollute rivers.","독성 화학 물질이 생산 과정에서 사용되어 강을 오염시킨다."],["Milk going sour is an easy example of a [chemical] reaction.","상해가는 우유는 화학 반응의 쉬운 예시이다."]]},{"u":33,"n":985,"w":"secondhand","m":"1. 중고(품)의 2. 간접의; 전해 들은","ex":[["Before it’s too late, individual efforts, such as buying [secondhand] clothes instead of new ones, should be encouraged.","너무 늦기 전에, 새 옷 대신 중고 옷을 사는 것과 같은 개개인의 노력이장려되어야 한다."],["[Secondhand] smoke causes multiple health problems in infants.","간접흡연은 유아에게 여러 가지 건강 문제를 일으킨다."]]},{"u":33,"n":986,"w":"though","m":"~에도 불구하고, (비록) ~이긴 하지만; 그러나, 그래도","ex":[["We went for a walk, [though] it was raining.","비가 내리고 있었는데도 불구하고 우리는 산책하러 갔다."]]},{"u":33,"n":987,"w":"thorough","m":"완전한, 철저한","ex":[["The police began a [thorough] investigation of the accident.","경찰은 그 사고에 대해 철저한 조사를 시작했다."]]},{"u":33,"n":988,"w":"through","m":"1. ~을 통해, ~을 통과하여 2. ~동안 내내; 1. 관통하여; 직행의 2. 내내, 줄곧","ex":[["The burglar got in [through] the window.","그 절도범은 창문을 통해 들어갔다."],["My dad slept [through] the movie.","우리 아빠는 영화 내내 주무셨다."]]},{"u":33,"n":989,"w":"wander","m":"(이리저리) 돌아다니다, 헤매다","ex":[["They [wandered] around downtown on Friday night.","그들은 금요일 밤에 시내를 돌아다녔다."]]},{"u":33,"n":990,"w":"wonder","m":"1. 궁금하다 2. (크게) 놀라다, 감탄하다; 감탄; 불가사의","ex":[["She [wondered] if she had passed the exam.","그녀는 자신이 시험에 통과했는지 궁금했다."],["I [wondered] at the hundreds of stars shining brightly in the sky.","나는 하늘에 밝게 빛나고 있는 수많은 별에 감탄했다."]]},{"u":34,"n":991,"w":"artificial","m":"1. 인공의, 인조의; 인위적인 2. 거짓된","ex":[["A.I., which means “[artificial] intelligence,” is used in various technologies.","A.I.는 ‘인공지능’을 의미하는데, 다양한 기술에 사용된다."],["Her smile seems [artificial], so I can’t trust her.","그녀의 미소는 거짓되어 보여서, 나는 그녀를 믿을 수 없다."]]},{"u":34,"n":992,"w":"machinery","m":"기계류","ex":[["Some companies have been developing [machinery] controlled by A.I.","몇몇 회사들은 인공지능에 의해 제어되는 기계류를 개발해오고 있다."]]},{"u":34,"n":993,"w":"concern","m":"1. 관련이 있다, 관련시키다 2. 걱정스럽게 하다 3. 관심을 갖다; 1. 걱정 2. 관심","ex":[["Their work is [concerned] with the invention of an A.I. system.","그들의 일은 인공지능 시스템의 발명과 관련이 있다."],["People are [concerned] about the day A.I. will win the Nobel Prize.","사람들은 인공지능이 노벨상을 타는 날이 올지도 모른다고 걱정한다."],["She has always shown deep [concern] for poor children.","그녀는 항상 불우한 아이들에게 깊은 관심을 보여 왔다."]]},{"u":34,"n":994,"w":"ease","m":"1. 편안함 2. 쉬움, 용이함; (고통 등을) 덜어 주다; 편하게 하다","ex":[["Such machines have been designed for [ease] of life.","그러한 기계들은 삶의 편안함을 위해서 고안되어 왔다."],["Yoga can help to [ease] back pain.","요가는 허리 통증을 덜어 주는 데 도움이 될 수 있다."]]},{"u":34,"n":995,"w":"equipment","m":"장비, 장치; 설비","ex":[["New [equipment] with A.I. systems can make our lives easier.","인공지능 시스템을 갖춘 새로운 장비가 우리의 삶을 더 편안하게 만들 수 있다."]]},{"u":34,"n":996,"w":"independent","m":"독립적인, 자립적인; 독립된","ex":[["Most A.I. robots are [independent]; they don’t need human instructions.","대부분의 인공지능 로봇들은 독립적이라서, 인간의 지시를 필요로 하지 않는다."]]},{"u":34,"n":997,"w":"threat","m":"위협; 협박","ex":[["A.I. could be a [threat] to people.","인공지능은 사람들에게 위협이 될 수도 있다."]]},{"u":34,"n":998,"w":"replace","m":"대체하다, 대신하다; 교체하다","ex":[["Some A.I. robots can even [replace] human workers.","어떤 인공지능 로봇들은 인간 노동자를 대체할 수도 있다."]]},{"u":34,"n":999,"w":"influence","m":"영향을 주다; 영향(력)","ex":[["In other words, the introduction of A.I. can [influence] job opportunities.","즉, 인공지능의 도입은 일자리에 영향을 줄 수 있다."],["Entertainers have a great [influence] on children.","연예인들은 아이들에게 큰 영향을 끼친다."]]},{"u":34,"n":1000,"w":"frightening","m":"두려운, 무서운","ex":[["Also, the idea that such machines might attack humans is [frightening].","또한, 그러한 기계가 인간을 공격할지도 모른다는 생각은 두렵다."]]},{"u":34,"n":1001,"w":"continuous","m":"1. 계속되는, 지속적인 2. (선 등이) 계속 이어지는","ex":[["There will be a [continuous] debate over the effects of A.I.","인공지능의 영향에 대한 논쟁은 계속될 것이다."],["This artwork is made up of just one [continuous] line.","이 예술작품은 하나의 계속 이어지는 선으로 이루어져 있다."]]},{"u":34,"n":1002,"w":"identify","m":"1. (신원 등을) 확인하다 2. 발견하다, 찾다","ex":[["An A.I. system [identifies] criminals by recognizing their faces.","한 인공지능 시스템은 얼굴을 인식해 범죄자들의 신원을 확인한다."],["Scientists [identified] a relation between weather and people’s mood.","과학자들은 날씨와 사람들의 기분 사이의 관계를 발견했다."]]},{"u":34,"n":1003,"w":"imitate","m":"모방하다, 흉내 내다","ex":[["Some robots can [imitate] human sounds and actions.","어떤 로봇은 인간의 소리와 행동을 모방할 수 있다."]]},{"u":34,"n":1004,"w":"express","m":"표현하다, 나타내다; 급행의; 신속한; 급행","ex":[["A robot developed in Japan can [express] feelings like a human.","일본에서 개발된 한 로봇은 사람처럼 감정을 표현할 수 있다."],["You need to [express] yourself more clearly.","너는 자신의 의사를 더 명확하게 표현해야 한다."],["I took the [express] bus to get to the test site on time.","나는 시험장에 제때 도착하기 위해서 급행 버스를 탔다."]]},{"u":34,"n":1005,"w":"operate","m":"1. (기계 등이) 작동하다 2. (제도, 사업체 등을) 운영하다 3. 수술하다","ex":[["A car with A.I. [operates] without help from a human driver.","인공지능이 탑재된 자동차는 인간 운전자의 도움 없이 작동한다."],["Our grocery store [operates] a free delivery service for customers.","저희 식료품점은 고객을 위해 무료 배달 서비스를 운영합니다."],["The doctors needed to [operate] on his eyes.","의사는 그의 눈을 수술해야 했다."]]},{"u":34,"n":1006,"w":"automatic","m":"1. 자동의 2. 무의식적인, 반사적인","ex":[["Google’s A.I. system handles [automatic] responses to email messages.","구글의 인공지능 시스템은 이메일 메시지에 대한 자동 응답을 처리한다."],["Breathing is an [automatic] action of the body.","호흡은 신체의 무의식적인 행동이다."]]},{"u":34,"n":1007,"w":"predict","m":"예측하다, 예견하다","ex":[["Some scientists use an A.I. program to [predict] environmental change.","몇몇 과학자들은 환경 변화를 예측하기 위해 인공지능 프로그램을 사용한다."]]},{"u":34,"n":1008,"w":"analyze / analyse","m":"분석하다","ex":[["The program learns from [analyzing] data by itself.","그 프로그램은 스스로 데이터를 분석함으로써 학습한다."]]},{"u":34,"n":1009,"w":"widespread","m":"광범위한, 널리 퍼진","ex":[["[Widespread] use of A.I. will begin in the near future.","광범위한 인공지능의 사용이 가까운 미래에 시작될 것이다."]]},{"u":34,"n":1010,"w":"numerous","m":"많은, 다수의","ex":[["Researchers expect that [numerous] kinds of A.I. will appear.","연구원들은 많은 종류의 인공지능이 등장할 것이라 예상한다."]]},{"u":34,"n":1011,"w":"household","m":"가정, 가구, 세대","ex":[["Some scientists say each [household] will have their own A.I.","어떤 과학자들은 각 가정마다 인공지능을 소유하게 될 것이라 말한다."]]},{"u":34,"n":1012,"w":"standard","m":"기준, 표준; 1. 기준의, 표준의 2. 일반적인","ex":[["A.I. might become another [standard] of wealth.","인공지능은 부유함의 또 다른 기준이 될지도 모른다."],["the [standard] cost of living","표준 생활비"],["It’s [standard] practice to search luggage at airports.","공항에서 짐을 수색하는 것은 일반적인 관행이다."]]},{"u":34,"n":1013,"w":"link","m":"연결하다; 관련되다; 1. 연결; 관련 2. 관계, 유대","ex":[["The introduction of A.I. and the use of computers are closely [linked].","인공지능의 도입과 컴퓨터의 사용은 밀접하게 관련되어 있다."],["Despite living in different countries, the two friends kept a close [link].","서로 다른 나라에 사는데도 불구하고 그 두 친구는 긴밀한 관계를 유지했다."]]},{"u":34,"n":1014,"w":"education","m":"교육","ex":[["It can also bring changes to [education], such as A.I. teachers.","그것은 인공지능 교사가 등장하는 것과 같이 교육의 변화를 가져올 수도 있다."]]},{"u":34,"n":1015,"w":"bald","m":"1. 대머리의; 민둥민둥한 2. 꾸밈없는; 노골적인","ex":[["My father and uncle are completely [bald].","우리 아버지와 삼촌은 완전히 대머리이시다."],["The [bald] fact is that you are doing wrong, whatever the reason is.","이유가 무엇이든, 꾸밈없는 사실은 네가 잘못하고 있다는 것이다."]]},{"u":34,"n":1016,"w":"bold","m":"1. 용감한, 대담한 2. (선 등이) 굵은, 선명한; 볼드체의","ex":[["It was a [bold] decision for her to live abroad alone.","그녀가 해외에서 혼자 산다는 것은 용감한 결정이었다."],["This sentence should be [bold], because it’s the topic sentence.","이 문장은 주제문이기 때문에 볼드체여야 한다."]]},{"u":34,"n":1017,"w":"access","m":"접근 (방법); 입구, 통로; 접근하다; 들어가다","ex":[["The hotel offers easy [access] to the subway station.","그 호텔은 지하철역까지 용이한 접근을 제공한다."],["The hacker [accessed] millions of personal data records.","그 해커는 수백만 개의 개인 데이터 기록에 접근했다."]]},{"u":34,"n":1018,"w":"assess","m":"(가치, 자질 등을) 평가하다, 재다","ex":[["The teacher gave them several tests to [assess] students’ language skills.","선생님은 학생들의 언어 능력을 평가하기 위해 그들에게 몇 가지 테스트를 했다."]]},{"u":34,"n":1019,"w":"personal","m":"개인의, 개인적인; 사적인","ex":[["Please take all [personal] belongings with you when you leave the theater.","극장을 떠나실 때 모든 개인 소지품을 챙기시기 바랍니다."]]},{"u":34,"n":1020,"w":"personnel","m":"(조직의) 직원, 인원","ex":[["The management of the company reduced the number of its [personnel].","그 회사의 경영진은 직원 수를 줄였다."]]},{"u":35,"n":1021,"w":"personality","m":"성격, 개성; 인격","ex":[["Everyone has a different [personality.]","모든 사람은 다른 성격을 가지고 있다."]]},{"u":35,"n":1022,"w":"positive","m":"1. 긍정적인 2. 확신하는","ex":[["Some people have a [positive] attitude toward everything.","어떤 사람들은 모든 것에 대해 긍정적인 태도를 가진다."],["We were [positive] that we would win the game.","우리는 우리가 게임에서 이길 것이라고 확신했다."]]},{"u":35,"n":1023,"w":"challenge","m":"도전; 1. 도전하다 2. 이의를 제기하다","ex":[["They are normally not afraid of a [challenge].","그들은 보통 도전을 두려워하지 않는다."],["He said if anyone [challenged] his authority, they would be fired.","그는 누구든 그의 권위에 도전한다면 해고될 것이라고 말했다."]]},{"u":35,"n":1024,"w":"brilliant","m":"1. 뛰어난; 명석한 2. 빛나는, 찬란한","ex":[["Others are creative, and their ideas are often [brilliant].","다른 사람들은 창의적이고, 그들의 아이디어는 대개 뛰어나다."],["a [brilliant] star in the sky","하늘에 떠 있는 하나의 빛나는 별"]]},{"u":35,"n":1025,"w":"passionate","m":"열정적인, 열렬한","ex":[["Some people are [passionate] about competition.","어떤 사람은 경쟁에 열정적이다."]]},{"u":35,"n":1026,"w":"leisure","m":"여가, 한가한 시간","ex":[["They usually spend their [leisure] time playing sports or games.","그들은 보통 자신의 여가 시간을 스포츠나 게임을 하면서 보낸다."]]},{"u":35,"n":1027,"w":"easygoing","m":"느긋한, 태평스러운","ex":[["[Easygoing] people can help others relax.","느긋한 사람들은 다른 사람들이 긴장을 풀도록 도와줄 수 있다."]]},{"u":35,"n":1028,"w":"outgoing","m":"외향적인, 사교적인","ex":[["People who are [outgoing] and cheerful tend to lead their friends.","외향적이고 활발한 사람들은 자신의 친구들을 이끄는 경향이 있다."]]},{"u":35,"n":1029,"w":"impression","m":"인상, 느낌; 감명","ex":[["Characteristics such as these can give good [impressions] to others.","이러한 성격들은 다른 사람들에게 좋은 인상을 줄 수 있다."]]},{"u":35,"n":1030,"w":"absent-minded","m":"(딴 데 정신이 팔려) 정신이 없는, 멍한; 건망증이 심한","ex":[["[Absent-minded] people easily forget appointments with others.","정신이 없는 사람들은 다른 사람들과의 약속을 쉽게 잊어버린다."]]},{"u":35,"n":1031,"w":"misunderstand","m":"오해하다","ex":[["So other people can easily [misunderstand] their intentions.","그래서 다른 사람들은 그들의 의도를 쉽게 오해할수 있다."]]},{"u":35,"n":1032,"w":"furious","m":"1. 몹시 화가 난, 격노한 2. (폭풍우 등이) 사나운, 맹렬한","ex":[["When they forget appointments, it can make people [furious].","그들이 약속을 잊어버리면, 그것은 사람들을 몹시 화가 나게 만들 수 있다."],["There was a [furious] storm blowing.","격렬한 폭풍이 불고 있었다."]]},{"u":35,"n":1033,"w":"doubt","m":"의심, 의혹; 의심하다, 의혹을 품다","ex":[["Some people have [doubts] about themselves.","어떤 사람들은 자기 자신에 대해 의심을 갖는다."]]},{"u":35,"n":1034,"w":"helpless","m":"무력한; (감정을) 억누를 수 없는","ex":[["Their low self-confidence often results in them feeling [helpless].","낮은 자신감은 종종 그들이 무력감을 느끼게 한다."]]},{"u":35,"n":1035,"w":"jealous","m":"질투하는, 시기하는","ex":[["Some people feel [jealous] of other people’s achievements.","어떤 사람들은 다른 사람들의 성취를 질투한다."]]},{"u":35,"n":1036,"w":"hostile","m":"1. 적대적인 2. 반대하는","ex":[["Extreme jealousy might even make them [hostile] to others.","심한 질투는 심지어 그들을 다른 사람들에게 적대적으로 만들 수 있다."]]},{"u":35,"n":1037,"w":"conflict","m":"갈등, 충돌; 상충하다, 모순되다","ex":[["Behaviors such as these can lead to [conflict] eventually.","이러한 행동들은 결국 갈등으로 이어질 수 있다."],["They found new evidence, and it [conflicts] with the previous findings.","그들은 새로운 증거를 발견했고, 그것은 이전의 연구 결과와 상충한다."]]},{"u":35,"n":1038,"w":"appropriate","m":"적절한","ex":[["There are many [appropriate] ways to get along with others.","다른 사람들과 어울리기 위한 적절한 방법들이 많이 있다."]]},{"u":35,"n":1039,"w":"honesty","m":"정직(성), 솔직함","ex":[["Practice [honesty] in all your relationships.","모든 관계에서 정직을 실천하라."]]},{"u":35,"n":1040,"w":"adjust","m":"1. 조정하다, 조절하다 2. (~에) 적응하다","ex":[["Act nicely first by [adjusting] how you speak to people.","사람들에게 말하는 방식을 조정함으로써 먼저 친절하게 행동해라."],["My eyes took some time to become [adjusted] to the dark.","내 눈이 어둠에 적응하는 데 시간이 좀 걸렸다."]]},{"u":35,"n":1041,"w":"generous","m":"1. 관대한 2. 후한, 아끼지 않는","ex":[["Also, be [generous] regarding the weaknesses of others.","또한, 타인의 약점에 대해 관대하라."],["My teacher is [generous] in marking.","우리 선생님은 점수를 주는 데 후하시다."]]},{"u":35,"n":1042,"w":"ridiculous","m":"우스꽝스러운; 터무니없는","ex":[["Even if others’ opinions sound [ridiculous], try to accept them.","다른 사람들의 의견이 터무니없게 들리더라도 그것들을 받아들이려고 노력해라."]]},{"u":35,"n":1043,"w":"gentle","m":"1. 상냥한; 점잖은 2. (자연 현상이) 부드러운, 온화한","ex":[["Then people will be [gentle] to you as well.","그러면 사람들 또한 너에게 상냥해질 것이다."],["It was a peaceful day, with a [gentle] breeze blowing.","부드러운 산들바람이 불어오는 평화로운 날이었다."]]},{"u":35,"n":1044,"w":"gradual","m":"점진적인, 서서히 일어나는","ex":[["You will find [gradual] changes in your relationships with others.","점진적인 너는 다른 사람들과의 관계에서 변화를 발견하게 될 것이다."]]},{"u":35,"n":1045,"w":"assist","m":"돕다, 원조하다","ex":[["People can [assist] others who have different personality weaknesses.","사람들은 다른 성격적 단점을 가진 타인들을 도울 수 있다."]]},{"u":35,"n":1046,"w":"trust","m":"신뢰하다, 믿다; 신뢰","ex":[["Through these steps, people can learn to [trust] each other.","이런 단계를 거쳐, 사람들은 서로를 신뢰하는 것을 배울 수 있다."],["Having mutual [trust] is important in any relationship.","상호 간의 신뢰를 갖는 것은 어떤 관계에서든 중요하다."]]},{"u":35,"n":1047,"w":"neglect","m":"1. 무시하다, 등한시하다 2. (해야 할 일을) 하지 않다; 1. 무시 2. 태만","ex":[["If we trust in each other, we can [neglect] small conflicts.","만약 우리가 서로를 믿는다면, 작은 갈등들은 무시할 수 있다."],["She [neglected] to mention the date that she arrives.","그녀는 자신의 도착 날짜를 말해주지 않았다."]]},{"u":35,"n":1048,"w":"rely","m":"의지하다, 믿다","ex":[["It will eventually allow us to [rely] on each other.","그것은 결국 우리가 서로를 의지할 수 있게 해줄 것이다."]]},{"u":35,"n":1049,"w":"root","m":"1. 뿌리; 뿌리를 내리다 2. 근원, 기원; 깊이 뿌리박게 하다 3. 근본; 조상 4. 어근","ex":[["He pulled up the flower by its [roots].","그는 그 꽃을 뿌리째 뽑았다."],["To solve a problem, it’s important to find the [root] of it.","문제를 해결하기 위해서는 그것의 근원을 찾는 것이 중요하다."],["The dance is [rooted] in African tradition.","그 춤은 아프리카의 전통에 깊이 뿌리박고 있다."],["He lives in Canada, but his [roots] are in Korea.","그는 캐나다에 살고 있지만 그의 근본은 한국에 있다."],["The [root] of the word “coldness” is “cold.”","단어 ‘coldness’의 어근은 ‘cold’이다."]]},{"u":35,"n":1050,"w":"course","m":"1. 과정, 경과, 전개 2. 강의, 강좌 3. 항로, 진로 4. (식사) 코스, 요리 5. 코스","ex":[["Surprising facts are discovered in the [course] of research.","연구 과정에서 놀라운 사실들이 발견된다."],["Don’t worry. Things will get better in the [course] of time.","걱정하지 마. 시간이 경과하면서 다 좋아질 거야."],["I’d like to take a Spanish [course] this semester.","나는 이번 학기에 스페인어 강의를 듣고 싶다."],["The captain had to change his [course] to avoid the storm.","선장은 폭풍우를 피하기 위해 항로를 변경해야 했다."],["I was really full after eating a five-[course] dinner.","나는 다섯 코스짜리 정식을 먹고 매우 배가 불렀다."],["Mary ran the whole [course] of a marathon for the first time.","Mary는 처음으로 마라톤 코스 전체를 뛰었다."]]},{"u":36,"n":1051,"w":"senior","m":"1. 연장(年長)자 2. 상급자 3. 졸업반 학생; 1. 손위의 2. 상급의, 상위의 3. 졸업반 학생의","ex":[["Please be sure to behave yourself around your [seniors].","주변의 연장자들에게 반드시 예의 바르게 행동하라."],["She is a high school [senior].","그녀는 고등학교 졸업반 학생이다."],["a [senior] position in a company","회사의 상급직"]]},{"u":36,"n":1052,"w":"elder","m":"나이가 더 많은 사람, 연장자; (가족 구성원 중에) 나이가 더 많은, 손위의","ex":[["You should offer food to your [elders] first.","나이가 더 많은 사람들에게 음식을 먼저 드려야 한다."],["the [elder] sister","누나[언니]"]]},{"u":36,"n":1053,"w":"wear","m":"1. (옷, 신발 등을) 입고[착용하고] 있다 2. 낡다, 닳다","ex":[["Do not [wear] a hat in front of your seniors.","연장자들 앞에서 모자를 쓰지 마라."],["Over time, the carpet has considerably [worn].","시간이 지나면서 그 카펫은 상당히 낡았다."]]},{"u":36,"n":1054,"w":"interrupt","m":"방해하다; (흐름 등을) 끊다, 중단시키다","ex":[["You should not [interrupt] while someone else is speaking.","다른 사람이 말하는 동안에 방해해서는 안 된다."]]},{"u":36,"n":1055,"w":"frown","m":"눈살을 찌푸리다, 얼굴을 찡그리다","ex":[["People will [frown] if someone is rude in a public place.","만약 누군가가 공공장소에서 무례하게 군다면 사람들은 눈살을 찌푸릴 것이다."]]},{"u":36,"n":1056,"w":"bump","m":"부딪치다; 1. 충돌; 쿵 (하는 소리) 2. (이마 등의) 혹; 튀어나온 부분","ex":[["When you [bump] into somebody on the street, you should apologize.","길에서 누군가와 부딪칠 때는 사과해야 한다."],["The airplane landed with a [bump].","그 비행기는 쿵 하며 착륙했다."],["a [bump] on the road","도로에서 튀어나온 부분"]]},{"u":36,"n":1057,"w":"aisle","m":"통로","ex":[["Don’t block the [aisles] in theaters or on trains.","극장이나 열차에서 통로를 막지 마라."]]},{"u":36,"n":1058,"w":"formal","m":"격식을 차린, 공식적인","ex":[["You must dress appropriately at a [formal] event.","공식적인 행사에서는 알맞게 차려입어야 한다."]]},{"u":36,"n":1059,"w":"annoy","m":"짜증 나게 하다, 귀찮게 하다","ex":[["Shaking your legs constantly can [annoy] others.","다리를 계속 떠는 것은 다른 사람들을 짜증 나게 할 수 있다."]]},{"u":36,"n":1060,"w":"stare","m":"빤히 쳐다보다, 응시하다; 응시","ex":[["[Staring] into a stranger’s eyes can be considered rude.","낯선 이의 눈을 빤히 쳐다보는 것은 무례하다고 여겨질 수 있다."]]},{"u":36,"n":1061,"w":"funeral","m":"장례식; 장례식의","ex":[["Learn what you need to know before attending a [funeral].","장례식에 참석하기 전에 알아야 하는 것을 익혀라."]]},{"u":36,"n":1062,"w":"permit","m":"허락하다, 가능케 하다; 허가(증)","ex":[["Most people tend not to [permit] personal questions.","대부분의 사람들은 사적인 질문을 허락하지 않는 경향이 있다."],["exit [permit]","출국 허가증"]]},{"u":36,"n":1063,"w":"belongings","m":"소지품; 소유물, 재산","ex":[["Do not touch others’ [belongings] in any situation.","어떤 상황에도 다른 사람의 소지품에 손대지 마라."]]},{"u":36,"n":1064,"w":"differ","m":"1. 다르다 2. 의견이 다르다","ex":[["Ways of life [differ] from culture to culture.","문화에 따라 삶의 방식이 다르다."],["They [differed] with each other on the matter.","그들은 그 문제에 대하여 서로 의견이 달랐다."]]},{"u":36,"n":1065,"w":"define","m":"1. 정의하다 2. (입장 등을) 밝히다 3. (경계, 범위 등을) 정하다","ex":[["It’s impossible to [define] a culture in a single word.","문화를 한 단어로 정의하는 것은 불가능하다."],["[Define] your goals and plans exactly.","너의 목표와 계획을 정확히 밝혀라."],["The border was [defined] by a river.","경계선이 강에 의해 정해졌다."]]},{"u":36,"n":1066,"w":"insult","m":"모욕, 무례; 모욕하다","ex":[["In West Africa, the thumbs up sign could be regarded as an [insult].","서아프리카에서는 엄지를 세우는 신호가모욕으로 여겨질 수 있다."]]},{"u":36,"n":1067,"w":"clap","m":"박수를 치다; 박수 (소리)","ex":[["People in Argentina [clap] or sing at a funeral.","아르헨티나 사람들은 장례식에서 박수를 치거나 혹은 노래를 부른다."]]},{"u":36,"n":1068,"w":"bless","m":"축복하다, (신의) 가호를 빌다","ex":[["They think God [blesses] the soul with death.","그들은 죽으면 신이 영혼을 축복한다고 생각한다."]]},{"u":36,"n":1069,"w":"sneeze","m":"재채기하다; 재채기","ex":[["If you [sneeze] in the United States, people often say “Bless you!”","미국에서 재채기하면 사람들이 종종 ‘신의 축복이 있기를!’이라고 말한다."]]},{"u":36,"n":1070,"w":"religion","m":"종교; 신앙(심)","ex":[["Muslims do not eat pork because of their [religion].","이슬람교도들은 자신의 종교 때문에 돼지고기를 먹지 않는다."]]},{"u":36,"n":1071,"w":"cherish","m":"1. 소중히 여기다 2. (마음속에) 간직하다, 품다","ex":[["Indians believe God gives us food and we should [cherish] it.","인도인들은 신이 우리에게 음식을 주며 우리는 그것을 소중히 여겨야 한다고 믿는다."],["My friend [cherished] the memory of his days in Korea.","내 친구는 한국에서 지낸 날들의 기억을 간직했다."]]},{"u":36,"n":1072,"w":"accept","m":"받아들이다, 수락하다","ex":[["It is usually [accepted] for guests to be a little late in Brazil.","브라질에서 손님이 조금 늦는 것은 보통 받아들여진다."]]},{"u":36,"n":1073,"w":"dislike","m":"싫어하다; 반감, 혐오","ex":[["Japanese people [dislike] being offered food with chopsticks.","일본인들은 젓가락으로 음식을 받는 것을 싫어한다."]]},{"u":36,"n":1074,"w":"reject","m":"거절하다, 거부하다","ex":[["It can be considered impolite to [reject] served rice in China.","중국에서는 제공된 밥을 거절하는 것이 무례하게 여겨질 수 있다."]]},{"u":36,"n":1075,"w":"cause","m":"일으키다, 초래하다; 원인, 이유","ex":[["If you clean your plate in China, it will [cause] a misunderstanding.","만약 중국에서 접시를 깨끗이 비운다면, 오해를 일으킬 것이다."]]},{"u":36,"n":1076,"w":"mislead","m":"잘못 이끌다; 오해하게 하다","ex":[["It might [mislead] hosts into thinking they haven’t prepared enough.","그것은 주인들이 (음식을) 충분히 준비하지 않았다고 생각하도록 오해하게 할지도 모른다."]]},{"u":36,"n":1077,"w":"cheek","m":"볼, 뺨","ex":[["A kiss on the [cheek] is a form of greeting in France.","프랑스에서는 볼에 키스하는 것이 인사의 한 형태이다."]]},{"u":36,"n":1078,"w":"administer","m":"1. 관리하다, 운영하다 2. (공정하게) 집행하다, 시행하다 3. (타격을) 가하다, 치다 4. 투여하다","ex":[["She was hired to [administer] the marketing department.","그녀는 마케팅 부서를 관리하기 위해 고용되었다."],["The fund will be [administered] by our local charity.","그 기금은 우리 지역 자선단체에 의해 운영될 것이다."],["By sending the criminal to jail, the judge [administered] the law.","범죄자를 감옥에 보냄으로써, 판사는 법을 집행했다."],["The boxer [administered] a strong punch to his opponent’s head.","그 복싱선수는 상대의 머리에 강력한 펀치를 가했다."],["A vaccine was [administered] to the baby.","백신이 아기에게 투여되었다."]]},{"u":36,"n":1079,"w":"conduct","m":"1. 수행하다, 처리하다; 수행, 처리 2. 행동하다, 처신하다; 행동 3. 지휘하다 4. 전도하다","ex":[["We [conducted] a survey in several restaurants for our project.","우리는 과제를 위해 몇몇 식당에서 설문조사를 수행했다."],["The actor was criticized for his rude [conduct].","그 배우는 무례한 행동으로 비난받았다."],["The orchestra is [conducted] by Colin Davis.","그 오케스트라는 Colin Davis에 의해 지휘된다."],["Metals [conduct] heat and electricity well.","금속은 열과 전기를 잘 전도한다."]]},{"u":36,"n":1080,"w":"blow","m":"1. (입으로) 불다; (입김에) 날리다 2. (관악기 등을) 불다; (관악기 등이) 울리다, 소리내다 3. (바람이) 불다; (바람에) 날리다; 강풍 4. (폭탄 등으로) 날려버리다, 폭파하다 5. (손, 무기 등으로) 세게 때림, 타격; (정신적) 충격","ex":[["He [blew] out the candles on the cake, and his friends clapped.","그는 케이크 위의 촛불을 불었고, 그의 친구들은 박수를 쳤다."],["The referee [blew] his whistle and the game started.","심판이 호루라기를 불었고 게임이 시작되었다."],["It rained heavily and the wind [blew] hard yesterday.","어제는 비가 많이 내렸고 바람도 세차게 불었다."],["The leaves were [blowing] around in the wind.","나뭇잎들이 바람에 날리고 있었다."],["The explosion [blew] out all the windows of the building.","그 폭발은 그 건물의 모든 창문을 날려버렸다."],["a [blow] to his body","그의 몸에 가해지는 타격"]]},{"u":37,"n":1081,"w":"career","m":"(전문적인) 직업; 경력","ex":[["There are many [careers] you can have in the world.","세상에는 네가 가질 수 있는 많은 직업이 있다."]]},{"u":37,"n":1082,"w":"inherit","m":"1. (재산, 업무 등을) 상속받다 2. (유전적으로) 물려받다","ex":[["In the past, people often [inherited] the family business, but now we usually choose our own careers.","과거에 사람들은 종종 가업을 상속받았지만, 이제 우리는 보통 자신의 직업을 직접 고른다."],["She [inherited] her father’s deep blue eyes.","그녀는 아버지의 깊고 푸른 눈을 물려받았다."]]},{"u":37,"n":1083,"w":"specialize","m":"전문으로 하다, 전공하다","ex":[["Most people [specialize] in one kind of work.","대부분의 사람들은 한 가지 종류의 일을 전문으로 한다."]]},{"u":37,"n":1084,"w":"profession","m":"직업; 전문직","ex":[["His [profession] requires him to travel a lot.","그의 직업은 여행을 많이 해야 한다."]]},{"u":37,"n":1085,"w":"client","m":"(전문가의 서비스를 받는) 의뢰인, 고객","ex":[["The lawyer is going to meet with an important [client].","그 변호사는 중요한 의뢰인을 만날 예정이다."]]},{"u":37,"n":1086,"w":"statistic","m":"통계(학); 통계 자료","ex":[["Marketers get [statistics] from market research and create sales strategies.","마케터들은 시장조사를 통해 통계를 내고 판매 전략을 세운다."]]},{"u":37,"n":1087,"w":"architect","m":"건축가, 설계자","ex":[["The [architect] designed a new high-rise building.","그 건축가가 새 고층 건물을 설계했다."]]},{"u":37,"n":1088,"w":"psychologist","m":"심리학자","ex":[["[Psychologists] specialize in the study of the human mind and behavior.","심리학자는 인간의 정신과 행동을 전문적으로 연구한다."]]},{"u":37,"n":1089,"w":"accountant","m":"회계사, 회계원","ex":[["[Accountants] provide tax advice for their clients.","회계사들은 의뢰인들에게 세무 조언을 제공한다."]]},{"u":37,"n":1090,"w":"consult","m":"상담하다, 상의하다","ex":[["We [consult] doctors to get the proper treatment.","우리는 적절한 치료를 받기 위해 의사와 상담한다."]]},{"u":37,"n":1091,"w":"counselor / counsellor","m":"상담사, 카운슬러","ex":[["A high school [counselor] helps students prepare for college and careers.","고등학교 상담사는 학생들이 대학과 직업을 준비하는 것을 돕는다."]]},{"u":37,"n":1092,"w":"rescue","m":"구조하다; 구출하다; 구조; 구출","ex":[["Firefighters [rescue] people from dangerous situations.","소방관들은 사람들을 위험한 상황에서 구조한다."]]},{"u":37,"n":1093,"w":"mechanic","m":"정비사, 수리공","ex":[["A [mechanic] repairs and maintains cars, trucks, and other vehicles.","정비사는 자동차, 트럭, 그리고 다른 차량들을 수리하고 유지 보수한다."]]},{"u":37,"n":1094,"w":"technician","m":"(기계 등의) 기술자, 전문가","ex":[["Experienced computer [technicians] can solve complex computer issues.","숙련된 컴퓨터 기술자들은 복잡한 컴퓨터 문제들을 해결할 수 있다."]]},{"u":37,"n":1095,"w":"broadcaster","m":"방송인, 방송 진행자; 방송국","ex":[["[Broadcasters] should understand audiences’ needs and recent trends.","방송인들은 시청자들의 요구와 최근의 추세를 이해해야 한다."]]},{"u":37,"n":1096,"w":"compose","m":"1. 작곡하다 2. 쓰다, 작성하다 3. 구성하다","ex":[["Musicians use computer programs to [compose] their songs these days.","오늘날의 음악가들은 노래를 작곡하기 위해 컴퓨터 프로그램을 사용한다."],["This poem was [composed] for the writer’s wife.","이 시는 작가의 아내를 위해 쓰였다."],["Our group is [composed] of travelers from 7 countries.","우리 그룹은 7개국에서 온 여행객들로 구성되어 있다."]]},{"u":37,"n":1097,"w":"criticize / criticise","m":"비평하다, 비판하다; 비난하다","ex":[["The critic [criticized] the director’s new movie.","그 비평가는 그 감독의 새 영화를 비평했다."]]},{"u":37,"n":1098,"w":"translate","m":"번역하다, 통역하다","ex":[["She works for the UN, [translating] from English into French.","그녀는 영어를 프랑스어로 통역하며 UN에서 일한다."]]},{"u":37,"n":1099,"w":"author","m":"작가, 저자; 쓰다, 저술하다","ex":[["If you’re interested in writing, you can be an [author].","만약 네가 글쓰기에 관심이 있다면, 너는 작가가 될 수 있다."]]},{"u":37,"n":1100,"w":"essay","m":"수필; (짧은 논문식) 과제물, 리포트","ex":[["You can practice writing short [essays].","너는 짧은 수필을 쓰는 것을 연습할 수 있다."]]},{"u":37,"n":1101,"w":"deal","m":"1. 다루다, 취급하다 2. 거래하다; 1. 취급 2. 거래 3. 많음, 다량","ex":[["You can write books that [deal] with the topics you are interested in.","너는 네가 관심이 있는 주제를 다루는 책을 쓸 수 있다."],["We’ve cut a [deal] with Germany on wine imports.","우리는 독일과 와인 수입 거래를 했다."],["They spent a great [deal] of money on research and development.","그들은 연구 개발에 많은 돈을 썼다."]]},{"u":37,"n":1102,"w":"fiction","m":"소설; 꾸며낸 이야기, 허구","ex":[["If you’re good at imagining things, try writing [fiction].","만약 네가 무언가 상상하는 것을 잘한다면, 소설을 써 보라."]]},{"u":37,"n":1103,"w":"conference","m":"(규모가 큰) 회의, 회담","ex":[["To improve your writing skills, you can attend a [conference] of writers.","글쓰기 기술을 향상시키기 위해, 너는 작가들의 회의에 참석할 수 있다."]]},{"u":37,"n":1104,"w":"insight","m":"통찰력; 이해, 간파","ex":[["You can also develop [insight] by communicating with other writers.","다른 작가들과 소통함으로써 너는 통찰력을 기를 수도 있다."]]},{"u":37,"n":1105,"w":"contract","m":"계약(서); 1. 계약하다 2. 수축하다 3. (병에) 걸리다","ex":[["A writer signs a [contract] with a publishing company.","작가는 출판사와의 계약서에 서명한다."],["Steel [contracts] as it cools.","강철은 차가워지면 수축한다."],["Lucas was two years old when he [contracted] measles.","Lucas가 홍역에 걸렸을 때 그는 두 살이었다."]]},{"u":37,"n":1106,"w":"editor","m":"(신문, 잡지 등의) 편집장; 편집자","ex":[["[Editors] decide what will be published.","편집장들은 무엇을 출판할지 결정한다."]]},{"u":37,"n":1107,"w":"poet","m":"시인","ex":[["A great [poet] is imaginative and creative.","훌륭한 시인은 상상력이 뛰어나고 창의적이다."]]},{"u":37,"n":1108,"w":"agency","m":"1. 대행사, 대리점 2. 중개(소), 소개소 3. (정부) 기관, -청, -국","ex":[["My brother is working for an advertising [agency].","우리 오빠는 광고 대행사에서 일한다."],["I think this travel [agency] offers the most reasonable prices.","내 생각에 이 여행사가 가장 합리적인 가격을 제시하는 것 같다."],["I sent my application to several employment [agencies].","나는 직업소개소 몇 군데에 내 지원서를 보냈다."],["Various government [agencies] provide services for people’s convenience.","다양한 정부기관들이 국민의 편의를 위한 서비스를 제공한다."],["the National Police [Agency]","경찰청"]]},{"u":37,"n":1109,"w":"quarter","m":"1. 4분의 1; 4등분하다 2. 15분 3. 25센트 4. 분기","ex":[["Over a [quarter] of my father’s income goes to food for my family.","아버지의 수입 중 4분의 1 이상이 우리 가족의 식비로 나간다."],["My mom peeled an apple and [quartered] it for me.","우리 엄마는 나를 위해 사과를 깎아서 4등분해주셨다."],["I arrived at school at a [quarter] after eight.","나는 8시 15분에 학교에 도착했다."],["Can I change this dollar into four [quarters]?","이 달러를 25센트짜리 네 개로 바꿀 수 있을까요?"],["The bank updates its database of customers every [quarter].","그 은행은 고객 데이터베이스를 분기마다 업데이트한다."]]},{"u":37,"n":1110,"w":"work","m":"1. 일하다, 작업하다; 일, 작업; 직장 2. 작동하다 3. 효과가 있다\n4. 노력하다; 노력","ex":[["My father is a teacher, and my mother [works] as a nurse.","우리 아버지는 선생님이시고 어머니는 간호사로 일하신다."],["I have lots of [work] to do, but I don’t have enough time.","나는 해야 할 일이 많지만 시간이 충분하지 않다."],["I had to take the stairs because the elevator wasn’t [working].","엘리베이터가 작동하지 않아서 나는 계단을 이용해야 했다."],["As I feel better, the medicine seems to be [working].","내 상태가 나아지는 걸 보니 그 약이 효과가 있는 것 같다."],["We [worked] hard to finish our team assignment successfully.","우리는 조별 과제를 성공적으로 마치기 위해 열심히 노력했다."]]},{"u":38,"n":1111,"w":"infant","m":"아기, 유아","ex":[["Human [infants] are born helpless, with no ability to survive.","인간의 아기들은 생존할 능력 없이 무력하게 태어난다."]]},{"u":38,"n":1112,"w":"object","m":"1. 물체, 사물 2. 목표, 목적; 반대하다","ex":[["During their first week, they can’t even see [objects] that are more than 12 inches away from them.","생후 일주일간, 그들은 자신으로부터 12인치 넘게 떨어져 있는 물체를 보지도 못한다."],["The [object] of this word game is to improve students’ vocabulary.","이 단어 게임의 목표는 학생들의 어휘력을 향상시키는 것이다."],["If half of all students [object], the new rules won’t be passed.","만약 전교생의 절반이 반대한다면, 새로운 교칙은 통과되지 않을 것이다."]]},{"u":38,"n":1113,"w":"gain","m":"획득하다, 얻다; 이익; 증가","ex":[["So, they [gain] survival skills while growing up.","그래서 그들은 자라는 동안 생존 기술을 획득한다."],["Loss of sleep can cause weight [gain].","수면 부족이 체중 증가를 일으킬 수 있다."]]},{"u":38,"n":1114,"w":"lifelong","m":"평생 동안의, 일생의","ex":[["Developments that happen in their early years have a [lifelong] impact.","생애 초기에 일어나는 발달은 평생 동안의 영향을 미친다."]]},{"u":38,"n":1115,"w":"physical","m":"1. 신체의, 육체의 2. 물리적인, 물질적인","ex":[["During these years, they experience rapid [physical] growth.","이 시기에 그들은 빠른 신체의 성장을 경험한다."],["All [physical] objects occupy space.","모든 물리적인 사물은 공간을 차지한다."]]},{"u":38,"n":1116,"w":"undergo","m":"겪다, 경험하다","ex":[["The human brain [undergoes] considerable changes in early childhood, with 90 percent of it being developed by age 5.","인간의 두뇌는 유아기에 상당한 변화를 겪는데, 5세까지 두뇌의 90%가 발달한다."]]},{"u":38,"n":1117,"w":"neural","m":"신경의, 신경계의","ex":[["More than one million [neural] connections are formed each second, faster than at any other time in life.","초당 100만 개가 넘는 신경의 연결이 일어나는데, 이것은 인생의 다른 어떤 때보다도 빠른 속도 이다."]]},{"u":38,"n":1118,"w":"crawl","m":"(엎드려) 기다, 기어가다; 기어가기; 서행","ex":[["As they learn to use large muscle, they start to roll and [crawl].","대근육을 사용하는 법을 배우면서, 그들은 구르고 기기 시작한다."]]},{"u":38,"n":1119,"w":"grasp","m":"1. 꽉 잡다 2. 완전히 이해하다; 1. 움켜잡기 2. 이해","ex":[["They can [grasp] and pick up objects with their fingers as small muscles grow.","그들은 소근육이 성장하면서 손가락으로 물체를 꽉 잡아 집어 들 수 있다."],["I needed some time to [grasp] what happened.","나는 무슨 일이 일어났는지 완전히 이해하는 데 시간이 좀 필요했다."]]},{"u":38,"n":1120,"w":"cognitive","m":"인지의, 인식의","ex":[["Moreover, essential [cognitive] skills like thinking and reasoning are acquired.","또한, 사고 및 추론과 같은 필수적인 인지 기술이 습득된다."]]},{"u":38,"n":1121,"w":"emotional","m":"정서적인, 감정적인","ex":[["Social and [emotional] skills, such as sharing with others or controlling feelings, are developed.","타인과 공유하거나 감정을 통제하는 것과 같은 사회적, 정서적 기술이 발달한다."]]},{"u":38,"n":1122,"w":"dedication","m":"전념, 헌신","ex":[["And these changes cannot happen without the [dedication] of caregivers.","그리고 이러한 변화들은 돌보는 사람들의 헌신 없이는 일어날 수 없다."]]},{"u":38,"n":1123,"w":"nutrition","m":"영양 (섭취)","ex":[["The quality of children’s [nutrition] has a great influence on their growth.","아이들의 영양 섭취의 질은 그들의 성장에 큰 영향을 미친다."]]},{"u":38,"n":1124,"w":"delay","m":"1. 지연, 지체 2. 연기; 1. 지연시키다, 지체시키다 2. 연기하다, 미루다","ex":[["Poor nutrition in early childhood can cause developmental [delays].","유아기의 부실한 영양 섭취는 발달 지연을 일으킬 수 있다."],["The baseball game was [delayed] due to bad weather.","야구 경기는 악천후로 인해 연기되었다."]]},{"u":38,"n":1125,"w":"deficit","m":"결핍, 부족; 적자","ex":[["It can cause behavioral and cognitive [deficits] such as slower language development.","그것은 더딘 언어 발달과 같은 행동적, 인지적 결핍을 일으킬 수 있다."],["a trade [deficit]","무역 적자"]]},{"u":38,"n":1126,"w":"lack","m":"(~이) 부족하다, 없다; 부족, 결핍","ex":[["A diet [lacking] calcium and vitamins can cause weak bones.","칼슘과 비타민이 부족한 식단은 뼈를 약하게 만들 수 있다."]]},{"u":38,"n":1127,"w":"intake","m":"섭취(량), 흡입","ex":[["Without proper fat [intake], a child’s brain won’t develop or function normally.","적절한 지방 섭취가 없으면, 아이의 두뇌는 정상적으로 발달하거나 기능하지 않을 것이다."]]},{"u":38,"n":1128,"w":"interact","m":"상호 작용하다; 소통하다","ex":[["Humans’ ability to [interact] and communicate is cultivated in their early years.","인간의 상호 작용하고 의사소통하는 능력은 어린 시절에 길러진다."],["The teacher [interacts] well with all students.","그 선생님은 학생들 모두와 잘 소통하신다."]]},{"u":38,"n":1129,"w":"secure","m":"1. 안심하는 2. 안전한, 안정된; 1. 안전하게 하다 2. (힘겹게) 얻어 내다 3. 고정하다","ex":[["Positive two-way communication with adults helps children feel [secure].","어른들과의 긍정적인 쌍방향 의사소통은 아이들이 안심하도록 도와준다."],["This electric fence will [secure] your home against theft.","이 전기 울타리가 너의 집을 절도로부터 안전하게 할 것이다."],["After years of effort, he finally [secured] a victory.","수년간의 노력 끝에, 그는 마침내 승리를 얻어 냈다."],["The ship was [secured] with anchors and chains.","그 배는 닻과 사슬로 고정되었다."]]},{"u":38,"n":1130,"w":"praise","m":"칭찬; 칭찬하다","ex":[["[Praise] and encouragement make them willing to express their feelings.","칭찬과 격려는 그들이 기꺼이 자신의 감정을 표현하게 해준다."]]},{"u":38,"n":1131,"w":"shame","m":"1. 수치심, 부끄러움 2. 아쉬운[애석한] 일","ex":[["Be open to talking about all kinds of feelings without any [shame].","부끄러움 없이 모든 종류의 감정에 대해 솔직하게 말하라."],["It is a [shame] that he can’t join this trip.","그가 이번 여행에 참석하지 못하는 것은 아쉬운 일이다."]]},{"u":38,"n":1132,"w":"verbal","m":"언어의, 말로 된","ex":[["Try to catch not only the [verbal] messages but also the non-verbal messages in their body language.","언어적 메시지뿐만 아니라 그들의 몸짓 언어에 담긴 비언어적 메시지도 알아채도록 노력하라."]]},{"u":38,"n":1133,"w":"inspire","m":"1. 격려하다 2. 영감을 주다, (감정 등을) 불어넣다","ex":[["[Inspiring] children to be good listeners is another challenge for grown-ups.","경청하는 사람이 되도록 아이들을 격려하는 것은 어른들의 또 다른 과제이다."],["People were [inspired] by his attitude and passion.","사람들은 그의 태도와 열정에 영감을 받았다."]]},{"u":38,"n":1134,"w":"attention","m":"1. 주의, 주목 2. 관심, 흥미","ex":[["Remind them to pay [attention] to what other people say.","다른 사람이 하는 말에 주의를 기울일 것을 그들에게 상기시켜 주어라."],["Children need their parents’ love and [attention].","아이들에게는 부모의 사랑과 관심이 필요하다."]]},{"u":38,"n":1135,"w":"attitude","m":"태도; 자세","ex":[["Play will be the best way to develop a respectful [attitude] toward others.","놀이는 타인을 존중하는 태도를 기르는 가장 좋은 방법이 될 것이다."]]},{"u":38,"n":1136,"w":"regulate","m":"통제하다, 규제하다","ex":[["To continue playing, they have to wait their turn and [regulate] their emotions.","놀이를 계속하려면, 그들은 자신의 차례를 기다리고 감정을 통제해야 한다."]]},{"u":38,"n":1137,"w":"manner","m":"방식, 태도","ex":[["All scientific research should be done in an ethical [manner].","모든 과학적 연구는 윤리적인 방식으로 이루어져야 한다."]]},{"u":38,"n":1138,"w":"manners","m":"1. 예절, 예의 2. 풍습, 관습","ex":[["Table [manners] are important when you have a meal with others.","다른 사람들과 식사를 할 때 식사 예절은 중요하다."],["This book covers [manners] and etiquette in 17th-century England.","이 책은 17세기 영국의 풍습과 예절을 다룬다."]]},{"u":38,"n":1139,"w":"mean","m":"의미하다","ex":[["The word “since” [means] “because” in this sentence.","이 문장에서 단어 ‘since’는 ‘~ 때문에’를 의미한다."]]},{"u":38,"n":1140,"w":"means","m":"수단, 방법","ex":[["Smartphones are the most common [means] of communication these days.","요즘 스마트폰은 가장 흔한 의사소통의 수단이다."]]},{"u":39,"n":1141,"w":"appoint","m":"1. (시간, 장소 등을) 정하다 2. 임명하다, 지명하다","ex":[["Everything comes gradually and at its [appointed] hour. - Ovid","모든 것은 서서히 정해진시간에 다가온다. (→ 조급해하지 마라.)"],["She was [appointed] as a representative of the committee.","그녀는 위원회 대표로 임명되었다."]]},{"u":39,"n":1142,"w":"persist","m":"(끈질기게) 계속하다; 지속되다","ex":[["To succeed, [persist] in trying to achieve your goal.","성공하려면 목표를 달성하기 위한 노력을 계속하라."]]},{"u":39,"n":1143,"w":"nonsense","m":"터무니없는 생각, 허튼소리","ex":[["Creative ideas are sometimes born from [nonsense].","때로 창의적인 아이디어는 터무니없는 생각에서 나온다."]]},{"u":39,"n":1144,"w":"belief","m":"믿음, 신념; 확신","ex":[["Be confident and have [belief] in yourself.","자신감을 갖고 스스로에 대한 믿음을 가져라."]]},{"u":39,"n":1145,"w":"inner","m":"내면의; 내부의","ex":[["To achieve your goal, focus on your [inner] voice. - Steve Jobs","목표를 달성하기 위해서는 너의 내면의 목소리에 집중하라. (→ 네가 진짜 원하는 것에 몰두하라.)"]]},{"u":39,"n":1146,"w":"fundamental","m":"근본적인; 핵심적인, 필수적인","ex":[["Action is the [fundamental] key to all success. - Pablo Picasso","행동은 모든 성공의 근본적인 비결이다."]]},{"u":39,"n":1147,"w":"pray","m":"기도하다; 빌다","ex":[["[Pray] for the strength to endure a difficult life, not for an easy one. - Bruce Lee","쉬운 삶을 위해서가 아니라, 어려운 삶을 견딜 힘을 위해 기도하라."]]},{"u":39,"n":1148,"w":"quit","m":"그만두다, 중지하다","ex":[["It’s always too early to [quit]. - Norman Vincent Peale","그만두는 것은 항상 너무 이르다. (→ 포기하지 말고 계속해서 노력하라.)"]]},{"u":39,"n":1149,"w":"core","m":"1. 핵심 2. (사물의) 중심부; (지구의) 중심핵; 핵심적인, 가장 중요한","ex":[["The [core] of happiness is remembering what is important to you.","행복의 핵심은 무엇이 너에게 중요한 것인지를 기억하는 것이다."],["the earth’s [core]","지구의 중심핵"]]},{"u":39,"n":1150,"w":"strategy","m":"전략, 계획","ex":[["[Strategy] is worthless unless you can act on it. - Nathan Shedroff","전략은 네가 그것에 따라 행동하지 않으면 가치가 없다."]]},{"u":39,"n":1151,"w":"limitation","m":"한계, 제한; 규제, 제약","ex":[["Accept human differences and [limitations]. - David J. Schwartz","사람들의 차이와 한계를 인정해라."]]},{"u":39,"n":1152,"w":"instant","m":"즉각적인; 즉석의; 즉시; 순간","ex":[["Don’t expect [instant] results.","즉각적인 결과를 기대하지 마라. (→ 모든 일에는 시간이 필요하므로 기다려라.)"]]},{"u":39,"n":1153,"w":"holy","m":"신성한, 성스러운","ex":[["[Holy] words you read will be useless if you don’t act upon them. - Buddha","신성한 말씀을 읽더라도 그에 따라 행동하지 않으면 쓸모없을 것이다."]]},{"u":39,"n":1154,"w":"inward","m":"1. 내부의 2. 마음속의; 1. 내부로 2. 마음속으로","ex":[["To live happily is an [inward] power of the soul. - Marcus Aurelius","행복하게 사는 것은 영혼 내부의 힘이다. (→ 행복은 마음먹기에 달려 있다.)"],["Her smiling face expresses her [inward] happiness.","그녀의 웃는 얼굴이 그녀의 마음속의 행복을 나타낸다."]]},{"u":39,"n":1155,"w":"heal","m":"치유되다, 치유하다","ex":[["[Healing] is a matter of time, but it is sometimes also a matter of opportunity. - Hippocrates","치유되는 것은 시간의 문제이지만, 때때로 기회의 문제가 되기도 한다. (→ 문제가 해결되기를 기다리기보다는 문제를 해결하기 위한 기회를 잡아라.)"]]},{"u":39,"n":1156,"w":"trail","m":"1. 흔적, 자취 2. 오솔길","ex":[["Go where there is no path and leave a [trail]. - Ralph Waldo Emerson","길이 없는 곳에 가서 흔적을 남겨라. (→ 남들이 시도하지 않은 새로운 길을 개척하라.)"],["a [trail] through the forest","숲속으로 난 오솔길"]]},{"u":39,"n":1157,"w":"courage","m":"용기, 배짱","ex":[["[Courage] is knowing what not to fear. - Plato","용기란 두려워하지 말아야 할 것을 아는 것이다."]]},{"u":39,"n":1158,"w":"dare","m":"(~할) 용기가 있다; 감히 ~하다","ex":[["Those who [dare] to fail terribly can achieve greatly. - John F. Kennedy","크게 실패할 용기가 있는 사람들은 크게 성공할 수 있다. (→ 실패를 두려워하지 마라.)"]]},{"u":39,"n":1159,"w":"venture","m":"(위험을 무릅쓰고) 하다; 모험; 벤처 (사업) ((모험이 필요하지만 참신한 사업이나 투자의 대상))","ex":[["Nothing [ventured], nothing gained. - English Proverb","아무것도 하지 않으면, 얻는 것도 없다."],["The company is a model of a successful [venture] business.","그 회사는 성공적인 벤처 기업의 표본이다."]]},{"u":39,"n":1160,"w":"worth","m":"가치가 있는; 가치, 진가","ex":[["For what it’s [worth], it’s never too late. - F. Scott Fitzgerald","가치가 있는 것이라면 너무 늦은 건 없다."]]},{"u":39,"n":1161,"w":"pursue","m":"1. 추구하다 2. 뒤쫓다, 추적하다","ex":[["All dreams come true if we have the courage to [pursue] them. - Walt Disney","만약에 우리가 꿈을 추구할 용기를 가지고 있다면, 모든 꿈은 이루어진다."],["Police [pursued] the car at high speed.","경찰이 그 차를 빠른 속도로 뒤쫓았다."]]},{"u":39,"n":1162,"w":"destiny","m":"운명, 숙명","ex":[["It is in your moments of decision that your [destiny] is shaped. - Tony Robbins","너의 운명이 만들어지는 것은 네가 결심하는 그 순간이다."]]},{"u":39,"n":1163,"w":"despair","m":"절망하다, 체념하다; 절망, 체념","ex":[["He who has never hoped can never [despair]. - George Bernard Shaw","희망을 품어보지 않은 사람은 절망할 수도 없다."]]},{"u":39,"n":1164,"w":"bitter","m":"1. (맛이) 쓴 2. 고통스러운, 쓰라린 3. (날씨가) 혹독한, 매서운","ex":[["Patience is [bitter], but its fruit is sweet. - Jean-Jacques Rousseau","인내는 쓰지만 열매는 달다."],["I’ve learned from [bitter] experience not to lie.","나는 거짓말하면 안 된다는 것을 고통스러운 경험을 통해서 배웠다."],["a [bitter] wind","매서운 바람"]]},{"u":39,"n":1165,"w":"reveal","m":"드러내다, 밝히다","ex":[["What you risk [reveals] what you value. - Jeanette Winterson","어떤 위험을 감수하느냐가 무엇을 가치 있게 여기는지를 드러낸다."]]},{"u":39,"n":1166,"w":"harbor / harbour","m":"항구; 1. (항구에) 정박하다 2. (생각 등을) 품다","ex":[["Ships are safe in a [harbor], but that’s not what ships were built for. - Grace Hopper","배는 항구에서 안전하지만 그것을 위해 만들어진 게 아니다. (→ 안전함만을 추구하기보다 모험을 하라.)"],["He began to [harbor] doubts about the path he had chosen.","그는 자신이 선택한 길에 대해 의구심을 품기 시작했다."]]},{"u":39,"n":1167,"w":"custom","m":"풍습, 관습; 습관","ex":[["Pulling a person by the ear is a Spanish birthday [custom].","사람의 귀를 잡아당기는 것은 스페인의 생일 풍습이다."]]},{"u":39,"n":1168,"w":"customs","m":"1. 관세 2. 세관","ex":[["He had to pay [customs] for what he bought in Brazil.","그는 자신이 브라질에서 구입한 물건에 대해 관세를 내야 했다."],["I went through [customs] at the airport without any difficulty.","나는 아무런 어려움 없이 공항에서 세관을 통과했다."]]},{"u":39,"n":1169,"w":"remain","m":"1. 남아 있다 2. 여전히 ~이다","ex":[["Only a few buildings [remained] in the town after the hurricane.","허리케인이 지나간 후 그 마을에는 건물 몇 채만이 남아 있었다."],["This house has [remained] empty for two years.","이 집은 2년 동안 여전히, 있었다비어."]]},{"u":39,"n":1170,"w":"remains","m":"1. 남은 것, 나머지 2. 유적","ex":[["He cleaned up the [remains] of dinner and wiped the table.","그는 저녁 식사 후 남은 것을 치우고 식탁을 닦았다."],["The [remains] of the old castle were found in the lake.","그 오래된 성의 유적은 호수 속에서 발견되었다."]]},{"u":40,"n":1171,"w":"prompt","m":"즉각적인, 신속한; 촉발하다, 유도하다","ex":[["People can get [prompt] news from social media.","사람들은 신속한 뉴스를 소셜 미디어로부터 얻을 수 있다."],["It was hunger that [prompted] the man to steal.","그 남자가 도둑질하도록 촉발한것은 배고픔이었다."],["The teacher [prompted] his students to answer the question.","선생님은 학생들이 질문에 대답하도록 유도했다."]]},{"u":40,"n":1172,"w":"spread","m":"1. 퍼지다, 확산되다 2. 펴다, 펼치다; 확산","ex":[["News from social media can [spread] in just a few minutes.","소셜 미디어로부터의 뉴스는 단 몇 분 만에 퍼질 수 있다."],["I [spread] the map on the table to find the way.","나는 길을 찾기 위해 지도를 탁자 위에 펼쳤다."]]},{"u":40,"n":1173,"w":"response","m":"1. 반응 2. 대답, 응답","ex":[["We also get quick [responses] from social media.","우리는 또한 소셜 미디어에서 빠른 반응을 얻는다."],["When I asked my mom something, her [response] was always sweet.","내가 엄마에게 뭔가를 물었을 때, 엄마의 대답은 항상 다정했다."]]},{"u":40,"n":1174,"w":"disaster","m":"1. 재해, 재앙; 불행 2. (큰) 실패","ex":[["Natural [disasters] can be reported quickly on social media.","자연 재해가 소셜 미디어를 통해 빠르게 전해질 수 있다."],["Because of the rain, our picnic w const BOOK = DATA.book, UNITS = DATA.units, WORDS = DATA.words;
const hashPin = (name, pin) => { let h = 5381; const t = name + '|' + pin + '|wt'; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return h.toString(16); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const norm = s => String(s || '').toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, ' ').trim();
const showWord = w => w.replace(/\s*\([^)]*\)/g, '').trim();
const wordKey = w => showWord(w).toLowerCase().replace(/\s+/g, '');
const answerForms = word => showWord(word).split('/').map(norm).filter(Boolean);
function parseBlank(example) {
  const m = example.match(/\[([^\]]+)\]/);
  if (!m) return null;
  const clean = s => s.replace(/\[([^\]]+)\]/g, '$1');
  return { before: clean(example.slice(0, m.index)), form: m[1].trim(), after: clean(example.slice(m.index + m[0].length)) };
}
const RANGE_WORDS = WORDS.filter(w => w.u >= UNIT_FROM && w.u <= UNIT_TO);
const RANGE_LABEL = UNIT_FROM === UNIT_TO ? `Unit ${UNIT_FROM}` : `Unit ${UNIT_FROM}~${UNIT_TO}`;
const UNIT_LIST = []; for (let n = UNIT_FROM; n <= UNIT_TO; n++) if (UNITS[n]) UNIT_LIST.push(n);
const TOTAL = UNIT_LIST.reduce((s, u) => s + WORDS.filter(w => w.u === u).length, 0);

// ---- 문제 만들기: 유닛마다 단어 전부를 한 번씩, 유형은 PER_UNIT 비율로 ----
function buildQuiz() {
  const quiz = [];
  UNIT_LIST.forEach(u => {
    const words = shuffle(WORDS.filter(w => w.u === u));
    const plan = [];
    ['blank', 'mc', 'spell'].forEach(t => { for (let i = 0; i < (PER_UNIT[t] || 0); i++) plan.push(t); });
    while (plan.length < words.length) plan.push('blank');
    const qs = words.map((w, i) => makeQuestion(w, plan[i] || 'blank'));
    quiz.push(...shuffle(qs));
  });
  return quiz;
}
function makeQuestion(w, type) {
  if (type === 'blank' && !w.ex.length) type = 'spell';
  if (type === 'mc' && RANGE_WORDS.length < 4) type = 'spell';
  const q = { type, w };
  if (type === 'mc') {
    const seen = new Set([w.m]), others = [];
    shuffle(RANGE_WORDS).forEach(x => {
      if (others.length < 3 && x !== w && !seen.has(x.m) && wordKey(x.w) !== wordKey(w.w)) { seen.add(x.m); others.push(x.m); }
    });
    q.choices = shuffle([w.m, ...others]);
  }
  if (type === 'blank') {
    const ex = w.ex[Math.floor(Math.random() * w.ex.length)];
    q.blank = parseBlank(ex[0]); q.ko = ex[1];
    if (!q.blank) q.type = 'spell';
  }
  return q;
}
function isCorrect(q, ans) {
  if (q.type === 'mc') return ans === q.w.m;
  const a = norm(ans);
  if (!a) return false;
  const forms = answerForms(q.w.w);
  if (q.type === 'blank' && q.blank) forms.push(norm(q.blank.form));
  return forms.includes(a);
}
function fmtDate(d) {
  const day = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${day}) ${hh}:${mm}`;
}
function fmtElapsed(ms) {
  const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000);
  return m ? `${m}분 ${s}초` : `${s}초`;
}

    const l = await window.storage.list(prefix, true);
    for (const k of ((l && l.keys) || [])) { try { await window.storage.delete(k, true); } catch (e) {} }
  }
}
// 풀이 중 진행 상황을 선생님 화면에 보내기 (자동 저장이 되는 환경에서만)
function pushLive(done = false) {
  if (!hasStorage() || !state.liveKey) return;
  const rec = { n: state.name, t: state.startedAt, at: Date.now(), i: state.results.length, T: state.quiz.length,
                s: state.results.filter(r => r.ok).length, to: state.results.filter(r => r.timeout).length,
                u: state.quiz[Math.min(state.idx, state.quiz.length - 1)].w.u, done };
  window.storage.set(state.liveKey, JSON.stringify(rec), true).catch(() => {});
}
async function loadLive() {
  if (!hasStorage()) return null;
  const l = await window.storage.list('live:', true);
  const out = [];
  for (const k of ((l && l.keys) || [])) { try { const r = await window.storage.get(k, true); if (r && r.value) out.push(JSON.parse(r.value)); } catch (e) {} }
  const cutoff = Date.now() - 6 * 3600 * 1000;   // 6시간 이전 것은 숨김
  return out.filter(r => r.at > cutoff).sort((a, b) => a.t - b.t);
}
function ago(ms) { const s = Math.round(ms / 1000); return s < 60 ? `${s}초 전` : `${Math.floor(s / 60)}분 전`; }
function renderLive() {
  const el = document.getElementById('live'); if (!el) return;
  if (!hasStorage()) { el.innerHTML = `<div class="lh"><b>실시간 진행</b><span>자동 저장이 연결된 뒤에 보여요</span></div>`; return; }
  const rows = state.live;
  el.innerHTML = `<div class="lh"><b>실시간 진행</b><span>5초마다 새로 고침 · ${rows.length}명</span></div>` +
    (rows.length ? rows.map(r => `<div class="lrow">
      <div class="top"><b>${esc(r.n)}</b><span>${r.done ? '완료' : `풀이 중 · Unit ${r.u} · ${esc(ago(Date.now() - r.at))}`}</span></div>
      <div class="pbar${r.done ? ' done' : ''}"><div style="width:${(r.i / r.T * 100).toFixed(0)}%"></div></div>
      <div class="meta">${r.i} / ${r.T} 문항 · 맞음 ${r.s}${r.to ? ` · <span class="to">시간 초과 ${r.to}</span>` : ''}</div>
    </div>`).join('') : `<div class="empty">아직 시작한 학생이 없어요.</div>`);
}
function startLive() {
  stopLive();
  if (!hasStorage()) { renderLive(); return; }
  const tick = async () => { try { const l = await loadLive(); if (l) state.live = l; } catch (e) {} if (state.screen === 'teacher') renderLive(); };
  tick(); state.liveTimer = setInterval(tick, 5000);
}
function stopLive() { if (state.liveTimer) { clearInterval(state.liveTimer); state.liveTimer = null; } }

    body = `<p class="lead">영어로 쓰세요</p>

        <li>

        </li>`; }).join('');
  const P = projection(rec, A);

        <p class="fine" style="margin:0 0 12px">인식 보기에서 고르기 · 재생 뜻만 보고 쓰기 · 적용 문장 속에서 쓰기. 오른쪽으로 갈수록 깊이 익힌 것입니다.</p>

  return `
    <div class="brand">해율북스</div>
    <h1>${esc(state.name)}</h1>
    <div class="sub">시작하기 전에 하나만요.</div>
    <div class="study" style="margin-top:30px">
      <div class="field"><span>이번 주 이 범위 단어를 공부한 시간은?</span>
        <div class="chips">${STUDY_OPTIONS.map((o, k) => `<button class="chip${state.study === k ? ' on' : ''}" data-action="study" data-k="${k}">${esc(o)}</button>`).join('')}</div>
      </div>
      <div class="actions"><button class="btn primary big" data-action="begin"${state.study === null ? ' disabled' : ''}>시험 시작</button></div>
      <p class="rule">솔직하게 골라도 점수와는 상관없어요. 결과지에서 공부한 시간과 결과를 같이 봐요.</p>
    </div>`;
}

function render() {
  const fn = { start: renderStart, study: renderStudy, quiz: renderQuiz, result: renderResult, teacher: renderTeacher }[state.screen];
  app.innerHTML = fn();
  window.scrollTo(0, 0);
  const input = document.getElementById('answer');
  if (input) input.focus();
  if (state.screen === 'quiz' && !state.answered) startTimer();
  if (state.screen === 'teacher' && state.teacherOk) { renderLive(); if (!state.liveTimer) startLive(); } else stopLive();
}

// ---- 문제당 제한 시간 ----
function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }
function startTimer() {
  stopTimer();
  if (!TIME_LIMIT) return;
  state.qStart = Date.now();
  const tick = () => {
    const left = TIME_LIMIT - (Date.now() - state.qStart) / 1000;
    const bar = document.getElementById('tbar'), lab = document.getElementById('tleft');
    if (bar) { bar.style.width = Math.max(0, left / TIME_LIMIT * 100).toFixed(1) + '%'; bar.classList.toggle('warn', left <= 5); }
    if (lab) { lab.textContent = Math.max(0, Math.ceil(left)) + '초'; lab.classList.toggle('warn', left <= 5); }
    if (left <= 0) { stopTimer(); timeUp(); }
  };
  state.timer = setInterval(tick, 100);
  tick();
}
function timeUp() {
  if (state.answered || state.screen !== 'quiz') return;
  const q = state.quiz[state.idx];
  let ans = '';
  if (q.type === 'mc') {
    document.querySelectorAll('.choice').forEach((el, k) => { el.disabled = true; if (q.choices[k] === q.w.m) el.classList.add('ok'); });
  } else {
    const inp = document.getElementById('answer');
    if (inp) { ans = inp.value.trim(); inp.disabled = true; inp.classList.add('bad'); }
    const chk = document.getElementById('check'); if (chk) chk.hidden = true;
    if (q.type === 'blank') {
      const b = document.getElementById('blank');
      if (b) { b.textContent = ans || ' '; b.classList.add('filled', 'bad'); const c = document.createElement('span'); c.className = 'correct-form'; c.textContent = q.blank.form; b.after(c); }
    }
  }
  finish(q, ans, false, true);
}

// ---- 동작 ----
const actions = {
  pick(btn) { state.name = btn.dataset.name; state.tStatus = ''; state.tStatusBad = false; render(); const p = document.getElementById('pin'); if (p) p.focus(); },
  start() {
    const st = STUDENTS.find(x => x.name === state.name); if (!st) return;
    const pin = document.getElementById('pin');
    if (!pin || hashPin(st.name, pin.value.trim()) !== st.key) { state.tStatus = '비밀번호가 맞지 않아요.'; state.tStatusBad = true; render(); const p = document.getElementById('pin'); if (p) p.focus(); return; }
    state.tStatus = ''; state.tStatusBad = false;
    state.screen = 'study'; render(); return;
  },
  study(btn) { state.study = Number(btn.dataset.k); render(); },
  begin() {
    if (state.study === null) return;
    state.quiz = buildQuiz();
    if (!state.quiz.length) return;
    state.idx = 0; state.answered = false; state.results = [];
    state.startedAt = Date.now();
    state.liveKey = `live:${state.startedAt}-${Math.random().toString(36).slice(2, 8)}`;
    state.screen = 'quiz'; render();
    pushLive();
  },
  choose(btn) {
    if (state.answered) return;
    const q = state.quiz[state.idx];
    const ans = q.choices[Number(btn.dataset.k)];
    const ok = isCorrect(q, ans);
    document.querySelectorAll('.choice').forEach((el, k) => {
      el.disabled = true;
      if (q.choices[k] === q.w.m) el.classList.add('ok');
      else if (k === Number(btn.dataset.k)) el.classList.add('bad');
    });
    finish(q, ans, ok);
  },
  check() {
    if (state.answered) return;
    const q = state.quiz[state.idx];
    const inp = document.getElementById('answer');
    const ans = inp.value.trim();
    if (!ans) { inp.focus(); return; }
    const ok = isCorrect(q, ans);
    inp.disabled = true; inp.classList.add(ok ? 'ok' : 'bad');
    document.getElementById('check').hidden = true;
    if (q.type === 'blank') {
      const b = document.getElementById('blank');
      b.textContent = ans; b.classList.add('filled', ok ? 'ok' : 'bad');
      if (!ok) { const c = document.createElement('span'); c.className = 'correct-form'; c.textContent = q.blank.form; b.after(c); }
    }
    finish(q, ans, ok);
  },
  next() {
    if (!state.answered) return;
    stopTimer();
    state.idx += 1; state.answered = false;
    if (state.idx >= state.quiz.length) { state.screen = 'result'; state.endedAt = Date.now(); state.rec = resultRecord(); state.saved = null; state.shareShown = false; autoSave(); }
    render();
  },
  async share() {
    const text = shareText(state.rec || resultRecord());
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); state.tStatus = ''; alertCopied(); return; } catch (e) {}
    state.shareShown = true; render();
    const ta = document.getElementById('share-text'); if (ta) { ta.focus(); ta.select(); }
  },
  home() { state.screen = 'start'; state.name = ''; state.study = null; state.rec = null; state.tView = null; state.tStatus = ''; state.tStatusBad = false; render(); },
  teacher() { state.screen = 'teacher'; state.tStatus = ''; state.tStatusBad = false; render(); const p = document.getElementById('pin'); if (p) p.focus(); },
  async 'teacher-login'() {
    const pin = document.getElementById('pin');
    if (!pin || hashPin('선생님', pin.value.trim()) !== TEACHER_KEY) { state.tStatus = '확인 번호가 맞지 않습니다.'; state.tStatusBad = true; render(); return; }
    state.teacherOk = true; state.tStatus = ''; state.tStatusBad = false; render();
    if (hasStorage()) actions['load-shared']();
  },
  async 'load-shared'() {
    try {
      const list = await loadResultsShared();
      if (list === null) { state.tStatus = '자동 저장이 아직 연결되지 않았어요. 아래에 카톡으로 받은 결과를 붙여넣어 주세요.'; state.tStatusBad = true; }
      else { mergeResults(list); state.tStatus = `저장된 결과 ${list.length}건을 불러왔어요.`; state.tStatusBad = false; }
    } catch (e) { state.tStatus = '불러오지 못했어요. 로그인 상태인지 확인해 주세요.'; state.tStatusBad = true; }
    render();
  },
  'add-pasted'() {
    const ta = document.getElementById('paste');
    const list = decodeResults(ta ? ta.value : '');
    if (!list.length) { state.tStatus = '코드를 찾지 못했어요. WT1: 로 시작하는 부분이 들어 있는지 확인해 주세요.'; state.tStatusBad = true; render(); return; }
    const added = mergeResults(list);
    state.tStatus = `${added}건을 추가했어요.`; state.tStatusBad = false; render();
  },
  't-view'(btn) { state.tView = Number(btn.dataset.i); state.tStatus = ''; render(); },
  't-back'() { state.tView = null; render(); },
  async 'copy-comment'() {
    const el = document.getElementById('comment'); const text = el ? el.textContent : '';
    try { await navigator.clipboard.writeText(text); state.tStatus = '코멘트를 복사했어요. 카톡에 붙여넣으면 돼요.'; state.tStatusBad = false; }
    catch (e) { state.tStatus = '복사가 안 되는 화면이에요. 글을 길게 눌러 복사해 주세요.'; state.tStatusBad = true; }
    render();
  },
  'clear-list'() { state.tResults = []; state.tStatus = '목록을 비웠어요. (저장된 결과는 그대로 있어요)'; state.tStatusBad = false; render(); },
  async 'clear-shared'() {
    try { await clearResultsShared(); state.tResults = []; state.tStatus = '저장된 결과를 모두 지웠어요.'; state.tStatusBad = false; }
    catch (e) { state.tStatus = '지우지 못했어요.'; state.tStatusBad = true; }
    render();
  },
  async 'copy-table'() {
    const rows = ranking(state.tResults), per = TOTAL / UNIT_LIST.length;
    const head = ['순위', '이름', '점수', '정답률', ...UNIT_LIST.map(u => `Unit ${u}`), '소요 시간', '제출 시각', '말한 공부 시간', '학습량 추정', '틀린 단어'].join('\t');
    const body = rows.map(r => { const A = analyze(r.first); return [r.rank, r.name, `${r.first.s}/${r.first.T}`, `${Math.round(r.first.s / r.first.T * 100)}%`,
      ...UNIT_LIST.map(u => `${r.first.u[u] ?? '-'}/${per}`), fmtElapsed(r.first.e * 1000), fmtDate(new Date(r.first.t)), A.said ?? '-', A.tierName,
      r.first.w.map(([n]) => { const w = WORDS.find(x => x.n === n); return w ? showWord(w.w) : n; }).join(', ')].join('\t'); }).join('\n');
    try { await navigator.clipboard.writeText(head + '\n' + body); state.tStatus = '표를 복사했어요. 엑셀에 붙여넣으면 돼요.'; state.tStatusBad = false; }
    catch (e) { state.tStatus = '복사가 안 되는 화면이에요.'; state.tStatusBad = true; }
    render();
  },
};
function mergeResults(list) {
  let added = 0;
  list.forEach(r => { if (!state.tResults.some(x => x.t === r.t && x.n === r.n)) { state.tResults.push(r); added++; } });
  return added;
}
async function autoSave() {
  const rec = state.rec || resultRecord();
  try { state.saved = await saveResultShared(rec); } catch (e) { state.saved = false; }
  if (state.screen === 'result') render();
}
function alertCopied() { state.tStatus = ''; const el = document.querySelector('.note'); if (el) el.textContent = '복사됐어요. 카톡에 붙여넣어 선생님께 보내 주세요.'; }

function finish(q, ans, ok, timeout = false) {
  stopTimer();
  state.answered = true;
  const sec = timeout ? TIME_LIMIT : Math.min(TIME_LIMIT || 999, (Date.now() - state.qStart) / 1000);
  state.results.push({ q, ans, ok, timeout, sec });
  pushLive(state.results.length >= state.quiz.length);
  const fb = document.getElementById('feedback');
  let html = `<div class="row"><span class="fb ${ok ? 'ok' : 'bad'}">${timeout ? '시간 초과' : ok ? '정답' : '오답'}</span>`;
  if (!ok && q.type !== 'mc') {
    const shown = q.type === 'blank' && q.blank ? q.blank.form : showWord(q.w.w);
    const base = q.type === 'blank' && norm(shown) !== norm(showWord(q.w.w)) ? ` (${esc(showWord(q.w.w))})` : '';
    html += `<span class="fb-answer">정답 <span class="serif">${esc(shown)}</span>${base}</span>`;
  }
  html += `</div>`;
  if (q.type === 'blank') html += `<div class="fb-meaning">${esc(showWord(q.w.w))} — ${esc(q.w.m)}</div>`;
  fb.innerHTML = html; fb.hidden = false;
  const next = document.getElementById('next');
  next.hidden = false;
  if (q.type === 'mc') next.focus({ preventScroll: true });
}

app.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  const fn = actions[btn.dataset.action];
  if (fn) fn(btn);
});

app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'pin') { e.preventDefault(); state.screen === 'teacher' ? actions['teacher-login']() : actions.start(); return; }
  if (e.target.tagName === 'TEXTAREA') return;
  if (state.screen === 'quiz') { e.preventDefault(); state.answered ? actions.next() : (document.getElementById('answer') && actions.check()); }
});

render();
</script>
</body>
</html>
