 항상 다정한 말로 나를 격려해 주셨다."],["This steak is extremely [tender].","이 스테이크는 아주 연하다."]]},{"u":10,"n":299,"w":"casual","m":"1. 태평스러운; 무심한 2. 평상시의 3. 우연한; 평상복","ex":[["I’m worried because she has a [casual] attitude toward her studies.","나는 그녀가 공부에 무심한 태도를 갖고 있어서 걱정이다."],["Alice wears [casual] clothes on weekends.","Alice는 주말이면 평상복을 입는다."]]},{"u":10,"n":300,"w":"dependent","m":"1. 의존하는, 의지하는 2. (~에) 좌우되는","ex":[["Kids tend to be [dependent] on smartphones these days.","요즘 아이들이 스마트폰에 의존하는 경향이 있다."],["The cost of fruit is [dependent] on the weather.","과일의 가격은 날씨에 좌우된다."]]},{"u":11,"n":301,"w":"just","m":"1. 딱, 꼭 2. 막, 방금 3. 단지; 공정한","ex":[["This ring is [just] my size.","이 반지는 내게 딱 맞는 사이즈이다."],["I’ve [just] heard the news.","나는 그 소식을 방금 들었어."],["My brother learned how to swim [just] for his health.","내 남동생은 단지 자신의 건강을 위해 수영을 배웠다."],["The teacher made a [just] decision for every student.","그 선생님은 모든 학생에게 공정한 결정을 내리셨다."]]},{"u":11,"n":302,"w":"rather","m":"1. 상당히, 꽤 2. 오히려","ex":[["Jane looks [rather] like her mom.","Jane은 자신의 어머니를 상당히 닮았다."],["His laugh wasn’t bright, but [rather] gloomy.","그의 웃음은 밝다기보다는 오히려 음울했다."]]},{"u":11,"n":303,"w":"definitely","m":"분명히, 확실히","ex":[["She will [definitely] pass the exam.","그녀는 분명히 시험에 합격할 것이다."]]},{"u":11,"n":304,"w":"indeed","m":"1. 정말로, 확실히 2. 사실, 실은","ex":[["The old man looked angry [indeed].","그 노인은 정말로 화가 나 보였다."],["He didn’t object to our proposal. [Indeed], he gave it lots of support.","그는 우리의 제안에 반대하지 않았다. 사실, 그는 그 제안에 대해 많은 지지를 보냈다."]]},{"u":11,"n":305,"w":"overall","m":"전반적으로, 종합적으로; 전반적인, 종합적인","ex":[["In the survey, customers rated the food as good [overall].","설문 조사에서 고객들은 그 음식이 전반적으로 좋다고 평가했다."],["His [overall] grades were great.","그의 종합적인 성적은 훌륭했다."]]},{"u":11,"n":306,"w":"simply","m":"1. 그냥, 그저 (단순히) 2. 쉽게, 간단히 3. 간소하게","ex":[["The reason she didn’t come was [simply] because she needed sleep.","그녀가 오지 않은 이유는 그냥 더 자고 싶어서였다."],["He taught math as [simply] as possible.","그는 수학을 가능한 한 쉽게 가르쳤다."],["The rooms are [simply] decorated.","그 방들은 간소하게 장식되어 있다."]]},{"u":11,"n":307,"w":"merely","m":"단지, 그저","ex":[["I work to get a sense of achievement, not [merely] for money.","나는 단지 돈을 위해서가 아니라 성취감을 얻기 위해 일한다."]]},{"u":11,"n":308,"w":"extremely","m":"극도로, 몹시","ex":[["Food safety is an [extremely] important health matter.","식품 안전은 극도로 중요한 건강 문제이다."]]},{"u":11,"n":309,"w":"badly","m":"1. 서투르게; 나쁘게 2. 몹시, 대단히","ex":[["They spoke Spanish very [badly].","그들은 스페인어를 너무 서투르게 말했다."],["That car is [badly] in need of repair.","저 차는 수리가 몹시 필요하다."]]},{"u":11,"n":310,"w":"somehow","m":"1. 어떻게든 2. 왠지, 웬일인지","ex":[["We will finish the task [somehow].","우리는 어떻게든 그 과제를 끝낼 것이다."],["[Somehow], I feel tired today.","왠지 오늘은 피곤하다."]]},{"u":11,"n":311,"w":"somewhat","m":"다소, 약간","ex":[["This lecture can be [somewhat] challenging for beginners.","이 강의는 초보자에게는 다소 힘들 수 있다."]]},{"u":11,"n":312,"w":"altogether","m":"1. 완전히 2. 총, 모두 합쳐","ex":[["I didn’t [altogether] believe her story.","나는 그녀의 이야기를 완전히 믿지는 않았다."],["The cost for groceries was 68,000 won [altogether].","식료품의 비용은 총 68,000원이었다."]]},{"u":11,"n":313,"w":"highly","m":"1. 매우 2. (수준, 양 등이) 고도로, 많이","ex":[["He is a [highly] successful businessman.","그는 매우 성공한 사업가이다."],["a [highly] trained doctor","고도로 훈련받은 의사"]]},{"u":11,"n":314,"w":"increasingly","m":"점점 더, 갈수록 더","ex":[["Sea level has been [increasingly] rising in recent decades.","최근 수십 년간 해수면은 점점 더상승하고 있다."]]},{"u":11,"n":315,"w":"apparently","m":"보아하니, 듣자하니","ex":[["The man is [apparently] about fifty years of age.","그 남자는 보아하니 약 50세 정도이다."]]},{"u":11,"n":316,"w":"basically","m":"근본적으로, 기본적으로; 무엇보다도","ex":[["The film was [basically] about the violence of the war.","그 영화는 근본적으로 전쟁의 폭력에 대한 것이었다."],["[Basically], most of the critics complained about the film.","무엇보다도, 대부분의 비평가들은 그 영화에 대해 불평했다."]]},{"u":11,"n":317,"w":"necessarily","m":"필연적으로; 반드시","ex":[["Being lazy [necessarily] makes people unhappy.","게으른 것은 필연적으로 사람을 불행하게 만든다."],["Being rich does not [necessarily] mean being happy.","부유한 것이 반드시 행복한 것을 의미하지는 않는다."]]},{"u":11,"n":318,"w":"roughly","m":"1. 거칠게 2. 대략","ex":[["She threw her backpack [roughly] to the floor.","그녀는 자신의 배낭을 바닥으로 거칠게 던졌다."],["They all arrived at [roughly] 10 a.m.","그들 모두가 대략 오전 10시에 도착했다."]]},{"u":11,"n":319,"w":"luckily","m":"다행히, 운 좋게","ex":[["[Luckily], the train had not left yet.","다행히, 기차가 아직 떠나지 않았다."]]},{"u":11,"n":320,"w":"fortunately","m":"다행스럽게도, 운 좋게도","ex":[["[Fortunately] she wasn’t burned when she spilled the hot water.","그녀가 뜨거운 물을 엎질렀을 때 다행스럽게도 그녀는 화상을 입지 않았다."]]},{"u":11,"n":321,"w":"frankly","m":"솔직히, 솔직히 말하면","ex":[["His grandmother expressed her anger [frankly].","그의 할머니는 자신의 노여움을 솔직히 표현하셨다."]]},{"u":11,"n":322,"w":"nowadays","m":"요즈음에는, 오늘날에는","ex":[["Most teenagers prefer using smartphones to computers [nowadays].","대부분의 십 대들이 요즈음에는 컴퓨터보다 스마트폰을 사용하는 것을 선호한다."]]},{"u":11,"n":323,"w":"overnight","m":"1. 밤새 2. 하룻밤 사이에, 갑자기; 1. 야간의 2. 하룻밤 사이의","ex":[["He studied [overnight] for his science exam.","그는 과학 시험을 위해 밤새 공부했다."],["Don’t expect something to get done [overnight].","무엇이든 하룻밤 사이에 이루어지길 기대하지 마라."],["an [overnight] flight","야간 비행"]]},{"u":11,"n":324,"w":"throughout","m":"1. 두루, 도처에 2. ~ 내내, ~ 동안 죽","ex":[["She has traveled [throughout] Africa.","그녀는 아프리카를 두루 여행했다."],["[Throughout] this week, I focused on studying.","이번 주 내내 나는 공부에 집중했다."]]},{"u":11,"n":325,"w":"forth","m":"앞으로; (안에서) 밖으로","ex":[["His arms swung back and [forth] when he walked.","걸을 때 그의 팔이 앞뒤로 흔들렸다."]]},{"u":11,"n":326,"w":"aside","m":"1. 한쪽으로; 조금 떨어져 2. (나중에 쓰려고) 따로","ex":[["Students stepped [aside] so the teacher could pass.","선생님이 지나가실 수 있도록 학생들은 한쪽으로 비켜섰다."],["I put some money [aside] for my trip.","나는 여행을 위해 약간의 돈을 따로 떼어 두었다."]]},{"u":11,"n":327,"w":"upstairs","m":"위층으로, 위층에서; 위층","ex":[["He went [upstairs] to take a nap.","그는 낮잠을 자기 위해 위층으로 올라갔다."]]},{"u":11,"n":328,"w":"underneath","m":"(특히 가려져) ~의 아래에; 아래에","ex":[["He hid the gift for his child [underneath] the bed.","그는 자신의 아이를 위한 선물을 침대 아래에 숨겼다."]]},{"u":11,"n":329,"w":"downward (s)","m":"아래쪽으로, 아래를 향하여; 하향의","ex":[["Water always flows [downwards].","물은 항상 아래쪽으로 흐른다."]]},{"u":11,"n":330,"w":"nationwide","m":"전국적으로; 전국적인","ex":[["The number of students has been decreasing [nationwide].","학생들의 수가 전국적으로 감소하고 있다."],["The incident got [nationwide] attention immediately.","그 사건은 즉시 전국적인 관심을 얻었다."]]},{"u":12,"n":331,"w":"besides","m":"게다가, 뿐만 아니라; ~ 외에","ex":[["The concert was great. [Besides], the tickets didn’t cost much.","그 공연은 훌륭했다. 게다가, 입장권은 가격이 비싸지 않았다."],["[Besides] reading, I also enjoy outdoor sports.","책을 읽는 것 외에, 나는 야외 스포츠도 즐긴다."]]},{"u":12,"n":332,"w":"furthermore","m":"뿐만 아니라, 더욱이","ex":[["He is a singer. [Furthermore], he is an actor.","그는 가수이다. 뿐만 아니라, 배우이기도 하다."]]},{"u":12,"n":333,"w":"additionally","m":"게다가","ex":[["He ate healthy food. [Additionally], he exercised every day.","그는 건강에 좋은 음식을 섭취했다. 게다가, 그는 매일 운동했다."]]},{"u":12,"n":334,"w":"likewise","m":"똑같이, 마찬가지로","ex":[["The sky is gray; the surface of the lake [likewise].","하늘이 회색빛이고 호수의 수면도 똑같이 회색빛이다."]]},{"u":12,"n":335,"w":"meanwhile","m":"1. 그 동안에, 그 사이에 2. 한편","ex":[["Peel the potatoes. [Meanwhile], I’ll boil the water.","감자 껍질을 벗겨. 그 동안에 나는 물을 끓일게."],["Stress can damage your health. Exercise, [meanwhile], can reduce the effects of stress.","스트레스는 건강에 해를 입힐 수 있다. 한편, 운동은 스트레스의 영향을 줄일 수 있다."]]},{"u":12,"n":336,"w":"accordingly","m":"그에 따라서, 그래서","ex":[["You broke the rules and will be punished [accordingly].","너는 규칙을 어겼고 그에 따라서 처벌을 받을 것이다."]]},{"u":12,"n":337,"w":"despite","m":"~에도 불구하고","ex":[["[Despite] the bad weather, many people came to watch the game.","궂은 날씨에도 불구하고, 많은 사람들이 그 경기를 보러 왔다."]]},{"u":12,"n":338,"w":"except","m":"~을 제외하고는, ~ 외에는","ex":[["The store will be open every day [except] Sundays.","그 가게는 일요일를 제외하고는 매일 문을 열 것이다."]]},{"u":12,"n":339,"w":"per","m":"~당, ~마다","ex":[["The tickets are $25[per] person.","티켓은 1인당 25달러이다."]]},{"u":12,"n":340,"w":"unlike","m":"~와 달리; ~와 다른; 다른, 같지 않은","ex":[["[Unlike] most birds, penguins cannot fly.","대부분의 새들과 달리, 펭귄은 날지 못한다."]]},{"u":12,"n":341,"w":"regardless of","m":"~에 상관없이, ~에 구애받지 않고","ex":[["Our club welcomes all new members [regardless of] age.","우리 동호회는 나이에 상관없이 모든 신입 회원을 환영합니다."]]},{"u":12,"n":342,"w":"according to","m":"1. ~에 따르면 2. ~에 따라","ex":[["[According to] the news, a huge storm is coming this week.","뉴스에 따르면, 거대한 폭풍이 이번 주에 올 것이다."],["The project is going [according to] plan.","프로젝트는 계획에 따라 진행되고 있다."]]},{"u":12,"n":343,"w":"owing to","m":"~ 때문에","ex":[["I could not catch a word of the speech [owing to] the noise.","나는 소음 때문에 연설을 한마디도 들을 수 없었다."]]},{"u":12,"n":344,"w":"thanks to","m":"~ 덕분에","ex":[["[Thanks to] your careful nursing, I got better quickly.","너의 극진한 간호 덕분에, 나는 빨리 나았다."]]},{"u":12,"n":345,"w":"nevertheless","m":"그럼에도 불구하고","ex":[["My grandparents’ house was old but [nevertheless] clean.","나의 조부모님 댁은 오래되었지만 그럼에도 불구하고 깨끗했다."]]},{"u":12,"n":346,"w":"otherwise","m":"1. 그렇지 않으면 2. 그 외에는 3. 다르게, 달리","ex":[["Wake up, [otherwise] you will be late for school.","일어나, 그렇지 않으면 너는 학교에 늦을 거야."],["I was tired but [otherwise] fine.","나는 피곤했지만 그 외에는 괜찮았다."],["He claims to be innocent, but the evidence suggests [otherwise].","그는 결백하다고 주장하지만, 증거는 (그의 주장과) 다르게 시사한다."]]},{"u":12,"n":347,"w":"whereas","m":"반면에, 그러나","ex":[["[Whereas] knowledge can be learned from books, skills must be learned through practice.","반면에 지식은 책으로부터 습득될 수 있는, 기술은 반드시 연습을 통해 습득되어야 한다."]]},{"u":12,"n":348,"w":"nonetheless","m":"그럼에도 불구하고","ex":[["The movie was too long but, [nonetheless], very interesting.","그 영화는 꽤 길었지만, 그럼에도 불구하고, 굉장히 흥미로웠다."]]},{"u":12,"n":349,"w":"thus","m":"그러므로, 따라서","ex":[["She failed the exam. [Thus], she has to take it again.","그녀는 시험에서 떨어졌다. 그러므로 그녀는 그 시험을 다시 치러야 한다."]]},{"u":12,"n":350,"w":"now that","m":"~이므로, ~이기 때문에","ex":[["[Now that] you’ve turned 20, you have become an adult.","스무 살이 되었으므로, 너는 성인이다."]]},{"u":12,"n":351,"w":"beyond","m":"1. ~ 너머 2. ~ 이상 3. (능력, 한계 등을) 넘어서는; 1. 건너편에 2. 그 이후에","ex":[["My school is just [beyond] the bridge.","우리 학교는 바로 저 다리 너머에 있다."],["[beyond] expectations","기대 이상"],["The job is [beyond] his ability.","그 일은 그의 능력을 넘어선다."]]},{"u":12,"n":352,"w":"beneath","m":"1. 밑에, 아래에 2. (수준 등이) ~보다 못한[낮은]; 바로 밑에, 아래쪽에","ex":[["A letter was hidden [beneath] a pile of books.","편지 한 통이 책 더미 밑에 숨겨져 있었다."],["He didn’t take the job because he thought it was [beneath] him.","그는 그 일이 자신의 수준보다 낮다고 생각해서 그 일을 맡지 않았다."]]},{"u":12,"n":353,"w":"till","m":"~까지","ex":[["The restaurant is open [till] 10 p.m.","그 식당은 오후 10시까지 영업한다."]]},{"u":12,"n":354,"w":"afterward (s)","m":"(그) 후에, 나중에","ex":[["Let’s go to see a movie and have dinner [afterward].","우리 영화 보러 가자, 그리고 그 후에 저녁을 먹자."]]},{"u":12,"n":355,"w":"thereafter","m":"그 후에, 그 이래로","ex":[["They had a serious fight; [thereafter], they stopped seeing each other.","그들은 심하게 다퉜다. 그 후에, 그들은 서로 더 이상 만나지 않았다."]]},{"u":12,"n":356,"w":"hardly","m":"거의 ~ 않는","ex":[["After running the marathon, she could [hardly] speak.","마라톤을 한 후, 그녀는 거의, 없었다 말을 할 수."]]},{"u":12,"n":357,"w":"barely","m":"거의 ~ 않는; 겨우, 간신히","ex":[["I could [barely] hear her whisper.","나는 그녀의 속삭임을 거의, 못했다 듣지."]]},{"u":12,"n":358,"w":"scarcely","m":"거의 ~ 않는; 겨우, 간신히","ex":[["There was [scarcely] any rain last month.","지난달에는 비가 거의, 않았다 오지."]]},{"u":12,"n":359,"w":"rarely","m":"좀처럼 ~ 않는; 드물게","ex":[["The actress is [rarely] seen on TV these days.","그 여배우는 요즈음 TV에 좀처럼, 않는다 보이지."]]},{"u":12,"n":360,"w":"seldom","m":"좀처럼 ~ 않는","ex":[["I [seldom] read books on the weekend.","나는 주말에 좀처럼, 않는다 책을 읽지."]]},{"u":13,"n":361,"w":"sensible","m":"분별력 있는, 현명한","ex":[["It wasn’t [sensible] to go out alone so late at night.","너무 늦은 저녁에 혼자 밖에 나간 것은 현명하지 않았다."]]},{"u":13,"n":362,"w":"sensitive","m":"1. 민감한, 예민한 2. 섬세한, 세심한","ex":[["Children are often very [sensitive] to their parent’s emotions.","아이들은 보통 부모의 감정에 매우 민감하다."],["This work needs [sensitive] and skillful handling.","이 작업은 섬세하고 능숙한 조작이 필요하다."]]},{"u":13,"n":363,"w":"sensory","m":"감각(상)의, 지각의","ex":[["The brain receives [sensory] information such as touch and pain.","뇌는 촉각과 통증 같은 감각 정보를 받는다."]]},{"u":13,"n":364,"w":"historical","m":"역사(상)의, 역사와 관련된","ex":[["This novel is based on [historical] facts.","이 소설은 역사상의 사실들을 토대로 한다."]]},{"u":13,"n":365,"w":"historic","m":"역사적으로 중요한, 역사에 남을 만한","ex":[["Many [historic] buildings were destroyed by this earthquake.","많은 역사적으로 중요한 건물들이 이번 지진으로 파괴되었다."]]},{"u":13,"n":366,"w":"successful","m":"성공한, 성공적인","ex":[["He was a [successful] businessman before becoming a writer.","그는 작가가 되기 전에는 성공한 사업가였다."]]},{"u":13,"n":367,"w":"successive","m":"연속적인, 잇따른","ex":[["The team has had five [successive] victories this season.","그 팀은 이번 시즌에서 다섯 번의 연속적인 승리를 거두었다."]]},{"u":13,"n":368,"w":"considerate","m":"사려 깊은, 이해심이 있는","ex":[["Danny is [considerate], and he doesn’t mind helping others.","Danny는 사려 깊고 다른 사람들을 돕는 일을 마다하지 않는다."]]},{"u":13,"n":369,"w":"considerable","m":"상당한, 많은","ex":[["A [considerable] amount of time and effort has gone into this exhibition.","이 전시회에 상당한 양의 시간과 노력이 들었다."]]},{"u":13,"n":370,"w":"memorial","m":"기념의, 추모의; 기념비, 기념물","ex":[["A [memorial] service will be held this Saturday.","추모 행사가 이번 토요일에 열릴 것이다."],["A [memorial] for victims of the war will be installed.","그 전쟁의 희생자들을 위한 기념비가 세워질 것이다."]]},{"u":13,"n":371,"w":"memorable","m":"기억할 만한, 인상적인","ex":[["The musical was [memorable] for its beautiful costumes.","그 뮤지컬은 아름다운 의상들 때문에 인상적이었다."]]},{"u":13,"n":372,"w":"industrial","m":"산업의, 공업의","ex":[["Plastic has a wide range of [industrial] uses.","플라스틱은 광범위한 공업의 용도를 가지고 있다."]]},{"u":13,"n":373,"w":"industrious","m":"부지런한, 근면한","ex":[["Bees and ants are [industrious] workers.","벌과 개미는 부지런한 일꾼들이다."]]},{"u":13,"n":374,"w":"comparable","m":"비슷한, 비교할 만한","ex":[["My test scores are [comparable] to the class average.","내 시험 점수는 학급 평균과 비슷하다."]]},{"u":13,"n":375,"w":"comparative","m":"비교를 통한, 비교의; 상대적인","ex":[["I’m doing a [comparative] study of classical and modern art.","나는 고전 예술과 현대 예술의 비교 연구를 하고 있다."]]},{"u":13,"n":376,"w":"imaginary","m":"가상의, 상상에만 존재하는","ex":[["The unicorn is an [imaginary] creature.","유니콘은 가상의 동물이다."]]},{"u":13,"n":377,"w":"imaginative","m":"상상력이 풍부한; 창의적인","ex":[["A poem can be described as a “short piece of [imaginative] writing.”","시는 ‘창의적인 짧은 글’이라고 묘사된다."]]},{"u":13,"n":378,"w":"imaginable","m":"상상할 수 있는","ex":[["The store is full of ice cream of every [imaginable] flavor.","그 가게는 상상할 수 있는 모든 맛의 아이스크림으로 가득하다."]]},{"u":13,"n":379,"w":"respectable","m":"존경할 만한, 훌륭한","ex":[["Lucas was the son of poor but [respectable] parents.","Lucas는 가난하지만 훌륭한 부모님의 아들이었다."]]},{"u":13,"n":380,"w":"respectful","m":"공손한, 존경심을 보이는, 경의를 표하는","ex":[["Children should be [respectful] to their elders.","아이들은 어른들에게 공손해야 한다."]]},{"u":13,"n":381,"w":"literal","m":"(의미 등이) 글자 그대로의; 직역의","ex":[["The [literal] meaning of Renaissance is “rebirth.”","르네상스의 글자 그대로의 의미는 ‘부활’이다."]]},{"u":13,"n":382,"w":"literate","m":"읽고 쓸 줄 아는; 교양 있는","ex":[["Before Hangeul was created, there were not many [literate] people.","한글이 만들어지기 이전에는 읽고 쓸 줄 아는 사람들이 많지 않았다."]]},{"u":13,"n":383,"w":"literary","m":"문학의, 문학적인","ex":[["Fantasy fiction is one of many [literary] forms.","공상 소설은 많은 문학의 종류 중 하나이다."]]},{"u":13,"n":384,"w":"social","m":"1. 사회의, 사회적인 2. 사교의, 사교와 관련된","ex":[["Poverty is a serious [social] problem.","빈곤은 심각한 사회 문제이다."],["I joined the [social] club to make friends.","나는 친구들을 사귀기 위해 사교 모임에 가입했다."]]},{"u":13,"n":385,"w":"sociable","m":"사교적인, 붙임성 있는","ex":[["Anna is a very active and [sociable] child.","Anna는 매우 활동적이고 사교적인 아이다."]]},{"u":13,"n":386,"w":"childish","m":"유치한, 어린애 같은","ex":[["Getting angry when something doesn’t please you is [childish].","무언가 네 마음에 안 들 때 화를 내는 것은 유치하다."]]},{"u":13,"n":387,"w":"childlike","m":"순진한, 천진한, 어린아이다운","ex":[["All my friends have a [childlike] innocence.","내 친구들은 모두 순진한 천진난만함을 가지고 있다."]]},{"u":13,"n":388,"w":"intelligent","m":"똑똑한, 총명한; 지능적인","ex":[["Dogs are highly [intelligent] animals.","개는 매우 똑똑한 동물이다."]]},{"u":13,"n":389,"w":"intelligible","m":"(쉽게) 이해할 수 있는, 명료한","ex":[["The play was remade to be more [intelligible] to modern audiences.","그 연극은 현대 관객들이 더 쉽게 이해할 수 있도록 다시 만들어졌다."]]},{"u":13,"n":390,"w":"intellectual","m":"지적인, 지성의; 지식인","ex":[["Physical activities are helpful for children’s [intellectual] development.","신체 활동은 아이들의 지적 발달에 도움이 된다."]]},{"u":14,"n":391,"w":"collect","m":"수집하다, 모으다","ex":[["My grandfather [collects] old cameras as a hobby.","우리 할아버지는 취미로 오래된 카메라를 수집하신다."]]},{"u":14,"n":392,"w":"collective","m":"공동의; 집단의, 단체의","ex":[["Creating a just society is a [collective] responsibility.","공정한 사회를 만드는 것은 공동의 책임이다."]]},{"u":14,"n":393,"w":"desire","m":"바라다, 원하다; 욕구, 갈망","ex":[["I [desire] to learn a new language.","나는 새로운 언어를 배우기를 원한다."],["She had no [desire] to go out in the cold weather.","그녀는 추운 날씨에 외출하고 싶은 욕구가 전혀 없었다."]]},{"u":14,"n":394,"w":"desirable","m":"바람직한, 호감 가는","ex":[["It’s [desirable] to help one another in times of need.","어려울 때일수록 서로 돕는 것이 바람직하다."]]},{"u":14,"n":395,"w":"subject","m":"1. 주제; 소재 2. 과목 3. 실험 대상","ex":[["I read books on many different [subjects] to expand my knowledge.","나는 지식을 넓히기 위해 다양한 주제의 책들을 읽는다."],["My favorite [subject] is science.","내가 가장 좋아하는 과목은 과학이다."],["The researchers asked their [subjects] to remember 100 images.","연구원들은 실험 대상들에게 100개의 이미지를 기억할 것을 요청했다."]]},{"u":14,"n":396,"w":"subjective","m":"주관적인; 개인의, 개인적인","ex":[["Everyone’s opinions tend to be [subjective].","모든 사람의 의견은 주관적인 경향이 있다."]]},{"u":14,"n":397,"w":"respect","m":"1. 존경[존중]하다 2. (법률 등을) 준수하다; 1. 존경, 존중 2. 측면","ex":[["Learn to accept and [respect] other cultures.","다른 문화를 받아들이고 존중하는 것을 배워라."],["She always [respects] the school rules.","그녀는 항상 교칙을 준수한다."],["In all [respects] he’s very smart.","모든 측면에서 그는 매우 똑똑하다."]]},{"u":14,"n":398,"w":"respective","m":"각자의, 각각의","ex":[["Everyone returned to their [respective] homes.","모든 사람들은 각자의 집으로 돌아갔다."]]},{"u":14,"n":399,"w":"comprehend","m":"이해하다","ex":[["He didn’t fully [comprehend] what his teacher had said.","그는 선생님이 말씀하신 것을 완전히 이해하지 못했다."]]},{"u":14,"n":400,"w":"comprehensive","m":"포괄적인, 종합적인","ex":[["The researchers conducted a [comprehensive] study of wild animals.","그 연구원들은 야생 동물에 대한 종합적인 연구를 수행했다."]]},{"u":14,"n":401,"w":"occupy","m":"1. 차지하다; 점령하다 2. (건물, 방 등을) 사용하다, 거주하다","ex":[["His books [occupy] most of his room.","그의 책들이 방의 대부분을 차지한다."],["We [occupy] an office on the fifth floor.","우리는 5층에 있는 사무실을 사용한다."]]},{"u":14,"n":402,"w":"occupation","m":"1. 직업, 직무 2. (건물 등의) 거주, 사용; 점령","ex":[["Her [occupation] is selling shoes.","그녀의 직업은 신발 판매직이다."],["The building under construction will be ready for [occupation] by next month.","건설 중인 그 건물은 다음 달까지 사용을 위한 준비가 될 것이다."]]},{"u":14,"n":403,"w":"compete","m":"경쟁하다, 겨루다; (시합, 경기 등에) 참가하다","ex":[["The rookie will [compete] with the world champion in the semifinal.","그 신인 선수는 준결승에서 세계 챔피언과 겨룰 것이다."],["32teams will [compete] in the World Cup.","32개 팀이 월드컵에 참가할것이다."]]},{"u":14,"n":404,"w":"competent","m":"능숙한, 유능한","ex":[["We need a [competent] mechanic to fix the problem.","우리는 그 문제를 해결하기 위해서 유능한 정비사가 필요하다."]]},{"u":14,"n":405,"w":"intent","m":"의도, 목적; 몰두하는, 열중하는; 강한 관심[흥미]을 보이는","ex":[["My aunt bought a car with the [intent] to commute.","우리 이모는 통근할 목적으로 차를 사셨다."],["I was so [intent] on reading the novel that I didn’t notice the time.","나는 소설을 읽는 데 너무 몰두해서 시간 가는 줄도 몰랐다."]]},{"u":14,"n":406,"w":"complete","m":"완전한, 완벽한; 완료하다, 끝마치다","ex":[["Transferring to another school can be a [complete] change for children.","다른 학교로 전학 가는 것은 아이들에게 완전한 변화일 수 있다."],["She [completed] the whole course to get a driver’s license.","그녀는 운전면허를 따기 위한 전 과정을 완료했다."]]},{"u":14,"n":407,"w":"minute","m":"(시간 단위의) 분(分); 순간; 1. 미세한, 극히 작은 2. 대단히 상세한, 철저한","ex":[["We spent twenty [minutes] making dinner.","우리는 저녁을 준비하는 데 20분이 걸렸다."],["[Minute] differences can lead to a totally different result.","미세한 차이들이 완전히 다른 결과로 이어질 수 있다."],["My grandmother remembered everything about the war in [minute] detail.","우리 할머니는 그 전쟁에 관한 모든 것을 대단히 상세한 사항까지 기억하셨다."]]},{"u":14,"n":408,"w":"objective","m":"목적, 목표; 객관적인","ex":[["You can achieve your [objectives] if you make specific plans.","만약 구체적인 계획을 세운다면 너는 너의 목표들을 이룰 수 있다."],["Scientists must be [objective] in their studies.","과학자들은 자신의 연구에 있어서 객관적이어야한다."]]},{"u":14,"n":409,"w":"store","m":"가게, 상점; 보관하다, 저장하다","ex":[["She went to the grocery [store] to buy some eggs.","그녀는 달걀을 좀 사러 식료품 가게에 갔다."],["Potatoes should be [stored] at room temperature.","감자는 실온에서 보관되어야 한다."]]},{"u":14,"n":410,"w":"long","m":"긴; 오랜; 간절히 바라다","ex":[["a [long]-sleeved shirt","긴 소매의 셔츠"],["Rachel [longed] for a chance to become a singer.","Rachel은 가수가 될 기회를 간절히 바랐다."]]},{"u":14,"n":411,"w":"near","m":"가까운; 가까이; ~ 가까이에","ex":[["Where is the [nearest] convenience store?","가장 가까운 편의점은 어디입니까?"],["She told her son not to go [near] the water.","그녀는 아들에게 물 가까이에 가지 말라고 말했다."]]},{"u":14,"n":412,"w":"nearly","m":"거의; 하마터면","ex":[["It’s been [nearly] three months since my last haircut.","지난번에 이발한 후로 거의 세 달이 되었다."]]},{"u":14,"n":413,"w":"late","m":"늦은; 늦게","ex":[["We apologize for the [late] arrival of this flight.","본 항공기의늦은 도착[연착]에 대해 사과드립니다."],["David stayed up [late] last night to do his homework.","David는 숙제를 하기 위해 어젯밤에 늦게까지 깨어 있었다."]]},{"u":14,"n":414,"w":"lately","m":"최근에, 요즈음","ex":[["She’s developed strange habits [lately] that she didn’t have before.","그녀는 예전에 없던 이상한 습관들이 최근에 들었다."]]},{"u":14,"n":415,"w":"close","m":"가까운; 닫다","ex":[["Lia’s new house is very [close] to mine.","Lia의 새집은 내 집과 아주 가깝다."],["Please [close] the door and have a seat.","문을 닫고 자리에 앉으세요."]]},{"u":14,"n":416,"w":"closely","m":"1. 밀접하게 2. 면밀히, 엄중히","ex":[["Human life and climate are [closely] related.","인간의 삶과 기후는 밀접하게 관련되어 있다."],["Air pollution levels are being [closely] monitored.","대기 오염도는 면밀히 관찰되고 있다."]]},{"u":14,"n":417,"w":"deep","m":"(거리상) 깊은; 깊게","ex":[["The submarine will explore the [deep] sea.","그 잠수함은 깊은 바다를 탐사할 것이다."]]},{"u":14,"n":418,"w":"deeply","m":"매우; (정도가) 깊게","ex":[["I was [deeply] shocked to hear about the accident.","나는 그 사고에 대해 듣고서 매우 충격을 받았다."]]},{"u":14,"n":419,"w":"name","m":"이름; 이름을 지어주다","ex":[["May I have your [name] and address, please?","이름과 주소를 알려 주시겠습니까?"],["The Eiffel Tower is [named] after the engineer Gustav Eiffel.","에펠탑은 기술자 Gustav Eiffel의 이름을 따서 이름이 지어졌다."]]},{"u":14,"n":420,"w":"namely","m":"즉, 다시 말해","ex":[["Two students, [namely] Jay and Sally, were absent today.","두 명의 학생들, 즉 Jay와 Sally가 오늘 결석했다."]]},{"u":15,"n":421,"w":"detective","m":"탐정; 형사","ex":[["Sherlock Holmes was a capable [detective].","Sherlock Holmes는 유능한 탐정이었다."]]},{"u":15,"n":422,"w":"mystery","m":"(알 수 없는) 미스터리, 수수께끼; 신비, 불가사의","ex":[["He solved many [mysteries] that involved crimes.","그는 범죄와 관련된 많은 미스터리를 해결했다."]]},{"u":15,"n":423,"w":"incident","m":"(특히 좋지 않은) 사건, 일","ex":[["One day, a mysterious [incident] occurred at a party.","어느 날, 한 파티에서 불가사의한 사건이 일어났다."]]},{"u":15,"n":424,"w":"theft","m":"절도(죄), 도둑질","ex":[["A diamond [theft] occurred.","다이아몬드 절도가 발생했다."]]},{"u":15,"n":425,"w":"burglar","m":"(주거 침입) 절도범, 강도","ex":[["People thought a [burglar] hadbroken in and stolen the diamond.","사람들은 절도범이 침입하여 그 다이아몬드를 훔쳤다고 생각했다."]]},{"u":15,"n":426,"w":"clue","m":"단서, 실마리","ex":[["He started to search for [clues].","그는 단서를 찾기 시작했다."]]},{"u":15,"n":427,"w":"suspect","m":"1. 의심하다 2. ~이 아닌가 하고 생각하다; 용의자","ex":[["He [suspected] a waiter was the thief.","그는 웨이터가 도둑이라고 의심했다."],["I [suspect] that we will have snow before tomorrow.","나는 내일이 되기 전에 눈이 오는 것이 아닌가 하고 생각한다."]]},{"u":15,"n":428,"w":"suspicion","m":"혐의; 의심, 의혹","ex":[["There was a [suspicion] that the waiter had stolen the diamond.","그 웨이터가 다이아몬드를 훔쳤다는 혐의가 있었다."]]},{"u":15,"n":429,"w":"scan","m":"1. 유심히 살피다 2. (빠르게) 대충 훑어보다","ex":[["Holmes [scanned] the waiter’s room, looking for a clue.","Holmes는 단서를 찾으면서 웨이터의 방을 유심히 살폈다."],["He quickly [scanned] through the newspaper.","그는 빠르게 신문을 대충 훑어보았다."]]},{"u":15,"n":430,"w":"proof","m":"증거(물); (~에) 견딜 수 있는 ((방수, 방염 등의 처리가 된))","ex":[["Finally, Holmes found [proof] of the waiter’s crime.","마침내, Holmes는 그 웨이터의 범죄에 대한 증거를 찾았다."],["a water-[proof] coat","방수 코트"]]},{"u":15,"n":431,"w":"certain","m":"확신하는; 확실한","ex":[["Holmes was [certain] that the waiter was the thief.","Holmes는 웨이터가 도둑이 ime.","그 도둑은 자신의 범행에 대해 죄책감을 느꼈다."],["The jury found him [guilty].","배심원단은 그에게 유죄 판결을 내렸다."]]},{"u":15,"n":444,"w":"admit","m":"1. 인정하다, 시인하다 2. 입장[입학]을 허가하다","ex":[["The waiter [admitted] his guilt.","그 웨이터는 자신의 죄를 인정했다."],["This ticket [admits] two people.","이 표는 두 명의 입장을 허가한다."]]},{"u":15,"n":445,"w":"fake","m":"모조품, 위조품; 가짜의, 위조의","ex":[["Surprisingly, the diamond turned out to be [fake].","놀랍게도 그 다이아몬드는 모조품으로 드러났다."],["We should learn how to identify [fake] news on social media.","우리는 소셜 미디어 내의 가짜 뉴스를 구별하는 방법을 배워야 한다."]]},{"u":15,"n":446,"w":"address","m":"1. 주소 2. 연설; 1. 연설하다 2. (문제를) 다루다, 처리하다","ex":[["Please write your e-mail [address] here.","여기에 귀하의 이메일 주소를 적어 주십시오."],["The president [addressed] the country about the environment.","대통령은 국민에게 환경에 대해 연설했다."],["The article [addresses] the problem of illegal immigration.","그 기사는 불법 이민 문제를 다룬다."]]},{"u":15,"n":447,"w":"counter","m":"1. 계산대; 판매대 2. 반박; 반박하다; 반대로, 반대 방향으로","ex":[["People were waiting for their turn in front of the [counter].","사람들이 계산대 앞에서 자신의 차례를 기다리고 있었다."],["His argument was so reasonable that it was difficult to [counter].","그의 주장이 너무 합리적이라 반박하기 어려웠다."],["We think the new policy runs [counter] to common sense.","우리는 그 새로운 정책이 상식에 반대 방향으로 간다고 생각한다."]]},{"u":15,"n":448,"w":"fair","m":"1. 공평한, 공정한 2. 상당한; 박람회","ex":[["Teachers should be [fair] with all students.","교사는 모든 학생에게 공평해야 한다."],["I have a [fair] amount of homework to do today.","상당한 나는 오늘 해야 할 양의 숙제가 있다."],["There was a book [fair] last Sunday.","지난 일요일에 도서 박람회가 있었다."]]},{"u":15,"n":449,"w":"sentence","m":"1. 문장 2. 선고, 판결; 선고하다, 판결하다","ex":[["This paragraph consists of five [sentences].","이 단락은 다섯 개의 문장으로 구성되어 있다."],["The judge [sentenced] him to three years in prison.","판사가 그에게 3년의 징역형을 신고했다."]]},{"u":15,"n":450,"w":"ticket","m":"1. 표, 입장권 2. (교통법규 위반) 딱지; 1. 표를 발행하다 2. (교통법규 위반) 딱지를 발부하다","ex":[["Since you bought the movie [tickets], I’ll buy popcorn.","네가 영화표를 샀으니, 내가 팝콘을 살게."],["My dad got a [ticket] for speeding.","우리 아빠가 속도위반으로 딱지를 받으셨다."]]},{"u":16,"n":451,"w":"daylight","m":"햇빛, 일광","ex":[["The little boy would play under the tree until the [daylight] disappeared.","어린 소년은 햇빛이 사라질 때까지 나무 아래에서 놀곤 했다."]]},{"u":16,"n":452,"w":"sunset","m":"일몰, 해 질 녘","ex":[["The boy left the tree before [sunset].","소년은 일몰 전에 나무를 떠났다."]]},{"u":16,"n":453,"w":"innocent","m":"1. 순진한, 천진난만한 2. 무죄인, 결백한","ex":[["At that time, the boy was so young and [innocent].","그 당시에 소년은 무척 어리고 순진했다."],["Nobody in the court believed that he was [innocent].","법정에 있는 누구도 그가 무죄라고 믿지 않았다."]]},{"u":16,"n":454,"w":"pure","m":"순수한; 불순물이 없는; 깨끗한","ex":[["Their friendship was [pure].","그들의 우정은 순수했다."],["[pure] gold","순 금"]]},{"u":16,"n":455,"w":"progress","m":"1. (시간이) 지나다 2. 진행하다; 진보하다; 진행; 진보","ex":[["As time [progressed], their friendship became stronger.","시간이 지남에 따라, 그들의 우정은 더 강해졌다."],["She wrote about all the [progress] in her experiment.","그녀는 자신의 실험에서의 모든 진행에 대해 기록했다."]]},{"u":16,"n":456,"w":"arise","m":"(문제가) 발생하다, 일어나다","ex":[["However, problems [arose] as the boy grew.","그러나 소년이 자라면서 문제들이 발생했다."]]},{"u":16,"n":457,"w":"afford","m":"(금전적, 시간적) 여유가 있다, 형편이 되다","ex":[["The boy wanted to get many things, but he couldn’t [afford] them.","소년은 많은 것을 가지고 싶어 했지만, 그것들을 가질 수 있는 형편이 되지 않았다."]]},{"u":16,"n":458,"w":"sigh","m":"한숨을 쉬다; 한숨을 쉬며 말하다; 한숨","ex":[["He went to the tree and [sighed].","그는 나무에게로 가서 한숨을 쉬었다."]]},{"u":16,"n":459,"w":"startle","m":"깜짝 놀라게 하다","ex":[["The tree was [startled] to see his sad face.","나무는 그의 슬픈 얼굴을 보고 깜짝 놀랐다."]]},{"u":16,"n":460,"w":"inquire / enquire","m":"1. 묻다, 질문을 하다 2. 조사하다","ex":[["“Is something wrong?” the tree [inquired].","“뭔가 잘못됐니?” 나무가 물었다."],["The detective [inquired] about the murder.","탐정은 그 살인 사건에 대해 조사했다."]]},{"u":16,"n":461,"w":"request","m":"요청하다, 신청하다; 요청, 신청","ex":[["The boy [requested] money from the tree.","소년은 나무에게 돈을 요청했다."],["I rejected their [request] for an interview.","나는 그들의 인터뷰 요청을 거절했다."]]},{"u":16,"n":462,"w":"financial","m":"재정(상)의; 금융(상)의","ex":[["The tree could meet the boy’s [financial] needs by giving him its fruit.","나무는 자신의 과일을 내줌으로써 소년의 재정의 요구를 충족시킬 수 있었다."]]},{"u":16,"n":463,"w":"adulthood","m":"성인(임), 성년","ex":[["The boy visited the tree again in [adulthood].","소년은 성인이 되어 나무를 다시 찾아왔다."]]},{"u":16,"n":464,"w":"pressure","m":"1. 압박(감), 압력 2. ((물리)) 압축, 압력; 기압; 압력을 가하다; (~하도록) 강요하다","ex":[["The boy felt [pressure] since he needed a house to live in.","소년은 살 집이 필요해서 압박감을 느끼고 있었다."],["High [pressure] will bring dry conditions next week.","다음 주 고기압의 영향으로 건조한 날씨가 이어지겠습니다."]]},{"u":16,"n":465,"w":"propose","m":"1. 제안하다 2. 청혼하다","ex":[["The tree [proposed] that he take its branches to build his house.","나무는 소년에게 집을 짓기 위해 자신의 가지를 가져가라고 제안했다."],["He [proposed] to her last night, but she refused.","그는 어젯밤에 그녀에게 청혼했지만, 그녀는 거절했다."]]},{"u":16,"n":466,"w":"pleasure","m":"기쁨, 즐거움; 기쁜 일","ex":[["It was a [pleasure] for the tree to give him everything.","그에게 모든 것을 주는 것이 나무에게는 기쁨이었다."]]},{"u":16,"n":467,"w":"buddy","m":"친구; 동료, 동지","ex":[["Years later, the boy came to meet his old [buddy].","몇 년 후, 소년은 자신의 오랜 친구를 만나러 왔다."]]},{"u":16,"n":468,"w":"voyage","m":"여행, 항해; 여행하다, 항해하다","ex":[["He wanted to rest by taking a [voyage].","소년은 여행을 떠남으로써 쉬기를 원했다."]]},{"u":16,"n":469,"w":"pity","m":"동정(심); 유감","ex":[["The tree felt [pity] for the boy.","나무는 소년에게 동정심을 느꼈다."]]},{"u":16,"n":470,"w":"hesitate","m":"주저하다, 망설이다","ex":[["The tree did not [hesitate] to give him its own body.","나무는 그에게 자기 자신의 몸통을 내어주는 것을 주저하지 않았다."]]},{"u":16,"n":471,"w":"sacrifice","m":"1. 희생하다 2. 제물로 바치다; 1. 희생 2. 제물; 제물을 바침","ex":[["The tree [sacrificed] itself to make him happy.","나무는 그를 행복하게 만들기 위해서 자신을 희생했다."],["They planned to [sacrifice] sheep as an act of worship.","그들은 숭배의 행위로 양을 제물로 바칠 계획이었다."]]},{"u":16,"n":472,"w":"priceless","m":"값을 매길 수 없는, 대단히 귀중한","ex":[["For the tree, its friendship with the boy was [priceless].","나무에게 소년과의 우정은 대단히 귀중했다."]]},{"u":16,"n":473,"w":"fortunate","m":"운이 좋은, 다행인","ex":[["The tree felt [fortunate] to have helped the boy.","나무는 소년을 도와주어서 운이 좋다 "u":17,"n":483,"w":"thunder","m":"천둥; 천둥이 치다","ex":[["Thor is the god of [thunder], who uses a special hammer.","Thor는 천둥의 신이며, 특별한 망치를 사용한다."]]},{"u":17,"n":484,"w":"outstanding","m":"뛰어난; 눈에 띄는","ex":[["Captain America has [outstanding] physical ability.","Captain America는 뛰어난 신체 능력을 갖고 있다."]]},{"u":17,"n":485,"w":"weapon","m":"무기, 병기","ex":[["Iron Man wears a suit of armor that has a number of [weapons].","Iron Man은 여러 무기가 있는 갑옷을 입는다."]]},{"u":17,"n":486,"w":"mighty","m":"1. 강력한, 힘센 2. 웅장한 3. 굉장한","ex":[["The angrier Hulk gets, the [mightier] he gets.","Hulk는 화가 날수록 점점 더 강력해진다."],["the [mighty] Rocky Mountains","웅장한 로키산맥"],["It takes a [mighty] effort to write a book.","책을 쓰는 것은 굉장한 노력이 든다."]]},{"u":17,"n":487,"w":"insect","m":"곤충; 벌레","ex":[["One of Ant-Man’s abilities is to communicate with [insects].","Ant-Man의 능력 중 하나는 곤충과 소통하는 것이다."]]},{"u":17,"n":488,"w":"alien","m":"1. 외계인 2. 외국인; 1. 외계의 2. 외국의 3. 이질적인","ex":[["One day, [aliens] from outer space attacked the earth.","어느 날, 우주에서 온 외계인이 지구를 공격했다."],["an [alien] culture that is different from my country’s","우리나라 문화와는 다른 외국의 문화"],["Everything was [alien] to me when I moved to the new country.","내가 새로운 나라에 이주했을 때, 나에겐 모든 것이 이질적이었다."]]},{"u":17,"n":489,"w":"collaborate","m":"협력하다, 공동으로 작업하다","ex":[["Superheroes decided to [collaborate] to fight against them.","슈퍼히어로들은 그들에 대항하여 싸우기 위해 협력하기로 결심했다."]]},{"u":17,"n":490,"w":"fierce","m":"1. 격렬한, 맹렬한 2. 사나운 3. (기상 조건이) 극심한","ex":[["A [fierce] battle took place between superheroes and their enemies.","슈퍼히어로들과 적들 사이에 격렬한 전투가 벌어졌다."],["a [fierce] wolf","사나운 늑대"],["I stayed at home all day because of the [fierce] heat.","나는 극심한 더위 때문에 온종일 집에만 있었다."]]},{"u":17,"n":491,"w":"extraordinary","m":"1. 비범한, 대단한 2. 기이한","ex":[["Hulk, who has [extraordinary] strength, helped Captain America in the battle.","대단한 힘을 가진 Hulk는 전투에서 Captain America를 도왔다."],["It’s an [extraordinary] situation.","기이한 상황이다."]]},{"u":17,"n":492,"w":"rapid","m":"빠른, 신속한","ex":[["Iron Man moved at a [rapid] speed to draw the enemies’ attention.","Iron Man은 적들의 주의를 끌기 위해 빠른 속도로 움직였다."]]},{"u":17,"n":493,"w":"superior","m":"1. (~보다) 우월한, 우수한 2. 상급의; 상급자, 상사","ex":[["It was hard to tell which side was [superior].","어느 쪽이 더 우월한지 가리기가 힘들었다."],["a [superior] officer","상급 장교"],["She successfully gave a presentation in front of her [superiors].","그녀는 상사들 앞에서 성공적으로 발표했다."]]},{"u":17,"n":494,"w":"conquer","m":"정복하다; 이기다","ex":[["With their amazing power, the superheroes finally [conquered] the aliens.","자신들의 놀라운 능력으로 슈퍼히어로들은 마침내 외계인들을 이겼다."]]},{"u":17,"n":495,"w":"confront","m":"(위험 등에) 직면하다, 맞서다; (문제가) 닥치다","ex":[["Unfortunately, the superheroes were [confronted] with difficulties.","안타깝게도, 슈퍼히어로들은 어려움에 직면했다."]]},{"u":17,"n":496,"w":"manage","m":"1. 관리하다; 경영하다 2. (간신히, 용케) 해내다","ex":[["The government tried to control and [manage] them.","정부는 그들을 통제하고 관리하려고 했다."],["He always [manages] to pass his exams.","그는 항상 시험을 용케 통과 해낸다."]]},{"u":17,"n":497,"w":"disagree","m":"반대하다, 동의하지 않다","ex":[["Some of them agreed to the new rules, but the others [disagreed].","그들 중 몇 명은 새 규칙에 동의했지만, 나머지들은 반대했다."]]},{"u":17,"n":498,"w":"split","m":"분열되다; 나누다; 분열, 불화","ex":[["They [split] into two sides and started a war.","그들은 두 편으로 분열되어서 전쟁을 시작했다."],["The [split] in our team had a terrible effect on the project.","우리 팀 내의 분열은 프로젝트에 끔찍한 영향을 끼쳤다."]]},{"u":17,"n":499,"w":"tragic","m":"비극적인, 비극의","ex":[["The war had some [tragic] consequences.","그 전쟁은 몇몇 비극적인 결과를 초래했다."]]},{"u":17,"n":500,"w":"severe","m":"1. 심각한 2. (처벌이) 가혹한 3. 엄격한","ex":[["They hurt each other, and some received [severe] injuries.","그들은 서로를 상처 입혔고, 몇몇은 심각한 부상을 입었다."],["a [severe] punishment","가혹한 처벌"]]},{"u":17,"n":501,"w":"resolve","m":"1. (문제 등을) 해결하다, 풀다 2. 결심하다, 결정하다","ex":[["It took some time for them to [resolve] the conflict.","그들이 갈등을 해결하는 데에는 얼마간 시간이 걸렸다."],["Amanda [resolved] to find a bigger purpose in life.","Amanda는 더 큰 인생의 목적을 찾기로 결심했다."]]},{"u":17,"n":502,"w":"trait","m":"특성, 특징","ex":[["Each superhero has different [traits] and abilities.","슈퍼히어로들은 각자 다른 특성과 능력을 가지고 있다."]]},{"u":17,"n":503,"w":"eventual","m":"궁극적인, 최종적인","ex":[["However, their [eventual] goal is the same: peace on Earth.","그러나 그들의 궁극적인 목표는 ‘지구 평화’로 같다."]]},{"u":17,"n":504,"w":"perceive","m":"인지하다, 지각하다","ex":[["They [perceived] that it would be more serious if they kept fighting.","그들은 계속해서 싸운다면 상황이 더 심각해질 것을 인지했다."]]},{"u":17,"n":505,"w":"unite","m":"연합하다; 결합시키다","ex":[["Eventually, they [united] to keep peace on Earth.","마침내, 그들은 지구의 평화를 지키기 위해 연합했다."]]},{"u":17,"n":506,"w":"bill","m":"1. 계산서, 청구서 2. 지폐 3. 법안 4. (새의) 부리","ex":[["She asked the waiter for her [bill] from lunch.","그녀는 종업원에게 점심 식사에 대한 계산서를 달라고 요청했다."],["a ten-dollar [bill]","10달러짜리 지폐"],["A [bill] to protect animals was passed yesterday.","동물을 보호하기 위한 법안이 어제 통과됐다."],["There is a black bird with a yellow [bill].","노란색 부리를 가진 검은 새 한 마리가 있다."]]},{"u":17,"n":507,"w":"race","m":"1. 경주; 경쟁 2. 인종; 경주하다; 경쟁하다","ex":[["I participated in a bicycle [race] last weekend.","나는 지난 주말에 자전거 경주에 참가했다."],["People of many different [races] live in America.","미국에는 많은 다양한 인종의 사람들이 살고 있다."]]},{"u":17,"n":508,"w":"general","m":"1. 일반적인, 보편적인 2. (어느 하나에 국한되지 않은) 종합적인; 장군","ex":[["Reading newspapers helps improve your [general] knowledge.","신문을 읽는 것은 일반적인 지식을 향상시키는 데 도움이 된다."],["a [general] hospital","종합 병원"],["The [general] played an important role in the war’s victory.","그 장군은 전쟁에서의 승리에 중요한 역할을 했다."]]},{"u":17,"n":509,"w":"right","m":"1. 옳은, 올바른; 맞는 2. 오른쪽의; 권리; 1. 맞게 2. 오른쪽으로 3. 정확히, 바로","ex":[["You were [right] about Sarah. She is smart and kind.","네가 Sarah에 대해 옳았다. 그녀는 똑똑하고 친절해."],["Dan injured his [right] arm while playing baseball.","Dan은 야구를 하다가 오른팔에 부상을 입었다."],["A long time ago, women fought for their [right] to vote.","오래전에 여성들은 자신들의 투표할 권리를 위해 싸웠다."],["I was standing [right] in front of the gate.","나는 출입구 바로 앞에 서 있었다."]]},{"u":17,"n":510,"w":"safe","m":"안전한; 금고","ex":[["My neighborhood is considered to be [safe] for children and women.","우리 동네는 아이들과 여성들에게 안전하게 여겨진다."],["She put her money and valuables in her [safe].","그녀는 돈과 귀중품을 자신의 금고에 두었다."]]},{"u":18,"n":511,"w":"reputation","m":"명성, 평판","ex":[["Welton High School had a [reputation] for its strict principles.","Welton고등학교는 엄격한 원칙으로 명성이 있었다."]]},{"u":18,"n":512,"w":"entrance","m":"1. 입학, 입회; 입장 2. (출)입구","ex":[["It was also known for its high college [entrance] rates.","그 학교는 높은 대학 입학률로도 알려져 있었다."],["The main [entrance] is on the left side.","중앙 입구는 왼쪽에 있다."]]},{"u":18,"n":513,"w":"institution","m":"1. (대학 등의 대규모) 기관, 협회 2. 보호 시설 (건물)","ex":[["Many educational [institutions] were interested in Welton High School.","많은 교육 기관이 Welton고등학교에 관심이 있었다."],["My grandmother is being taken care of in an [institution].","우리 할머니는 보호 시설에서 보살핌을 받고 계신다."]]},{"u":18,"n":514,"w":"stubborn","m":"완고한, 고집 센","ex":[["The students were [stubborn], so they didn’t want to accept change.","학생들은 완고해서변화를 받아들이길 원치 않았다."]]},{"u":18,"n":515,"w":"greeting","m":"인사, 안부의 말","ex":[["Some students didn’t even exchange [greetings] with each other.","어떤 학생들은 심지어 서로 인사도 나누지 않았다."]]},{"u":18,"n":516,"w":"curriculum","m":"교과 과정, 교육 과정","ex":[["Moreover, the [curriculum] was very boring and dry.","게다가 교육 과정은 매우 지루하고 무미건조했다."]]},{"u":18,"n":517,"w":"authority","m":"1. 권한; 지휘권 2. 당국 ((어떤 일을 직접 맡아 하는 기관)) 3. 권위(자)","ex":[["The principal had all the [authority] to tell his students what to do.","교장은 학생들에게 할 일을 명령할 모든 권한을 가졌다."],["health [authorities]","보건 당국"],["There was a tone of [authority] in her voice.","그녀의 목소리에 권위의 어조가 있었다."]]},{"u":18,"n":518,"w":"punishment","m":"벌, 처벌","ex":[["He even used physical [punishment] on the students.","그는 심지어 학생들에게 체벌을 가했다."]]},{"u":18,"n":519,"w":"lecture","m":"강의, 강연; 강의하다, 강연하다","ex":[["The new English teacher’s first [lecture] was amazing.","새 영어 선생님의 첫 강의는 놀라웠다."]]},{"u":18,"n":520,"w":"distract","m":"산만하게 하다, 집중이 안 되게 하다","ex":[["His lecture was so interesting that no one could be [distracted].","그의 수업은 굉장히 흥미로워서 아무도 집중을 안 할 수 없었다."]]},{"u":18,"n":521,"w":"paragraph","m":"문단, 단락","ex":[["The teacher made them understand what each [paragraph] meant.","선생님은 그들이 각 문단이 의미하는 것을 이해하도록 했다."]]},{"u":18,"n":522,"w":"encourage","m":"용기를 북돋우다; 장려하다","ex":[["He [encouraged] students to look at the world in a different way.","그는 학생들이 세상을 다른 방식으로 보도록 장려했다."]]},{"u":18,"n":523,"w":"slight","m":"약간의, 조금의","ex":[["He wanted to show that a [slight] change can cause a big difference.","그는 약간의 변화가 큰 차이를 가져올 수 있다는 것을 보여주고 싶었다."]]},{"u":18,"n":524,"w":"concept","m":"개념, 관념","ex":[["He also taught students the [concept] of free thinking.","그는 또한 학생들에게 자유로운 사고에 대한 개념을 가르쳐 주었다."]]},{"u":18,"n":525,"w":"angle","m":"1. (사물을 보는) 관점 2. 각도, 각","ex":[["Depending on the [angle], people can see different things.","관점에 따라 사람들은 다른 것을 볼 수 있다."],["a 30-degree [angle]","30도 각도"]]},{"u":18,"n":526,"w":"instinct","m":"본능; 직감","ex":[["He also reminded them of the human [instinct] for freedom.","그는 또한 그들에게 자유에 대한 인간의 본능을 상기시켰다."]]},{"u":18,"n":527,"w":"seize","m":"잡다, 붙들다","ex":[["He explained the idea of ‘Carpe diem,’ Latin for ‘[Seize] the day.’","그는 ‘오늘을 잡아라(현재를 즐겨라).’라는 뜻의 라틴어인 ‘Carpe diem’의 개념을 설명했다."]]},{"u":18,"n":528,"w":"internal","m":"1. 내부의; 내면적인 2. 국내의","ex":[["The teacher advised his students to follow their [internal] desire.","선생님은 학생들에게 자신의 내면적인 욕망을 따르라고 조언했다."],["an [internal] flight","국내 항공편"]]},{"u":18,"n":529,"w":"realize","m":"1. 깨닫다, 알아차리다 2. (목표 등을) 실현하다, 달성하다","ex":[["They finally [realized] what they really wanted.","그들은 이윽고 자신이 정말로 원하는 게 무엇인지를 깨달았다."],["We try to help all students [realize] their dreams.","우리는 모든 학생들이 자신의 꿈을 실현하도록 도우려고 노력한다."]]},{"u":18,"n":530,"w":"literature","m":"문학 (작품)","ex":[["Some students liked reading [literature].","몇몇 학생들은 문학 (작품)을 읽는 것을 좋아했다."]]},{"u":18,"n":531,"w":"association","m":"1. 협회, 단체 2. 관련, 연계; 연상","ex":[["The students joined a secret [association], the ‘Dead Poets Society.’","그 학생들은 ‘죽은 시인의 사회’라 불리는 비밀 단체에 가입했다."],["They denied having any [association] with the criminals.","그들은 그 범죄자들과 관련이 있다는 것을 부인했다."]]},{"u":18,"n":532,"w":"underground","m":"지하에서; 비밀히, 남몰래; 지하의; 비밀의, 지하 조직의","ex":[["They often met [underground], below the school, to debate literature.","그들은 문학 작품에 관해 토론하기 위해 종종 학교 아래 지하에서 만났다."],["She joined the [underground] revolutionary movement.","지하 그녀는 혁명 운동에 가담했다."]]},{"u":18,"n":533,"w":"liberty","m":"자유, 해방","ex":[["The students learned that nothing is more important than [liberty].","학생들은 자유보다 더 중요한 것은 없다는 것을 깨달았다."]]},{"u":18,"n":534,"w":"self-esteem","m":"자존감, 자부심","ex":[["Thanks to the teacher, they had high [self-esteem].","선생님 덕분에 그들은 높은 자존감을 가지게 되었다."]]},{"u":18,"n":535,"w":"ideal","m":"이상적인; 상상의; 이상(理想)","ex":[["He showed them what the [ideal] teacher was.","그는 그들에게 이상적인 교사의 모습이 무엇인지를 보여줬다."],["the difference between reality and [ideals]","현실과 이상의 차이"]]},{"u":18,"n":536,"w":"face","m":"얼굴; (물건의) 표면, 정면; 1. (~을) 향하다, 마주 보다 2. 직시하다","ex":[["Her [face] turned red when she made a mistake.","실수를 했을 때 그녀의 얼굴은 붉어졌다."],["My desk [faces] the window so I can look onto the backyard.","내 책상은 창문을 향하고있어서 나는 뒷마당을 볼 수 있다."],["It’s not always easy to [face] the truth.","진실을 직시하는 것이 항상 쉬운 것은 아니다."]]},{"u":18,"n":537,"w":"solution","m":"1. 해결책; 해답 2. 용액","ex":[["It’s hard to find a fundamental [solution] for environmental pollution.","환경오염에 대한 근본적인 해결책을 찾는 것은 어렵다."],["He stirred the [solution] gently before starting the experiment.","그는 실험을 시작하기 전에 그 용액을 부드럽게 저었다."]]},{"u":18,"n":538,"w":"school","m":"1. 학교; 수업 2. 떼, 무리","ex":[["There are more than 600 students in my [school].","우리 학교에는 600명이 넘는 학생들이 있다."],["a [school] of fish","물고기 떼"]]},{"u":18,"n":539,"w":"mine","m":"1. 나의 것 ((I의 소유대명사)) 2. 광산","ex":[["The book on the table is [mine].","탁자 위의 책은 나의 것이다."],["a diamond [mine]","광산 다이아몬드"]]},{"u":18,"n":540,"w":"party","m":"1. 파티, 모임 2. (여행, 방문) 일행, 단체 3. ((정치)) 정당, -당 4. (계약) 당사자","ex":[["I had a good time at Jina’s birthday [party].","나는 지나의 생일 파티에서 즐거운 시간을 보냈다."],["a [party] of travelers","여행객 일행"],["He is the leader of the political [party].","그는 정당의 대표이다."],["The two ":[["He had designers [simplify] the buttons of all their electronic devices.","그는 디자이너들에게 모든 전자 기기의 버튼을 단순화하게 시켰다."]]},{"u":20,"n":584,"w":"philosophy","m":"(인생)철학; ((학문)) 철학","ex":[["His [philosophy] of simplification made Apple’s designs unique.","그의 단순화 철학은 Apple사의 디자인을 유일무이하게 만들었다."]]},{"u":20,"n":585,"w":"restrict","m":"제한하다, 한정하다","ex":[["He [restricted] employees from talking about their work.","그는 직원들이 그들의 업무에 대해 말하는 것을 제한했다."]]},{"u":20,"n":586,"w":"adversity","m":"역경, 불행","ex":[["Despite lots of [adversity],he never got discouraged.","수많은 역경에도 불구하고, 그는 절대 단념하지 않았다."]]},{"u":20,"n":587,"w":"department","m":"(회사, 대학 등의) 부서, 학과","ex":[["He didn’t neglect any of the [departments] in Apple.","그는 Apple사의 어떤 부서도 등한시하지 않았다."]]},{"u":20,"n":588,"w":"fulfill","m":"1. 성취하다, 실현하다 2. (약속, 요구 등을) 이행하다, 충족시키다","ex":[["He [fulfilled] his goal of remaking the personal computer market.","그는 개인용 컴퓨터 시장을 새롭게 만드는 자신의 목표를 성취했다."],["She [fulfilled] the graduation requirements in her fourth year.","그녀는 4학년 때 졸업 요건을 충족시켰다."]]},{"u":20,"n":589,"w":"merchandise","m":"제품, 상품; 매매하다","ex":[["He was always proud of his [merchandise].","그는 항상 자신의 제품을 자랑스러워했다."]]},{"u":20,"n":590,"w":"enhance","m":"향상시키다, 높이다","ex":[["He [enhanced] the quality of all the merchandise.","그는 모든 제품의 질을 향상시켰다."]]},{"u":20,"n":591,"w":"fantasy","m":"(기분 좋은) 상상, 공상","ex":[["People say that he turned [fantasy] into reality.","사람들은 그가 상상을 현실로 바꿨다고 말한다."]]},{"u":20,"n":592,"w":"biography","m":"(인물의) 전기, 일대기","ex":[["His [biographies] were published in many countries.","그의 전기들이 많은 나라에서 출판되었다."]]},{"u":20,"n":593,"w":"phrase","m":"구(절)","ex":[["One of his famous [phrases] is “Stay hungry; stay foolish.”","그의 유명한 구절 중 하나는 ‘계속 갈망하고 끊임없이 배워라.’이다."]]},{"u":20,"n":594,"w":"quote","m":"인용하다, (남의 말을 그대로) 전달하다","ex":[["His famous sayings and speeches are often [quoted].","그의 명언과 연설은 자주 인용된다."]]},{"u":20,"n":595,"w":"theme","m":"주제, 테마","ex":[["His life philosophy was also used as the [theme] of a film.","그의 인생철학 또한 영화의 주제로
