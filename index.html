<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="해율북스 단어">
<title>해율북스 단어 테스트</title>
<meta property="og:title" content="해율북스 단어 테스트">
<meta property="og:description" content="어휘끝 고교기본 단어 테스트">
<meta name="description" content="해율북스 단어 테스트">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234E7E86'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='30' fill='%23fff'%3E해%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F6F4; --card:#FFFFFF; --ink:#262A27; --ink2:#6B716C; --line:#DEE3DF;
  --accent:#4E7E86; --accent-soft:#E3EDEF;
  --ok:#3E7C5B; --ok-soft:#D8EBDF; --bad:#B04F4C; --bad-soft:#F5DCD9; --mark:#FFF0AE;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:22px 22px calc(48px + env(safe-area-inset-bottom));min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
input{font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.serif{font-family:var(--serif)}
.brand{font-size:13px;color:var(--ink2)}
h1{font-size:24px;font-weight:700;margin:4px 0 6px;letter-spacing:-.01em;line-height:1.3}
.sub{font-size:15px;color:var(--ink2);line-height:1.6}
h2{font-size:14px;color:var(--ink2);font-weight:600;margin:0 0 6px}

/* 시작 화면 */
.units{margin:22px 0 26px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.units ul{margin:0;padding:0;list-style:none;font-size:15px;line-height:1.7}
.units b{font-weight:700;margin-right:8px}
.units .n{font-size:13px;color:var(--ink2);margin-top:6px}
.field{display:block;margin-bottom:22px}
.field>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:8px}
.rule{font-size:14px;color:var(--ink2);margin:18px 0 0;line-height:1.6}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.name-btn{font-size:17px;font-weight:600;padding:16px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.name-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.login{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.login .who{font-size:15px;margin-bottom:10px}
.login .who b{font-weight:700}
.login .row{display:flex;gap:10px}
.login input{flex:1;letter-spacing:.3em;font-size:19px}

/* 버튼 */
.btn{font-size:16px;font-weight:600;padding:13px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn:disabled{opacity:.45}
.actions{margin-top:26px;display:flex;gap:10px}
.actions.col{flex-direction:column}
.actions.col .btn{width:100%}

/* 문제 화면 */
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar{height:100%;background:var(--accent);transition:width .25s ease}
.timebar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.tbar{height:100%;background:var(--accent);transition:width .1s linear}
.tbar.warn{background:var(--bad)}
.count{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin:8px 0 30px}
.tleft{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.tleft.warn{color:var(--bad)}
.fb.timeout{color:var(--bad)}
.lead{font-size:15px;color:var(--ink2);margin:0 0 14px}
.word{font-family:var(--serif);font-size:36px;line-height:1.2;margin:0 0 28px;overflow-wrap:anywhere}
.meaning{font-size:22px;font-weight:500;line-height:1.45;margin:0 0 28px}
.sentence{font-family:var(--serif);font-size:20px;line-height:1.7;margin:0 0 10px}
.blank{display:inline-block;min-width:4.2em;height:1.05em;vertical-align:-.2em;background:var(--mark);border-bottom:1.5px solid var(--ink);margin:0 .1em}
.blank.filled{min-width:0;height:auto;vertical-align:baseline;padding:0 .15em}
.blank.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.blank.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.correct-form{color:var(--ok);margin-left:.25em;font-weight:600}
.hint{font-size:15px;color:var(--ink2);margin:0 0 24px;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;font-size:16px;line-height:1.45;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);transition:background .1s ease,border-color .1s ease}
.choice:disabled{color:var(--ink);opacity:1}
.choice.ok{background:var(--ok-soft);border-color:var(--ok)}
.choice.bad{background:var(--bad-soft);border-color:var(--bad)}
.answer-row{display:flex;gap:10px}
.answer-row input{flex:1;font-family:var(--serif);font-size:19px}
.answer-row input:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.answer-row input.ok{border-color:var(--ok);background:var(--ok-soft)}
.answer-row input.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:18px;font-size:16px;line-height:1.6}
.feedback .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fb{font-weight:700}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb-answer{color:var(--ink2)}
.fb-answer .serif{color:var(--ink);font-size:18px}
.fb-meaning{font-size:14px;color:var(--ink2);margin-top:4px}

/* 결과 화면 */
.result-meta{margin:0 0 24px}
.result-meta .name{font-size:22px;font-weight:700}
.result-meta .sub{font-size:14px;margin-top:4px}
.score{display:flex;align-items:baseline;gap:8px;padding:22px 0 18px;border-top:1px solid var(--line);margin-bottom:0}
.score .big{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1}
.score .of{font-size:20px;color:var(--ink2)}
.score .pct{margin-left:auto;font-size:16px;color:var(--ink2)}
.byunit{display:flex;gap:10px;padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:26px}
.byunit div{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.byunit .u{font-size:13px;color:var(--ink2)}
.byunit .s{font-size:18px;font-weight:700;margin-top:2px}
.byunit .s small{font-size:13px;font-weight:500;color:var(--ink2)}
.wrong-list{list-style:none;margin:0;padding:0}
.wrong-list li{padding:12px 0;border-bottom:1px solid var(--line)}
.wrong-list .w{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.wrong-list .w .serif{font-size:19px;flex:0 0 auto}
.wrong-list .m{font-size:14px;text-align:right;color:var(--ink);line-height:1.5}
.wrong-list .mine{font-size:13px;color:var(--bad);margin-top:3px}
.all-right{font-size:17px;margin:0}
.note{font-size:14px;color:var(--ink2);margin:24px 0 0}

/* 결과지 */
.rep h2{font-size:13px;color:var(--ink2);font-weight:600;margin:34px 0 10px;letter-spacing:.01em}
.rep .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
.rep svg{display:block;width:100%;height:auto}
.rep .kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.rep .kv:last-child{border-bottom:0}
.rep .kv b{font-weight:700}
.rep .verdict{font-size:16px;font-weight:700;margin:0 0 6px;line-height:1.5}
.rep .why{font-size:14px;color:var(--ink2);margin:0;line-height:1.6}
.rep .band{display:flex;gap:6px;margin:10px 0 8px}
.rep .band span{flex:1;text-align:center;font-size:12px;padding:8px 4px;border-radius:8px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.rep .band span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.rep .stairs{display:flex;align-items:flex-end;gap:10px;height:120px;margin:6px 0 4px}
.rep .stairs div{flex:1;background:var(--accent-soft);border:1px solid var(--accent);border-bottom-width:3px;border-radius:8px 8px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;font-size:13px;color:var(--ink);min-height:34px}
.rep .stairs b{font-size:16px}
.rep .stairs small{font-size:11px;color:var(--ink2)}
.rep .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rep .tags span{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
.rep .tags span b{color:var(--ink);font-weight:700;margin-left:3px}
.rep .comment{font-size:15px;line-height:1.75;white-space:pre-line}
.rep .fine{font-size:12px;color:var(--ink2);margin:8px 0 0;line-height:1.6}
.rep .calc{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin:6px 0 10px}
.rep .calc .c{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 4px}.rep .calc .c b{display:block;font-size:20px;font-weight:700}.rep .calc .c small{font-size:11px;color:var(--ink2)}.rep .calc .op{font-size:18px;color:var(--ink2)}
.rep .road{margin:12px 0 4px}
.rep .seg{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.rep .seg:last-child{border-bottom:0}
.rep .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);background:#fff}
.rep .seg.now .dot{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}
.rep .seg .t b{font-weight:700}.rep .seg .t small{display:block;color:var(--ink2);font-size:12px}
.rep .seg .n{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap}.rep .seg .n b{color:var(--ink);font-weight:700}
.rep .pace{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}.rep .pace td{padding:8px 4px;border-bottom:1px solid var(--line)}.rep .pace tr:last-child td{border-bottom:0}
.rep .pace td.r{text-align:right;white-space:nowrap}.rep .pace tr.me td{background:var(--accent-soft);font-weight:700}.rep .pace .tag{font-size:12px;color:var(--ink2);font-weight:500}
.rep .vision{font-size:15px;line-height:1.7;margin:12px 0 0}
.rep .hw{background:var(--mark);border:1px solid #E8D98A;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;margin-top:10px}.rep .hw b{display:block;margin-bottom:2px}
.rep .ok-band{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;margin-top:10px;font-weight:600}
.study .chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.study .chip{font-size:16px;padding:16px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.study .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.wrong-list .cat{font-size:12px;color:var(--ink2);margin-left:6px}

/* 결과 보내기 / 선생님 화면 */
.saved{font-size:14px;color:var(--ok);margin:22px 0 0;font-weight:600}
.share-box{margin-top:10px}
.share-box textarea{width:100%;font:inherit;font-size:13px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:120px;resize:vertical}
.link{font-size:14px;color:var(--ink2);background:none;border:0;padding:0;margin-top:34px;text-decoration:underline;text-underline-offset:3px}
.link.back{margin:0 0 18px;text-decoration:none}
.pin input{max-width:160px;letter-spacing:.2em}
.status{font-size:14px;color:var(--accent);margin-top:14px;min-height:1.5em;line-height:1.6}
.status.bad{color:var(--bad)}
table.rank{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
table.rank th{font-size:12px;font-weight:600;color:var(--ink2);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rank td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.rank td.r{font-weight:700;width:34px}
table.rank td.s{font-weight:700;white-space:nowrap}
table.rank td.n{font-size:13px;color:var(--ink2);white-space:nowrap;text-align:right}
table.rank .sub{font-size:12px;color:var(--ink2);display:block;margin-top:2px}
details.att{margin-top:10px;font-size:14px}
details.att summary{cursor:pointer;color:var(--ink2);padding:6px 0}
details.att ul{margin:4px 0 0;padding-left:18px;line-height:1.6}
.paste textarea{width:100%;font:inherit;font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:110px;resize:vertical}
.empty{font-size:14px;color:var(--ink2);padding:14px 0}
.live{margin-top:22px;padding:14px 14px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.live .lh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2);margin-bottom:6px}
.live .lh b{color:var(--ink);font-size:15px}
.lrow{padding:10px 0;border-top:1px solid var(--line)}
.lrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px}
.lrow .top b{font-weight:700}
.lrow .top span{font-size:13px;color:var(--ink2);white-space:nowrap}
.lrow .pbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:7px 0 5px}
.lrow .pbar div{height:100%;background:var(--accent)}
.lrow .pbar.done div{background:var(--ok)}
.lrow .meta{font-size:13px;color:var(--ink2)}
.lrow .meta .to{color:var(--bad)}

.credit{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);line-height:1.8;letter-spacing:.01em}
.credit span{display:block}
.credit b{font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// =====================================================================
//  설정 — 시험마다 이 부분만 고치면 됩니다
// =====================================================================
const TEST_TITLE = "9월 2주차 단어 테스트";
const UNIT_FROM = 28, UNIT_TO = 29;             // 시험 범위
const PER_UNIT = { blank: 24, mc: 3, spell: 3 }; // 유닛당 유형별 문항 수 (합 30 = 유닛 단어 수)
const TIME_LIMIT = 30;                           // 문제당 제한 시간(초). 시간이 지나면 그 문제는 오답 처리. 0이면 제한 없음
// 학생 명단 — 비밀번호는 화면에 나오지 않고, 파일에도 암호화된 값(key)만 들어 있습니다. 바꾸려면 새 key가 필요합니다.
const STUDENTS = [
  { name: "문정원", key: "a1cf808e" },
  { name: "공예슬", key: "a831403d" },
  { name: "송서연", key: "76d8aaa5" },
  { name: "문지원", key: "f4dd5f7a" }
];
const TEACHER_KEY = "29f23a71";                   // 선생님 화면 확인 번호(암호화된 값)
const RESULT_NOTE = "'결과 보내기'를 눌러 선생님께 보내 주세요.";
const STUDY_OPTIONS = ["안 함", "30분 이내", "1시간쯤", "2시간 이상"];  // 시작할 때 학생에게 묻는 공부 시간
const PASS_RATE = 80;                            // 이 정답률 미만이면 벌칙 숙제
// 앞으로의 로드맵 (등장 표현 기준). weeks = 계획대로 한 바퀴 도는 데 잡은 주 수
const ROADMAP = [
  { name: "어휘끝 고교기본", sub: "고1 기본 단어 · 외부 교재", total: 1200, unit: "단어", weeks: 20, current: true },
  { name: "기단", sub: "고1~고2 필수 단어 · 표제어 500", total: 3500, unit: "표현", weeks: 20 },
  { name: "결단", sub: "고2~고3 필수 단어 · 표제어 333", total: 4123, unit: "표현", weeks: 24 },
  { name: "특단", sub: "수능 최고난도 단어 · 표제어 222", total: 687, unit: "표현", weeks: 8 },
];

e teachers.","교장 선생님은 선생님들에게 감사를 표하며 연설을 끝내셨다."]]},{"u":1,"n":13,"w":"fit","m":"1. (모양, 크기가) 맞다 2. 어울리다, 적합하다; 1. 어울리는, 적합한 2. (운동으로 몸이) 건강한","ex":[["The key doesn’t [fit] this lock.","그 열쇠는 이 자물쇠에 맞지 않는다."],["Try to find a job that [fits] your interests and skills.","너의 흥미와 기술에 적합한 직업을 찾도록 노력해라."],["She is [fit] enough to finish a marathon.","그녀는 마라톤을 완주할 만큼 건강하다."]]},{"u":1,"n":14,"w":"belong","m":"(~의) 것이다, 소유이다; (~에) 속하다","ex":[["This bag [belongs] to me, and that watch [belongs] to my sister.","이 가방은 나의 것이고, 것이다, 저 시계는 우리 언니의."]]},{"u":1,"n":15,"w":"occur","m":"1. 발생하다, 일어나다 2. (생각이) 떠오르다 3. (~에) 존재하다","ex":[["We were surprised because an unexpected event [occurred].","우리는 예상치 못한 사건이 발생해서 놀랐다."],["A great idea just [occurred] to me.","나에게 방금 좋은 생각이 떠올랐다."],["Vitamin C [occurs] naturally in apples.","사과에는 비타민 C가 자연적으로 존재한다."]]},{"u":1,"n":16,"w":"notice","m":"1. 알아차리다 2. 주목하다 3. 통지하다; 1. 주의, 주목 2. 통지(서); 게시(물)","ex":[["I didn’t [notice] that a car was coming.","나는 차가 오는 것을 알아차리지 못했다."],["She got [noticed] with her new dress.","그녀는 새로운 드레스로 주목받았다."],["[Notices] about the school trip were sent to parents.","수학여행에 대한 통지서가 부모님들에게 발송되었다."]]},{"u":1,"n":17,"w":"inform","m":"알리다, 통지하다","ex":[["We are pleased to [inform] you that you are the winner.","귀하께서 우승자가 되셨음을 알려 드리게 되어 기쁩니다."]]},{"u":1,"n":18,"w":"suppose","m":"1. (사실이라고) 가정하다 2. (~일 것이라고) 생각하다, 추측하다","ex":[["Let’s [suppose] that you could have anything you wanted.","네가 원하는 것은 무엇이든지 가질 수 있다고 가정해보자."],["Learning Spanish was not as difficult as I had [supposed].","스페인어를 배우는 것은 내가 생각했던 것만큼 어렵진 않았다."]]},{"u":1,"n":19,"w":"pretend","m":"(~인) 척하다; (사실이 아닌 것을) 주장하다","ex":[["She was very tired, but she [pretended] to enjoy the party.","그녀는 매우 피곤했지만, 파티를 즐기는 척했다."]]},{"u":1,"n":20,"w":"suggest","m":"1. 제안하다 2. 암시하다, 시사하다","ex":[["My mom [suggested] that we go jogging together every night.","우리 엄마는 매일 밤 함께 조깅을 하러 가자고 제안하셨다."],["His shaking legs [suggest] that he is nervous.","떨리는 다리는 그가 초조하다는 것을 암시한다."]]},{"u":1,"n":21,"w":"develop","m":"1. 발달시키다, 발전하다 2. 개발하다 3. (필름을) 현상하다","ex":[["This class is intended to [develop] your writing skill.","이 수업은 작문 기술을 발달[발전]시키기 위한 것이다."],["Scientists have [developed] a new method to slow aging.","과학자들이 노화를 늦추는 새로운 방법을 개발했다."],["My vacation pictures will be [developed] tomorrow.","나의 휴가 사진들은 내일 현상될 것이다."]]},{"u":1,"n":22,"w":"locate","m":"1. (~의) 위치를 찾아내다 2. (특정 장소에) 위치하다","ex":[["Could you help me [locate] this restaurant on the map?","지도에 있는 이 식당의 위치를 찾는 것을 도와줄 수 있나요?"],["Many IT companies are [located] in Silicon Valley.","많은 IT기업들이 실리콘 밸리에 위치한다."]]},{"u":1,"n":23,"w":"separate","m":"1. 분리하다 2. 헤어지게 하다; 분리된; 개개의","ex":[["You can [separate] the yolk from an egg with this tool.","이 도구로 달걀에서 노른자를 분리할 수 있다."],["The twins were [separated] and grew up in different cities.","그 쌍둥이는 헤어져서 다른 도시에서 자랐다."],["two [separate] buildings","두 개의 분리된 빌딩"]]},{"u":1,"n":24,"w":"disappear","m":"사라지다, 없어지다","ex":[["She started to run and soon [disappeared] from my sight.","그녀는 달려가기 시작했고 곧 내 시야에서 사라졌다."],["If you get regular treatment, your symptoms will [disappear] soon.","정기적인 치료를 받으면 너의 증상들은 곧 사라질 것이다."]]},{"u":1,"n":25,"w":"suffer","m":"1. 고통을 받다 2. (손해 등을) 겪다, 당하다","ex":[["People who [suffer] from depression need to receive proper counseling.","우울증으로 고통을 받는 사람들은 적절한 상담을 받을 필요가 있다."],["Many companies [suffered] huge financial losses during the pandemic.","전염병이 유행하는 동안 많은 기업이 막대한 재정적 손실을 겪었다."]]},{"u":1,"n":26,"w":"require","m":"필요로 하다; 요구하다","ex":[["This project [requires] considerable investment to proceed as planned.","이 프로젝트는 계획대로 진행하기 위해 상당한 투자를 필요로 한다."],["All workers were [required] to wear a safety helmet.","모든 근로자는 안전모 착용을 요구받았다."]]},{"u":1,"n":27,"w":"prevent","m":"1. 막다, 방해하다 2. 예방하다","ex":[["The storm [prevented] me from going to school.","폭풍우는 내가 등교하는 것을 막았다."],["When you come back home, wash your hands to [prevent] disease.","집에 돌아오면 질병을 예방하기 위해 손을 씻어라."]]},{"u":1,"n":28,"w":"motivate","m":"1. 동기를 부여하다 2. (행동 등의) 이유가 되다","ex":[["A great teacher [motivates] students to do their best.","훌륭한 교사는 학생들이 최선을 다하도록 동기를 부여한다."],["No one knows what [motivated] the crime.","아무도 무엇이 그 범죄의 이유가 되었는지 모른다."]]},{"u":1,"n":29,"w":"socialize","m":"(사람들과) 어울리다, 친하게 지내다; 사회화시키다","ex":[["It is easy for Robin to [socialize] with people at the parties.","Robin에게는 파티에서 만난 사람들과 어울리는 것이 쉬운 일이다."]]},{"u":1,"n":30,"w":"gather","m":"모이다, 모으다","ex":[["A crowd [gathered] in the main square to listen to his speech.","군중이 그의 연설을 듣기 위해 중앙 광장에 모였다."]]},{"u":2,"n":31,"w":"recognize","m":"1. 알아보다, 분간하다 2. (존재, 사실을) 인정하다","ex":[["She didn’t [recognize] me at first because of my new haircut.","그녀는 나의 새로운 머리 모양 때문에 처음엔 나를 알아보지 못했다."],["Finally, she [recognized] her mistakes.","마침내 그녀는 자신의 실수를 인정했다."]]},{"u":2,"n":32,"w":"remind","m":"생각나게 하다, 상기시키다","ex":[["This song [reminds] me of my middle school days.","이 노래는 나에게 중학교 시절을 생각나게 한다."]]},{"u":2,"n":33,"w":"negotiate","m":"협상하다, 교섭하다","ex":[["They are [negotiating] with their employer for a wage increase.","그들은 임금 인상을 두고 고용주와 협상하고 있다."]]},{"u":2,"n":34,"w":"approve","m":"승인하다; 찬성하다","ex":[["The board [approved] the hiring of new staff members.","이사회는 새 직원을 채용할 것을 승인했다."]]},{"u":2,"n":35,"w":"declare","m":"1. 선언하다, 공표하다; 단언하다 2. (세관 등에) 신고하다","ex":[["The government has [declared] war against terror.","정부가 테러와의 전쟁을 선언했다."],["All income should be [declared].","모든 소득은 반드시 신고되어야 한다."]]},{"u":2,"n":36,"w":"contrast","m":"대조하다; 대조[차이]를 보이다; 대조, 차이","ex":[["The book [contrasted] the lives of women a hundred years ago with the lives of women today.","그 책은 100년 전 여성의 삶과 현대 여성의 삶을 대조했다."],["In [contrast] to last year, the weather is too hot.","지난해와 대조적으로, 날씨가 너무 덥다."]]},{"u":2,"n":37,"w":"avoid","m":"피하다, 회피하다; 막다, 예방하다","ex":[["When you are lying, you always [avoid] eye contact with me.","거짓말할 때 너는 항상 나와 눈 마주치는 걸 피한다."]]},{"u":2,"n":38,"w":"postpone","m":"미루다, 연기하다","ex":[["Do you know why our client [postponed] the meeting?","왜 우리 의뢰인이 미팅을 미뤘는지 아세요?"]]},{"u":2,"n":39,"w":"confuse","m":"1. 혼동하다 2. 혼란스럽게 하다; 당황하게 하다","ex":[["People often [confuse] butterflies with moths because they look similar.","사람들은 나비와 나방이 비슷하게 생겨서 종종 그 둘을 혼동한다."],["The rules [confused] me at first, but I quickly learned them while playing.","규칙들이 처음엔 나를 혼란스럽게 했지만, 나는 놀이를 하는 동안 그것들을 빠르게 배웠다."]]},{"u":2,"n":40,"w":"defeat","m":"이기다, 패배시키다; 패배","ex":[["The boxer [defeated] his rival in the final round.","그 복싱선수는 결승전에서 그의 경쟁자를 이겼다."],["It was very hard for me to admit [defeat].","나는 패배를 인정하기가 매우 힘들었다."]]},{"u":2,"n":41,"w":"destroy","m":"파괴하다; 파멸시키다","ex":[["One third of tropical rainforests have been [destroyed] in the last 50 years.","지난 50년간 열대 우림의 삼분의 일이 파괴되었다."]]},{"u":2,"n":42,"w":"collapse","m":"1. (의식을 잃고) 쓰러지다 2. 붕괴되다; 붕괴","ex":[["The old lady [collapsed] with shock when she heard the news.","노부인은 그 소식을 듣고 충격으로 쓰러졌다."],["The building [collapsed] in an earthquake.","그 건물은 지진으로 붕괴되었다."]]},{"u":2,"n":43,"w":"involve","m":"1. 포함하다, 수반하다 2. (사건 등에) 연루시키다, 관련시키다","ex":[["The course [involves] lots of writing work.","그 강의는 많은 작문 과제를 포함한다."],["He was [involved] in a serious crime.","그는 심각한 범죄에 연루되었다."]]},{"u":2,"n":44,"w":"claim","m":"1. (~이 사실이라고) 주장하다 2. (권리, 재산 등을) 요구하다; 1. 주장 2. 요구; (요구할) 권리","ex":[["She [claimed] that she was telling the truth.","그녀는 자신이 진실을 말하고 있다고 주장했다."],["I did complain and [claimed] some money back.","나는 정말로 항의했고 돈을 일부 돌려달라고 요구했다."]]},{"u":2,"n":45,"w":"demand","m":"요구하다; 1. 요구, 요청 2. 수요","ex":[["The customer [demanded] an apology for poor service.","그 손님은 형편없는 서비스에 대한 사과를 요구했다."],["supply and [demand]","수요와 공급"]]},{"u":2,"n":46,"w":"refund","m":"환불하다; 환불(금)","ex":[["We will [refund] it if you come back within 7 days.","7일 이내에 다시 오시면 환불해 드립니다."]]},{"u":2,"n":47,"w":"tend","m":"1. (~하는) 경향이 있다, ~하기 쉽다 2. 돌보다, 보살피다","ex":[["Unlike my brother, I [tend] to gain weight easily.","내 남동생과 달리 나는 쉽게 살이 찌는 경향이 있다."],["She [tended] the injured cats and dogs.","그녀는 다친 고양이와 개들을 돌보았다."]]},{"u":2,"n":48,"w":"recommend","m":"추천하다; 권고하다, 권장하다","ex":[["Please [recommend] the best dish in this restaurant.","이 레스토랑에서 가장 괜찮은 요리를 추천해 주세요."]]},{"u":2,"n":49,"w":"respond","m":"1. 대답하다, 응답하다 2. 반응하다","ex":[["My teacher asked a question in class, but no one [responded].","수업 중에 선생님이 질문 하나를 하셨는데 누구도 대답하지 않았다."],["I don’t know how I should [respond] to the news.","나는 그 소식에 어떻게 반응해야 할지 모르겠다."]]},{"u":2,"n":50,"w":"refer","m":"1. 언급하다 2. 가리키다, 나타내다 3. 참조하다, 참고하다","ex":[["If you [refer] to the matter again, she will get mad.","네가 그 일에 대해 다시 언급하면 그녀는 화낼 것이다."],["The UK was once [referred] to as the British Empire.","영국은 한때 대영제국으로 불렸다."],["The term ‘Aussie’ [refers] to a person from Australia.","‘Aussie’라는 말은 호주 사람을 가리킨다."],["For additional information, please [refer] to our school website.","추가 정보는 학교 홈페이지를 참고하시기 바랍니다."]]},{"u":2,"n":51,"w":"react","m":"반응하다, 반응을 보이다","ex":[["Conservative people are highly likely to [react] negatively to change.","보수적인 사람들은 변화에 부정적으로 반응할가능성이 크다."]]},{"u":2,"n":52,"w":"reinforce","m":"강화하다, 보강하다","ex":[["You can [reinforce] your dog’s good behaviors by giving rewards.","보상을 줌으로써 개의 좋은 행동을 강화할 수 있다."]]},{"u":2,"n":53,"w":"export","m":"수출하다; 수출(품)","ex":[["Middle Eastern countries [export] oil to many countries.","중동 국가들은 많은 나라에 석유를 수출한다."],["Coffee is one of Brazil’s major [exports].","커피는 브라질의 주요 수출품들 중 하나이다."]]},{"u":2,"n":54,"w":"trace","m":"추적하다; 자취, 흔적","ex":[["We can [trace] a stolen car using the GPS.","우리는 GPS를 이용해 도난 차량을 추적할 수 있다."],["Police found no [trace] of the escaped prisoner.","경찰은 탈옥수에 대한 어떤 흔적도 찾지 못했다."]]},{"u":2,"n":55,"w":"retire","m":"은퇴하다, 퇴직하다; 물러나다","ex":[["After the professor [retired] from the college, he worked as a writer.","그 교수는 대학에서 은퇴한 후 작가로 일했다."]]},{"u":2,"n":56,"w":"organize","m":"1. (행사 등을) 준비하다 2. 정리하다, 체계화하다 3. (단체를) 조직하다","ex":[["The student council successfully [organized] the Halloween party.","학생회는 핼러윈 파티를 성공적으로 준비했다."],["My pictures are [organized] into folders by year.","내 사진들은 폴더에 연도별로 정리되어 있다."],["He [organized] a union to improve the rights of workers.","그는 노동자들의 권리를 향상하기 위한 조합을 조직했다."]]},{"u":2,"n":57,"w":"construct","m":"1. 건설하다 2. 구성하다","ex":[["This bridge was [constructed] in 1892, so it will soon be rebuilt.","이 다리는 1892년에 건설되어서, 곧 재건될 것이다."],["You should [construct] a logical argument to persuade others.","타인을 설득하기 위해서는 논리적인 주장을 구성해야 한다."],["The documentary is [constructed] from interviews with the victims of war.","그 다큐멘터리는 전쟁 피해자들과의 인터뷰들로 구성되어 있다."]]},{"u":2,"n":58,"w":"advertise","m":"광고하다","ex":[["If the product is targeted at young adults, we’d better [advertise] it on social media.","그 제품이 청년들을 겨냥한다면 소셜 미디어에 광고하는 것이 좋겠다."]]},{"u":2,"n":59,"w":"offend","m":"1. 불쾌하게 하다 2. (도덕 등에) 어긋나다; 위반하다","ex":[["Sometimes, what we say as a joke may [offend] others.","때때로 우리가 농담으로 하는 말이 다른 사람들을 불쾌하게 할 수 있다."],["His action [offended] against common sense.","그의 행동은 상식에 어긋났다."]]},{"u":2,"n":60,"w":"encounter","m":"1. 우연히 만나다 2. (위험 등에) 직면하다; (우연한) 만남","ex":[["If you [encounter] a snake while hiking, do not approach it.","만약 등산 중에 뱀을 우연히 만나게되면, 다가가지 마라."],["I [encountered] an unexpected problem at work.","나는 일하면서 예상치 못한 문제에 직면했다."]]},{"u":3,"n":61,"w":"structure","m":"1. 구조; 조직, 기구 2. 구조물, 건축물; 조직하다, 구조화하다","ex":[["A family is the most basic unit of social [structure].","가족은 사회 구조의 가장 기본적인 단위이다."],["The street is lined with steel and glass [structures].","그 길에는 강철과 유리 구조물이 늘어서 있다."]]},{"u":3,"n":62,"w":"category","m":"범주, 카테고리, 부문","ex":[["A prize medal will be given to the winners in each [category].","우승 메달은 각 부문의 우승자들에게 수여될 것이다."]]},{"u":3,"n":63,"w":"sort","m":"종류; 분류; 분류하다","ex":[["We saw all [sorts] of animals in the park.","우리는 모든 종류의 동물들을 공원에서 보았다."],["She [sorted] the books into alphabetical order.","그녀는 책들을 알파벳순으로 분류했다."]]},{"u":3,"n":64,"w":"quality","m":"1. 질(質) 2. 고급, 양질 3. 특성; 자질; 고급의, 양질의","ex":[["Keeping in good health is central to the [quality] of life.","건강을 유지하는 것은 삶의 질에 핵심이다."],["a [quality] of steel","강철의 특성"],["This store sells [quality] furniture at low prices.","이 상점은 고급 가구를 저렴한 가격에 판다."]]},{"u":3,"n":65,"w":"quantity","m":"1. 양, 수량 2. 다량, 다수","ex":[["Huge [quantities] of oil were spilling into the sea.","엄청난 양의 기름이 바다로 유출되고 있었다."],["It’s a lot cheaper if you buy things in [quantity].","물건을 다량으로 사면 훨씬 더 싸다."]]},{"u":3,"n":66,"w":"reason","m":"1. 이유; 근거 2. 이성, 판단력; 추론하다","ex":[["We’d like to know the [reason] why she didn’t come.","우리는 그녀가 오지 않은 이유를 알고 싶다."],["His decision is usually based on feeling, not [reason].","그의 결정은 보통 이성이 아닌 감정에 기초한다."]]},{"u":3,"n":67,"w":"period","m":"1. 기간, 시기; 시대 2. 마침표","ex":[["The [period] between Christmas and New Year’s Day is very busy.","크리스마스와 설날 사이의 기간은 매우 분주하다."],["I forgot to put a [period] at the end of the sentence.","나는 문장 끝에 마침표를 찍는 것을 잊었다."]]},{"u":3,"n":68,"w":"occasion","m":"1. (특정한) 때, 경우 2. (특별한) 행사, 의식","ex":[["This is an [occasion] for us all to make a new start.","지금이 우리 모두가 새로운 시작을 할 때이다."],["There was a special [occasion] for celebrating graduation.","졸업을 축하하기 위한 특별한 행사가 있었다."]]},{"u":3,"n":69,"w":"state","m":"1. 상태 2. 국가 3. (미국, 호주 등의) 주(州); (격식을 차려) 말하다, 서술하다","ex":[["We can guess emotional [states] from facial expressions.","우리는 표정에서 감정의 상태를 추측할 수 있다."],["a liberal democratic [state]","자유 민주주의 국가"],["The fifty stars in the American flag represent the fifty [states].","성조기(미국의 국기) 속 50개의 별은 50개의 주를 상징한다."],["The soccer player [stated] that he would leave the team.","그 축구 선수는 팀을 떠날 것이라고 말했다."]]},{"u":3,"n":70,"w":"circumstance","m":"상황, 환경; (일의) 전후 사정","ex":[["It is impossible under these [circumstances] to meet our deadline.","이러한 상황에서 기한을 맞추는 것은 불가능하다."]]},{"u":3,"n":71,"w":"device","m":"장치, 기구","ex":[["This [device] is able to warm up tiny spaces and doesn’t take much time.","이 장치는 작은 공간을 따뜻하게 할 수 있고 많은 시간이 들지 않는다."]]},{"u":3,"n":72,"w":"goods","m":"상품, 제품","ex":[["The store sells a variety of electrical [goods].","그 가게는 다양한 전자 제품을 판매한다."]]},{"u":3,"n":73,"w":"industry","m":"1. 산업, 공업 2. 근면, 부지런함","ex":[["The tourist [industry] is the center of the economy in Thailand.","관광 산업은 태국 경제의 중심이다."],["He believes that honesty and [industry] lead to success.","그는 정직과 근면이 성공으로 이어진다고 믿는다."]]},{"u":3,"n":74,"w":"labor / labour","m":"노동(력); (부지런히) 일하다","ex":[["The demand for skilled [labor] in the building industry is high.","건설업계에서 숙련된 노동력에 대한 수요가 높다."],["The farmers [laboured] all day in the field without a break.","농부들은 들판에서 쉬지 않고 온종일 (부지런히) 일했다."]]},{"u":3,"n":75,"w":"factor","m":"요인, 요소","ex":[["Poor planning was the main [factor] of the failure.","부실한 계획은 실패의 주요한 요인이었다."]]},{"u":3,"n":76,"w":"theory","m":"이론, 학설","ex":[["Scientists have different [theories] to explain the death of the dinosaurs.","과학자들은 공룡의 죽음을 설명하는 서로 다른 이론을 가지고 있다."]]},{"u":3,"n":77,"w":"context","m":"문맥, 맥락","ex":[["Knowing a word means you’re able to use it in [context].","단어를 안다는 것은 그것을 문맥에 맞게 사용할 수 있다는 것을 의미한다."]]},{"u":3,"n":78,"w":"impact","m":"1. 영향(력), 효과 2. 충격, 충돌; 영향을 주다","ex":[["A great book can have a huge [impact] on our spirit and life.","훌륭한 책은 우리의 정신과 삶에 커다란 영향을 미칠 수 있다."],["A bomb exploded on [impact] when it hit the ground.","폭탄이 땅에 부딪혔을 때 충격으로 폭발했다."]]},{"u":3,"n":79,"w":"climate","m":"1. 기후 2. 분위기, 풍조","ex":[["These trees only grow in cold [climates].","이 나무들은 추운 기후에서만 자란다."],["The work of the artist shows the social [climate] of that time.","그 예술가의 작품은 그 당시의 사회적 분위기를 보여준다."]]},{"u":3,"n":80,"w":"crisis","m":"위기; 중대한 기로","ex":[["Several solutions were proposed to solve the financial [crisis].","금융 위기를 해결하기 위해 여러 해결책이 제안되었다."]]},{"u":3,"n":81,"w":"nature","m":"1. 자연 2. 본성, 천성; 본질","ex":[["I appreciated the beauty of [nature] from the mountain peak.","나는 산 정상에서 자연의 아름다움을 감상했다."],["It is human [nature] to seek pleasure and avoid pain.","즐거움을 추구하고 고통을 피하는 것은 인간의 본성이다."]]},{"u":3,"n":82,"w":"decade","m":"10년, 10년간","ex":[["Some rare flowers take a [decade] to bloom.","어떤 희귀한 꽃들은 피어나는 데 10년이 걸린다."]]},{"u":3,"n":83,"w":"symptom","m":"1. 증상 2. 징후, 조짐","ex":[["Early [symptoms] of malaria can include shaking chills, headache, muscle aches, and tiredness.","말라리아의 초기 증상은 오한, 두통, 근육통 그리고 피로감을 포함할 수 있다."]]},{"u":3,"n":84,"w":"priority","m":"우선 사항, 더 중요한 것; (시간, 순서가) 먼저임","ex":[["List your tasks in order of [priority] and finish them one by one.","네가 할 일을 우선순위에 따라 나열하고 차례차례 마무리해라."]]},{"u":3,"n":85,"w":"minority","m":"1. 소수; 소수파 2. 소수 민족, 소수 집단","ex":[["Only a [minority] of people found the movie enjoyable.","오직 소수의 사람들만이 그 영화가 재미있다고 여겼다."],["[Minorities] often face prejudice because of their ethnic background.","소수 민족은 그들의 민족적 배경 때문에 종종 편견을 마주한다."]]},{"u":3,"n":86,"w":"purpose","m":"목적; 의도","ex":[["Sharing a common [purpose] in a company improves teamwork.","회사에서 공동의 목적을 공유하는 것은 팀워크를 향상시킨다."]]},{"u":3,"n":87,"w":"resolution","m":"1. 결심, 결의(안) 2. (문제의) 해결","ex":[["My New Year’s [resolution] is to get more exercise.","나의 새해 결심은 운동을 더 하는 것이다."],["We need to find a speedy [resolution] to the dispute.","우리는 그 분쟁에 대한 신속한 해결이 필요하다."]]},{"u":3,"n":88,"w":"scent","m":"냄새, 향기","ex":[["The dog would follow a familiar [scent].","그 개는 친숙한 냄새를 따라가곤 했다."]]},{"u":3,"n":89,"w":"favor / favour","m":"1. 호의, 친절 2. 지지, 찬성; 1. 호의를 보이다 2. 지지하다, 찬성하다","ex":[["Someday you will be paid back for a [favor] done long ago.","언젠가 너는 오래전에 베푼 호의에 대한 보답을 받을 것이다."],["My ideas have gained [favor] with my classmates.","내 아이디어들은 우리 반 친구들의 지지를 받았다."]]},{"u":3,"n":90,"w":"fever","m":"1. 열, 발열 2. 열기","ex":[["A high [fever] can cause damage to vital organs.","높은 열은 중요한 장기에 손상을 입힐 수 있다."],["election [fever]","선거 열기"]]},{"u":4,"n":91,"w":"symbol","m":"1. 상징(물) 2. 기호, 부호","ex":[["A heart shape is the [symbol] of love.","하트 모양은 사랑의 상징이다."],["“Fe” is the [symbol] for iron.","‘Fe’는 철을 나타내는 기호이다."]]},{"u":4,"n":92,"w":"freedom","m":"자유, 자유로운 상태","ex":[["My school gives students [freedom] of choice about what to learn.","우리 학교는 학생들에게 무엇을 배울지에 대한 선택의 자유를 준다."]]},{"u":4,"n":93,"w":"rest","m":"1. (어떤 것의) 나머지 2. 휴식; 쉬다, 휴식을 취하다","ex":[["He lived in the country for the [rest] of his life.","그는 나머지 생애 동안 시골에서 살았다."],["You’d better stop driving and take a little [rest].","너는 운전을 그만하고 약간의 휴식을 취하는 게 좋겠다."],["We [rested] for a while under the shade.","우리는 그늘에서 잠시 휴식을 취했다."]]},{"u":4,"n":94,"w":"award","m":"상(금); 수여하다, 주다","ex":[["The [award] is given to the best student every year.","그 상은 매년 최우수 학생에게 수여된다."]]},{"u":4,"n":95,"w":"reward","m":"보상(금); 보상하다","ex":[["The winner gets a large [reward].","우승자는 큰 보상을 받는다."],["If you keep trying, you will be [rewarded] one day.","계속해서 노력한다면, 너는 언젠가 보상받을 것이다."]]},{"u":4,"n":96,"w":"instance","m":"경우, 사례","ex":[["In most [instances] the disease can be controlled by medicine.","대부분의 경우에 그 질병은 약으로 억제될 수 있다."]]},{"u":4,"n":97,"w":"sequence","m":"1. (일련의) 연속 2. 순서, 차례","ex":[["Romantic movies usually have a common [sequence] of events.","로맨스 영화에는 보통 공통된 연속 사건들이 있다."],["Write down the numbers in [sequence].","순서대로 숫자를 적어라."]]},{"u":4,"n":98,"w":"vision","m":"1. 시력; 시야 2. 선견지명, 통찰력","ex":[["I have worse [vision] in my left eye than in my right.","나는 오른쪽 눈보다 왼쪽 눈의 시력이 더 안 좋다."],["Many companies require a leader with [vision].","많은 회사가 선견지명을 가진 지도자를 필요로 한다."]]},{"u":4,"n":99,"w":"expert","m":"전문가; 전문가의, 전문적인; 능숙한, 숙련된","ex":[["He is an [expert] in computers.","그는 컴퓨터 전문가이다."],["an [expert] mechanic","숙련된 정비공"]]},{"u":4,"n":100,"w":"potential","m":"잠재력, 가능성; 잠재적인; 가능성 있는","ex":[["He showed his full [potential] in the marathon in Berlin and broke the world record.","그는 베를린의 마라톤 경주에서 자신의 잠재력을 최대한 발휘했고 세계 기록을 깼다."],["CEOs must care about both existing and [potential] customers.","CEO들은 기존 고객과 잠재적인고객 모두에게 신경을 써야 한다."]]},{"u":4,"n":101,"w":"risk","m":"위험(성); 모험; 위태롭게 하다","ex":[["Motorcycle accidents carry a relatively high [risk] of death.","오토바이 사고는 상대적으로 높은 사망 위험을 수반한다."],["Some journalists [risk] their lives to report the truth.","어떤 기자들은 진실을 알리기 위해 자신의 생명을 위태롭게 한다."]]},{"u":4,"n":102,"w":"expense","m":"비용, 지출; 경비","ex":[["We can go on holiday at very little [expense].","우리는 아주 적은 비용으로 휴가를 보낼 수 있다."]]},{"u":4,"n":103,"w":"crash","m":"충돌; 추락; 충돌하다; (비행기가) 추락하다","ex":[["Airbags protect drivers from injury in car [crashes].","에어백은 자동차 충돌로 인한 부상으로부터 운전자를 보호한다."],["The plane [crashed] into the field.","그 비행기는 들판에 추락했다."]]},{"u":4,"n":104,"w":"victim","m":"(전쟁, 사고 등의) 피해자, 희생자","ex":[["[victims] of the earthquake","지진 피해자들"]]},{"u":4,"n":105,"w":"fault","m":"1. 잘못 2. (과실의) 책임 3. 단점, 결점; 결함","ex":[["It’s your own [fault] you missed the chance.","그 기회를 놓친 것은 너 자신의 잘못이다."],["The driver drove too fast and was at [fault] for the accident.","그 운전자는 과속했고 그 사고에 책임이 있었다."],["We discussed the book’s strengths and [faults].","우리는 그 책의 장점과 단점에 대해 토론했다."]]},{"u":4,"n":106,"w":"boundary","m":"1. 경계(선) 2. 한계, 한도","ex":[["The tree forms the [boundary] between my house and my neighbor’s.","그 나무는 우리 집과 이웃집 사이의 경계를 형성한다."],["the [boundaries] of our imagination","상상력의 한계"]]},{"u":4,"n":107,"w":"depth","m":"깊이; 심도","ex":[["The average [depth] of the Indian Ocean is about 3,000 meters.","인도양의 평균 깊이는 약 3,000미터이다."],["The pool is 12 feet in [depth].","그 수영장은 12피트 깊이이다."]]},{"u":4,"n":108,"w":"surface","m":"1. 표면; 수면, 지면 2. 겉, 외관; 1. (수면으로) 떠오르다 2. (겉으로) 드러나다, 표면화되다","ex":[["The [surface] of the road was slippery due to the heavy snow.","도로의 표면이 폭설로 인해 미끄러웠다."],["The hidden evidence began to [surface].","숨겨진 증거가 드러나기 시작했다."]]},{"u":4,"n":109,"w":"row","m":"(늘어서 있는) 줄, 열; (배를 노로) 젓다","ex":[["Family photos were hung on the wall in a [row].","가족사진들이 벽에 줄을 지어 걸려 있었다."],["Children were [rowing] boats up and down the river.","아이들이 강을 오르락내리락하며 배를 젓고 있었다."]]},{"u":4,"n":110,"w":"horror","m":"공포(감)","ex":[["The crowd watched in [horror] as the fire grew.","사람들은 공포에 질린 채 불이 번져가는 것을 지켜보았다."]]},{"u":4,"n":111,"w":"curiosity","m":"호기심","ex":[["My brother’s natural [curiosity] led him to ask more questions.","내 남동생의 타고난 호기심이 그가 질문을 더 많이 하게 했다."]]},{"u":4,"n":112,"w":"novel","m":"(장편) 소설; 새로운, 신기한","ex":[["I like the [novels] of Jane Austen the most.","나는 Jane Austen의 소설들을가장 좋아한다."],["You need a [novel] way to approach the issue.","너는 그 문제에 접근할 새로운 방법이 필요하다."]]},{"u":4,"n":113,"w":"delight","m":"기쁨, 즐거움; 기쁘게 하다","ex":[["It was such an unexpected [delight] to see her standing there.","그녀가 그곳에 서 있는 것을 본 것은 예상치 못한 기쁨이었다."]]},{"u":4,"n":114,"w":"sympathy","m":"1. 동정, 연민 2. 동조, 지지","ex":[["The judges had no [sympathy] for the criminal.","판사들은 그 범죄자를 동정하지 않았다."],["Mom had [sympathy] for my opinion.","엄마는 내 의견에 동조하셨다."]]},{"u":4,"n":115,"w":"loyalty","m":"충실, 충성; 충성심","ex":[["He declared his [loyalty] to the new king.","그는 새 왕에 대한 충성심을 표명했다."]]},{"u":4,"n":116,"w":"welfare","m":"행복, 안녕(安寧); 복지","ex":[["Doctors should pay attention to the health and [welfare] of their patients.","의사들은 환자들의 건강과 안녕에 주의를 기울여야 한다."]]},{"u":4,"n":117,"w":"policy","m":"1. 정책, 방침 2. 방책, 수단","ex":[["a housing [policy]","주택 정책"],["Honesty is the best [policy].","정직함이 최선의 방책이다."]]},{"u":4,"n":118,"w":"neighborhood","m":"근처, 인근; 이웃 사람들","ex":[["They walked around the [neighborhood] every day.","그들은 매일 근처를 산책했다."]]},{"u":4,"n":119,"w":"companion","m":"1. 친구; 동료 2. 동반자; 동행","ex":[["She is a pleasant [companion] who cheers me up.","그녀는 나를 기운 나게 해주는 유쾌한 친구이다."],["a travel [companion]","여행의 동반자"]]},{"u":4,"n":120,"w":"opponent","m":"(대회 등의) 상대; 반대자","ex":[["The champion knocked his [opponent] out in the first round.","그 챔피언은 1라운드에서 상대를 쓰러뜨렸다."]]},{"u":5,"n":121,"w":"available","m":"1. 이용할 수 있는, 구할 수 있는 2. (만날) 시간이 있는","ex":[["Wireless Internet is [available] at the cafe.","무선 인터넷은 카페에서 이용할 수 있다."],["Will you be [available] this afternoon?","오늘 오후에 시간이 있니?"]]},{"u":5,"n":122,"w":"practical","m":"실용적인; 현실적인","ex":[["This book shows various [practical] ways to save money.","이 책은 돈을 절약할 수 있는 여러 가지 실용적인 방법을 제시한다."]]},{"u":5,"n":123,"w":"average","m":"1. 평균의 2. 보통의, 일반적인; 1. 평균 2. 보통","ex":[["The [average] age of the town is over fifty.","그 마을의 평균연령은 50세가 넘는다."],["The restaurant’s food was [average], but its service was good.","그 식당의 음식은 보통이었지만 서비스는 좋았다."],["On [average], dogs sleep between twelve and fourteen hours per day.","평균적으로, 개들은 하루에 12시간에서 14시간을 잔다."]]},{"u":5,"n":124,"w":"alike","m":"비슷한; 비슷하게; 동등하게","ex":[["John and his dad are [alike] in their appearance.","John과 그의 아버지는 생김새가 비슷하다."],["Treat everyone [alike].","모두를 동등하게대해라."]]},{"u":5,"n":125,"w":"previous","m":"이전의","ex":[["The [previous] owner of this house planted the tree.","이 집의 이전 주인이 그 나무를 심었다."]]},{"u":5,"n":126,"w":"former","m":"1. 예전의, 과거의 2. (둘 중에) 먼저의, 전자의; ((the -)) 전자","ex":[["The [former] name of Seoul was Hanyang.","서울의 예전[옛] 이름은 한양이었다."],["the [former] president","전 대통령"],["Of the two options, the [former] is the most widely accepted.","그 두 가지 선택권 중에, 전자가 가장 널리 인정된다."]]},{"u":5,"n":127,"w":"absent","m":"1. 결석한; 없는, 부재의 2. 멍한","ex":[["Her daughter was [absent] from school yesterday because of a cold.","그녀의 딸은 어제 감기로 인해 학교에 결석했다."],["The boy had an [absent] look on his face.","그 소년은 멍한 표정을 지었다."]]},{"u":5,"n":128,"w":"familiar","m":"익숙한, 친숙한","ex":[["We usually feel at ease in [familiar] surroundings.","우리는 보통 익숙한 환경에서 편안함을 느낀다."]]},{"u":5,"n":129,"w":"obvious","m":"분명한, 명백한","ex":[["It was [obvious] from her tone that she didn’t like me.","그녀의 말투에서 볼 때 그녀가 나를 좋아하지 않는 것이 분명했다."],["Longer droughts are [obvious] evidence of climate change.","길어진 가뭄은 기후 변화의 명백한증거이다."]]},{"u":5,"n":130,"w":"exact","m":"정확한; 정밀한","ex":[["The bus runs on an [exact] schedule.","그 버스는 정확한 운행 시간표대로 운행한다."]]},{"u":5,"n":131,"w":"aware","m":"알고 있는, 알아차린","ex":[["I was [aware] that something was wrong but had no solution.","나는 무언가 잘못되었다는 걸 알고 있었지만, 해결책이 없었다."]]},{"u":5,"n":132,"w":"notable","m":"1. 주목할 만한, 눈에 띄는 2. 유명한","ex":[["The large fireplace is a [notable] feature of our house.","커다란 벽난로가 우리 집의 눈에 띄는특징이다."],["The beach is [notable] for its beautiful sunset.","그 해변은 아름다운 일몰로 유명하다."]]},{"u":5,"n":133,"w":"odd","m":"1. 이상한 2. 홀수의 3. 짝이 맞지 않는","ex":[["My dog’s behavior was [odd], so I thought someone might be outside.","우리 강아지의 행동이 이상해서, 나는 누군가가 밖에 있을지도 모른다고 생각했다."],["The singing contest is held on [odd] years.","그 노래 경연 대회는 홀수 해마다 개최된다."],["My son is wearing [odd] shoes.","내 아들은 짝이 맞지 않는 신발을 신고 있다."]]},{"u":5,"n":134,"w":"due","m":"1. ~로 인한, ~ 때문에 2. ~하기로 예정된 3. (돈을) 지불해야 하는","ex":[["The flight was delayed [due] to a snowstorm.","그 비행기는 눈보라 때문에 지연되었다."],["The game is [due] to start in 10 minutes.","경기가 10분 후에 시작할 예정이다."],["The money I borrowed from the bank is [due] today.","내가 은행에서 빌린 돈은 오늘까지 지불해야 한다."]]},{"u":5,"n":135,"w":"annual","m":"1. 연례의, 매년의 2. 연간의, 한 해의","ex":[["Busan International Film Festival has been an [annual] event since 1996.","부산 국제 영화제는 1996년부터 이어진 연례행사이다."],["The [annual] rainfall in California is very low.","캘리포니아의 연간 강우량은 매우 적다."]]},{"u":5,"n":136,"w":"urgent","m":"긴급한; 다급한, 절박한","ex":[["It was a very [urgent] situation when our school was on fire.","우리 학교에 화재가 발생했을 때는 굉장히 긴급한 상황이었다."]]},{"u":5,"n":137,"w":"likely","m":"~할 것 같은; 가능성 있는","ex":[["It is [likely] to rain soon.","곧 비가 올 것 같다."],["the most [likely] candidate for prime minister","가장 가능성 있는국무총리 후보"]]},{"u":5,"n":138,"w":"capable","m":"1. ~할 수 있는 2. 유능한","ex":[["My aunt is [capable] of cooking many different kinds of soup.","우리 이모는 여러 종류의 수프를 요리할 수 있다."],["Jay is a very [capable] engineer.","Jay는 아주 유능한 엔지니어이다."]]},{"u":5,"n":139,"w":"eager","m":"간절히 바라는; 열성적인","ex":[["Kids are [eager] to get presents from Santa Claus.","아이들은 산타클로스로부터 선물을 받기를 간절히 바란다."]]},{"u":5,"n":140,"w":"firm","m":"1. 딱딱한, 단단한 2. 단호한, 확고한; 회사","ex":[["I don’t prefer a [firm] mattress.","나는 딱딱한 매트리스를 선호하지 않는다."],["Parents must be [firm] with their children’s mistakes.","부모는 자식의 잘못에 단호해야 한다."],["Clara started her first job at a small [firm].","Clara는 자신의 첫 직업을 작은 회사에서 시작했다."]]},{"u":5,"n":141,"w":"stable","m":"안정된; 차분한","ex":[["Children need to be raised in a [stable] environment.","아이들은 안정된 환경에서 양육되어야 한다."]]},{"u":5,"n":142,"w":"mature","m":"성숙한; 다 자란, (과일 등이) 익은","ex":[["It was very [mature] of him to apologize first.","먼저 사과하는 것을 보니 그는 매우 성숙했다."],["The grapes are almost [mature].","포도가 거의 익었다."]]},{"u":5,"n":143,"w":"mortal","m":"1. 영원히 살 수 없는 2. 치명적인","ex":[["All living creatures, including humans, are [mortal].","인간을 포함해 모든 살아있는 생물은 영원히 살 수 없다."]]},{"u":5,"n":144,"w":"deadly","m":"1. 치명적인 2. 완전한; 극도의","ex":[["His injury was nearly [deadly], but he recovered fully.","그의 부상은 거의 치명적이었지만, 그는 완전히 회복했다."],["a [deadly] silence","완전한 침묵"]]},{"u":5,"n":145,"w":"strict","m":"엄격한; 엄밀한","ex":[["Airlines put [strict] limits on the weight of luggage.","항공사들은 수하물 무게에 엄격한 제한을 둔다."]]},{"u":5,"n":146,"w":"grateful","m":"감사하는, 고맙게 여기는","ex":[["She was [grateful] to him for helping her sister.","그녀는 자신의 여동생을 도와준 것에 대해 그에게 감사했다."]]},{"u":5,"n":147,"w":"intimate","m":"친밀한, 절친한","ex":[["Olivia and her classmates became [intimate] friends.","Olivia와 동급생들은 절친한 친구가 되었다."]]},{"u":5,"n":148,"w":"terrific","m":"1. 아주 좋은, 훌륭한 2. (양, 정도가) 엄청난","ex":[["I always feel [terrific] after working out.","나는 운동을 한 후에 항상 기분이 아주 좋다."],["at a [terrific] speed","엄청난 속도로"]]},{"u":5,"n":149,"w":"incredible","m":"믿을 수 없는, 놀라운","ex":[["He told an [incredible] story of survival in the desert.","그는 사막에서 살아남은 믿을 수 없는 이야기를 했다."]]},{"u":5,"n":150,"w":"fancy","m":"1. 화려한, 장식이 많은 2. 값비싼; 일류의; 공상","ex":[["The [fancy] dress was made from waste paper.","그 화려한 드레스는 폐지로 만들어졌다."],["I don’t usually visit [fancy] restaurants.","나는 평소에 값비싼 레스토랑에 가지 않는다."],["It was just the [fancy] of a young man.","그것은 단지 젊은이의 공상이었다."]]},{"u":6,"n":151,"w":"entire","m":"전체의; 완전한, 온전한","ex":[["The [entire] village was destroyed by a strong earthquake.","강한 지진으로 마을 전체가 파괴되었다."],["He bought an [entire] set of blocks for his child.","그는 자신의 아이를 위해 완전한 블록 세트 하나를 구입했다."]]},{"u":6,"n":152,"w":"broad","m":"1. (폭)넓은 2. 전반적인, 대체적인","ex":[["a [broad] river","넓은 강"],["The writer had [broad] experience with history.","그 작가는 역사에 대해 폭넓은 경험을 가졌다."],["They made a [broad] agreement on a vacation plan.","그들은 휴가 계획에 대해 전반적인 합의를 했다."]]},{"u":6,"n":153,"w":"brief","m":"1. (시간이) 짧은, 잠시 동안의 2. (말, 글이) 간단한","ex":[["She only worked there for a [brief] period of time.","그녀는 그곳에서 짧은 기간 동안만 일했다."],["The teacher gave me a [brief] explanation of my question.","선생님은 내 질문에 대해 간단한 설명을 해주셨다."]]},{"u":6,"n":154,"w":"temporary","m":"일시적인, 순간의; 임시의","ex":[["Eating spicy food can cause [temporary] stomach pain.","매운 음식을 먹는 것은 일시적인 복통을 유발할 수 있다."],["He had to hire some [temporary] workers to meet the deadline.","그는 마감일을 맞추기 위해 임시 직원을 몇 명 고용해야 했다."]]},{"u":6,"n":155,"w":"frequent","m":"자주 일어나는, 빈번한","ex":[["She is a [frequent] visitor to this hotel.","그녀는 이 호텔에 자주 오는 손님이다."]]},{"u":6,"n":156,"w":"random","m":"무작위의, 임의로 하는","ex":[["The teacher had his students present their research in a [random] order.","선생님은 무작위 순서로 학생들이 조사한 것을 발표하게 하셨다."]]},{"u":6,"n":157,"w":"infinite","m":"무한한, 무한정의","ex":[["Creativity is [infinite] and without borders.","창의력은 무한하고 한계가 없다."]]},{"u":6,"n":158,"w":"initial","m":"처음의; (이름 등의) 머리글자, 첫 글자","ex":[["My [initial] reaction to his suggestion was excitement.","그의 제안에 대한 나의 처음의 반응은 흥분이었다."],["Your name is Minji Kim, so your [initials] are MK.","너의 이름이 김민지이므로 머리글자는 MK이다."]]},{"u":6,"n":159,"w":"valuable","m":"1. 소중한, 귀중한 2. 값비싼","ex":[["Kids can get [valuable] experience from having animal companions.","아이들은 반려동물을 키움으로써 소중한 경험을 얻을 수 있다."],["a [valuable] necklace","값비싼 목걸이"]]},{"u":6,"n":160,"w":"cautious","m":"조심하는, 신중한","ex":[["I’m trying to be [cautious] so that I don’t make the same mistake again.","나는 같은 실수를 다시 하지 않도록 조심하려고 노력하고 있다."]]},{"u":6,"n":161,"w":"consistent","m":"1. 일관된, 한결같은 2. 일치하는","ex":[["Tori is always [consistent] in her behaviors.","Tori는 자신의 행동에 있어서 언제나 한결같다."],["This finding is [consistent] with previous survey results.","이 결과는 이전의 설문 결과와 일치한다."]]},{"u":6,"n":162,"w":"efficient","m":"효율적인, 능률적인","ex":[["Smaller cars are more [efficient] when burning fuel.","작은 차일수록 연료 소비에 있어 더 효율적이다."]]},{"u":6,"n":163,"w":"suitable","m":"적합한, 어울리는","ex":[["Ashley chose a [suitable] topic for her research.","Ashley는 자신의 연구에 적합한 주제를 골랐다."]]},{"u":6,"n":164,"w":"absolute","m":"1. 완전한 2. 절대적인","ex":[["Her last movie was an [absolute] success.","그녀의 지난번 영화는 완전한 성공이었다."],["Kings used to have [absolute] power over their people.","왕들은 국민들에 대해 절대적인권력을 가지곤 했다."]]},{"u":6,"n":165,"w":"adequate","m":"충분한, 적절한","ex":[["The house was small, but it was [adequate] to live alone in.","그 집은 작았지만 혼자 살기에는 충분했다."]]},{"u":6,"n":166,"w":"intermediate","m":"1. 중간의 2. 중급의; 중급자","ex":[["The development of the new drug is now an at an [intermediate] stage.","새로운 약의 개발은 이제 중간 단계에 있다."],["You’d better take an [intermediate] class, not an advanced one.","너는 고급 수업이 아니라 중급 수업을 듣는 게 좋겠다."]]},{"u":6,"n":167,"w":"precious","m":"1. 귀중한, 값비싼 2. 소중한","ex":[["This ring has several [precious] jewels, so it should be handled carefully.","이 반지는 여러 값비싼 보석들이 박혀 있어서, 조심히 다뤄져야 한다."],["Traveling with my best friends is my most [precious] memory.","가장 친한 친구들과의 여행은 나의 가장 소중한 기억이다."]]},{"u":6,"n":168,"w":"major","m":"주된, 중요한; 전공; 전공하다","ex":[["The tourism industry is a [major] source of income in Italy.","관광 산업은 이탈리아의 주된 수입원이다."],["My [major] is psychology.","나의 전공은 심리학이다."],["She [majored] in English and minored in politics in college.","그녀는 대학에서 영어를 전공했고정치학을 부전공했다."]]},{"u":6,"n":169,"w":"corporate","m":"1. 기업의, 회사의; 법인의 2. 공동의","ex":[["Our [corporate] headquarters are located in Paris.","우리 회사의 본사는 파리에 있다."],["[corporate] responsibility","공동의 책임"]]},{"u":6,"n":170,"w":"private","m":"개인 소유의; 사적인","ex":[["It’s [private] land, so you can’t park here without permission.","여기는 개인 소유의 땅이기 때문에 허가 없이 주차하실 수 없습니다."]]},{"u":6,"n":171,"w":"urban","m":"도시의","ex":[["Heavy traffic is one of the most common [urban] issues.","많은 교통량은 가장 흔한 도시의 문제점들 중 하나이다."]]},{"u":6,"n":172,"w":"contrary","m":"(~와는) 반대되는; 반대","ex":[["[Contrary] to popular belief, wild monkeys don’t like bananas.","일반적인 생각과는 반대로, 야생 원숭이들은 바나나를 좋아하지 않는다."],["If you have a [contrary] opinion, state it clearly.","반대되는 의견을 가지고 있다면, 그것을 분명하게 말하라."],["I thought she was angry. But, on the [contrary], she was calm.","난 그녀가 화났을 것이라고 생각했다. 그러나 그와는 반대로, 그녀는 침착했다."]]},{"u":6,"n":173,"w":"single","m":"1. 단 하나의; 1인용의 2. 독신인; 미혼의","ex":[["A [single] flower remained after the heavy rain.","폭우 뒤에 꽃 한 송이만이 남아 있었다."],["The apartments are good for [single] people living alone.","그 아파트는 혼자 사는 독신인 사람들에게 좋다."]]},{"u":6,"n":174,"w":"solo","m":"1. 혼자서 하는, 단독의 2. 독주의; 독주(곡), 독창(곡)","ex":[["That was her first [solo] drive.","그것은 그녀가 처음으로 혼자서 하는 운전이었다."],["A famous pianist will hold a [solo] concert here next month.","한 유명 피아니스트가 다음 달에 이곳에서 독주회를 개최할 것이다."]]},{"u":6,"n":175,"w":"equal","m":"1. 동일한 2. 평등한; 대등한 것[사람]; 같다, 필적하다","ex":[["My mom cut the cake into small pieces of [equal] size.","엄마는 케이크를 동일한 크기의 작은 조각들로 자르셨다."],["[equal] rights","평등한 권리"],["Few people can [equal] her in that field.","그 분야에서 그녀에게 필적할 수 있는 사람은 거의 없다."]]},{"u":6,"n":176,"w":"conservative","m":"보수적인; 보수주의의","ex":[["Wilson is so [conservative] that he rarely accepts any change.","Wilson씨는 너무 보수적이어서 어떠한 변화도 좀처럼 받아들이지 않는다."],["The [conservative] and liberal parties have opposing views.","보수당과 진보당은 상반된 견해를 가지고 있다."]]},{"u":6,"n":177,"w":"classic","m":"1. 일류의, 최고의 2. 전형적인 3. (스타일이) 고전적인, 유행을 안 타는; 1. 고전, 명작 2. 전형적인 것","ex":[["The Great Gatsby is one of the most [classic] pieces of American literature.","‘위대한 개츠비’는 미국 문학 최고의 작품 중 하나이다."],["She was showing [classic] symptoms of food poisoning.","그녀는 식중독의 전형적인 증상을 보이고 있었다."],["Wear [classic] clothes which feel good and look good.","감촉도 좋고 보기에도 좋은 유행을 안 타는 옷을 입어라."]]},{"u":6,"n":178,"w":"typical","m":"전형적인, 대표적인","ex":[["If you dress like this, you will look like a [typical] tourist.","옷을 이렇게 입으면, 너는 전형적인 관광객처럼 보일 거야."]]},{"u":6,"n":179,"w":"unique","m":"1. 독특한; 유일무이한 2. 고유의, 특유의","ex":[["Her [unique] style of writing attracted many readers.","그녀의독특한 글쓰기 기법은 많은 독자를 끌어들였다."],["A zebra has a [unique] pattern of black stripes on its body.","얼룩말은 몸에 고유의 검은색 줄무늬가 있다."]]},{"u":6,"n":180,"w":"particular","m":"1. 특정한 2. 특별한, 각별한","ex":[["Alex only wears a [particular] brand of clothes.","Alex는 특정한 브랜드의 옷만 입는다."],["He recommended [particular] attention to fires caused by dry weather.","그는 건조한 날씨로 인한 화재에 특별한 주의를 기울일 것을 권고했다."]]},{"u":7,"n":181,"w":"behave","m":"1. 행동하다 2. 예의 바르게 행동하다","ex":[["Don’t [behave] like a child.","아이처럼 행동하지 마라."],["My father is always telling me to [behave] when I go out.","우리 아버지는 항상 나에게 밖에 나가면 예의 바르게 행동하라고 말씀하신다."]]},{"u":7,"n":182,"w":"approach","m":"다가오다[가다], 접근하다; 접근(법)","ex":[["We saw the train [approaching] and hurried to the platform.","우리는 기차가 다가오고 있는 것을 보고 승강장으로 서둘러 갔다."],["Curiosity makes us try new [approaches] to solving problems.","호기심은 우리가 문제를 해결하는 데 새로운 접근법을 시도해 보도록 만든다."]]},{"u":7,"n":183,"w":"transfer","m":"1. 이동하다; 전학하다 2. 환승하다, 갈아타다; 1. 이동; 전학 2. 환승","ex":[["We should [transfer] to another classroom for music class.","우리는 음악 시간에 다른 교실로 이동해야 한다."],["You should [transfer] to line number 4 at Dongdaemun Station.","너는 동대문역에서 4호선으로 환승해야 한다."]]},{"u":7,"n":184,"w":"sink","m":"가라앉다, 가라앉히다; 싱크대, 개수대","ex":[["The boat [sank] to the bottom of the sea.","그 보트는 바다 밑으로 가라앉았다."],["a kitchen [sink]","부엌 싱크대"]]},{"u":7,"n":185,"w":"swing","m":"(앞뒤, 좌우로) 흔들다, 흔들리다; 1. 흔들림 2. 그네","ex":[["She was sitting in the chair and [swinging] her legs.","그녀는 의자에 앉아 다리를 흔들고 있었다."],["There are two [swings] on the playground.","놀이터에 그네 두 개가 있다."]]},{"u":7,"n":186,"w":"bounce","m":"튀어 오르다, 튀다; 뛰어 오르다","ex":[["The ball [bounced] into the air.","공이 공중으로 튀어 올랐다."]]},{"u":7,"n":187,"w":"burst","m":"1. 터지다, 파열하다 2. 갑자기 ~하다; 파열, 폭발","ex":[["Water pipes under the sink [burst] and water covered the floor.","싱크대 아래의 수도관이 터지고 물이 바닥을 뒤덮었다."],["As soon as Jane saw her mom, she [burst] into tears.","Jane은 엄마를 보자마자 눈물을 갑자기 터트렸다."]]},{"u":7,"n":188,"w":"slip","m":"미끄러지다; 1. 미끄러짐 2. (작은) 실수","ex":[["A little girl [slipped] on the ice.","한 어린 소녀가 얼음 위에서 미끄러졌다."],["The singer performed very well without making a single [slip].","그 가수는 (작은) 실수 하나 없이 굉장히 공연을 잘했다."]]},{"u":7,"n":189,"w":"drag","m":"(질질) 끌다, 끌리다; 끌기","ex":[["He was [dragging] his leg because of the injury.","그는 부상 때문에 다리를 (질질) 끌고 있었다."]]},{"u":7,"n":190,"w":"bend","m":"굽히다, 구부러지다","ex":[["[Bend] your knees when you lift heavy things.","무거운 것을 들어 올릴 때는 무릎을 굽혀라."]]},{"u":7,"n":191,"w":"attach","m":"붙이다, 첨부하다","ex":[["My boyfriend [attached] his picture to a letter and sent it to me.","내 남자친구는 자신의 사진을 편지에 붙여서 나에게 보냈다."]]},{"u":7,"n":192,"w":"capture","m":"1. 붙잡다 2. (관심을) 사로잡다 3. (사진 등으로) 담아내다; 캡처하다; 1. 포획 2. 캡처","ex":[["The police [captured] the thief.","경찰은 그 도둑을 붙잡았다."],["The singer [captured] the interest of teenagers.","그 가수는 십 대들의 관심을 사로잡았다."],["All of today’s events were [captured] on my camera.","오늘의 모든 행사는 내 카메라에 담겨 있었다."]]},{"u":7,"n":193,"w":"pack","m":"(짐을) 싸다; (물건을) 포장하다; 포장 꾸러미; 배낭","ex":[["I [packed] my clothes in a suitcase for the trip.","나는 여행을 위해 여행 가방에 옷을 쌌다."],["Can you [pack] the remaining food?","남은 음식을 포장해 줄 수 있니?"]]},{"u":7,"n":194,"w":"wrap","m":"포장하다, 싸다; 포장지","ex":[["Could you [wrap] up this gift for me?","이 선물 좀 포장해 주시겠어요?"]]},{"u":7,"n":195,"w":"fold","m":"1. (종이나 천 등을) 접다 2. 감싸다","ex":[["He [folded] the paper in half and put it in his bag.","그는 그 종이를 반으로 접어 자신의 가방에 넣었다."],["She [folded] a handkerchief around her neck.","그녀는 손수건으로 자신의 목을 감쌌다."]]},{"u":7,"n":196,"w":"twist","m":"1. 비틀다, 구부리다 2. (사실을) 왜곡하다; 1. 비틀기 2. (예상 밖의) 전개, 전환","ex":[["He [twisted] the wire into the shape of a star.","그가 철사를 구부려 별 모양으로 만들었다."],["I can’t believe her, because she always [twists] other people’s words.","그녀는 항상 다른 사람의 말을 왜곡하기 때문에 나는 그녀를 믿을 수 없다."],["an unexpected [twist] in the story","이야기 속 예상치 못한 전개"]]},{"u":7,"n":197,"w":"spill","m":"쏟다, 흘리다; 엎지름; 유출(물)","ex":[["I [spilt] milk on my desk by mistake.","나는 실수로 책상에 우유를 쏟았다."]]},{"u":7,"n":198,"w":"peel","m":"(껍질을) 벗기다; (과일, 채소의) 껍질","ex":[["Be careful when you [peel] potatoes with a knife.","칼로 감자의 껍질을 벗길 때는 조심해라."]]},{"u":7,"n":199,"w":"blend","m":"1. 섞다, 혼합하다 2. 섞이다; 혼합(물)","ex":[["To make a milkshake, [blend] some milk with ice cream.","밀크셰이크를 만들려면 우유와 아이스크림을 섞어라."]]},{"u":7,"n":200,"w":"dye","m":"염색하다; 염료","ex":[["I want to [dye] my hair during the summer vacation.","나는 여름 방학 동안에 머리를 염색하고 싶다."]]},{"u":7,"n":201,"w":"toss","m":"(가볍게) 던지다","ex":[["She [tossed] the ball to me over the net.","그녀는 네트 너머로 나에게 공을 던졌다."]]},{"u":7,"n":202,"w":"bury","m":"묻다, 매장하다","ex":[["He [buried] the treasure under the tree.","그는 나무 아래에 보물을 묻었다."]]},{"u":7,"n":203,"w":"trap","m":"1. 덫으로 잡다, 함정에 빠뜨리다 2. (위험한 장소에) 가두다; 덫, 함정","ex":[["They tried to [trap] a mouse, but it was too fast.","그들은 쥐를 덫으로 잡으려고 애썼으나, 그것은 너무 빨랐다."],["They were [trapped] in the elevator for hours.","그들은 몇 시간 동안 엘리베이터에 갇혀 있었다."]]},{"u":7,"n":204,"w":"convey","m":"1. 운반하다, 수송하다 2. 전달하다","ex":[["Please [convey] this luggage to the station on time.","이 짐을 예정한 시간에 역까지 운반해 주세요."],["The painting [conveys] a feeling of joy.","그 그림은 기쁨의 감정을 전달한다."]]},{"u":7,"n":205,"w":"load","m":"(짐을) 싣다; 짐, 화물","ex":[["Could you help me to [load] the car with a refrigerator?","차에 냉장고를 싣는 것 좀 도와주시겠어요?"]]},{"u":7,"n":206,"w":"scratch","m":"긁다; 할퀴다; 긁힌 자국; 찰과상","ex":[["Don’t [scratch] your face with your dirty hand.","더러운 손으로 얼굴을 긁지 마라."]]},{"u":7,"n":207,"w":"yell","m":"소리치다, 외치다; 외침","ex":[["I [yelled] to my friend across the street.","나는 길 건너의 친구에게 소리쳤다."]]},{"u":7,"n":208,"w":"yawn","m":"하품하다; 하품","ex":[["[Yawning] is usually caused by sleepiness or tiredness.","하품은 보통 졸음이나 피로에 의해 나온다."]]},{"u":7,"n":209,"w":"bang","m":"(쾅 소리가 나게) 치다, 닫다; (쾅 하는) 소리","ex":[["He [banged] the table with anger.","그는 화가 나서 탁자를 쾅 소리가 나게 쳤다."]]},{"u":7,"n":210,"w":"install","m":"설치하다, 설비하다","ex":[["My school [installed] new locks on all the doors of the classrooms.","우리 학교는 모든 교실 문에 새 자물쇠를 설치했다."]]},{"u":8,"n":211,"w":"surround","m":"둘러싸다, 에워싸다","ex":[["The famous actor was [surrounded] by his fans.","그 유명 배우는 자신의 팬들에게 둘러싸여 있었다."]]},{"u":8,"n":212,"w":"resemble","m":"닮다, 유사하다","ex":[["She closely [resembles] her father.","그녀는 자신의 아버지를 매우 닮았다."]]},{"u":8,"n":213,"w":"consist","m":"1. (~로) 이루어져 있다, 구성되다 2. (~에) 있다, 존재하다","ex":[["Today’s breakfast [consists] of cereal, fruit, and orange juice.","오늘 아침 식사는 시리얼, 과일, 그리고 오렌지 주스로 이루어져 있다."],["Success [consists] in not giving up.","성공은 포기하지 않는 데 있다."]]},{"u":8,"n":214,"w":"decline","m":"1. 감소하다 2. 거절하다; 감소","ex":[["The number of people getting married has [declined].","결혼하는 사람의 수가 감소해 왔다."],["I invited Minji to my birthday party, but she [declined].","나는 민지를 생일 파티에 초대했지만, 그녀는 거절했다."],["The [decline] in physical activity is one of the causes of obesity.","신체 활동의 감소는 비만의 원인들 중 하나이다."]]},{"u":8,"n":215,"w":"shorten","m":"줄이다, 짧아지다","ex":[["My school doesn’t allow students to [shorten] skirts.","우리 학교는 학생들이 치마를 줄이는 것을 허용하지 않는다."]]},{"u":8,"n":216,"w":"debate","m":"토론하다; 논쟁하다; 토론; 논쟁","ex":[["The students [debated] the lesson of the story for an hour.","학생들은 그 이야기의 교훈에 대해 한 시간 동안 토론했다."],["Participating in [debates] helps students develop critical thinking skills.","토론에 참여하는 것은 학생들이 비판적 사고 능력을 키우는 것을 돕는다."]]},{"u":8,"n":217,"w":"handle","m":"다루다, 처리하다; 손잡이","ex":[["She learned how to [handle] difficult customers.","그녀는 까다로운 손님들을 다루는 법을 배웠다."],["a door [handle]","문 손잡이"]]},{"u":8,"n":218,"w":"shift","m":"1. 바꾸다, 바뀌다 2. (장소를) 이동하다; 1. 변화 2. 교대 근무 (시간)","ex":[["We tried to [shift] public opinion about the issue, but we couldn’t.","우리는 그 문제에 대한 여론을 바꾸려고 노력했지만, 그럴 수 없었다."],["I [shifted] my seat near the window.","나는 창가로 자리를 이동했다."],["He works the night [shift] as a part-timer.","그는 파트타임 직원으로 야간 교대 근무를 한다."]]},{"u":8,"n":219,"w":"guarantee","m":"1. 보장하다, 장담하다 2. 품질 보증을 하다; 1. 보장 2. 보증서","ex":[["I [guarantee] that he will arrive in time.","나는 그가 제시간에 도착할 것이라 보장한다."],["This refrigerator is [guaranteed] for two years.","이 냉장고는 2년간 품질 보증이 된다."],["There’s no [guarantee] that our new strategy will work.","우리의 새로운 전략이 효과가 있으리라는 보장은 없다."]]},{"u":8,"n":220,"w":"resist","m":"1. 저항하다, 반대하다 2. (하고 싶은 것을 하지 않고) 참다, 견디다 3. (손상 등에) 잘 견디다, 강하다","ex":[["Students strongly [resisted] changing the class time.","학생들은 수업 시간을 변경하는 것에 대해 강력히 반대했다."],["I couldn’t [resist] eating the chocolate cake.","나는 초콜릿 케이크를 먹는 것을 참을 수 없었다."],["Firefighters’ uniforms are made to [resist] heat.","소방관 제복은 열에 잘 견딜 수 있도록 만들어진다."]]},{"u":8,"n":221,"w":"recover","m":"(건강 등을) 회복하다; (손실 등을) 되찾다","ex":[["I had a bad cold last week, but I’m [recovering] now.","나는 지난주에 독감에 걸렸지만, 지금은 회복하는 중이다."]]},{"u":8,"n":222,"w":"maintain","m":"1. 유지하다, 지속하다 2. 주장하다","ex":[["This winter coat will help you [maintain] your body warmth.","이 겨울용 외투가 네 체온을 유지하는 데 도움이 될 것이다."],["The man [maintained] that he had done nothing illegal.","그 남자는 그가 불법적인 일을 하지 않았다고 주장했다."]]},{"u":8,"n":223,"w":"deserve","m":"(마땅히) ~을 받을 만하다; 가치가 있다","ex":[["You studied hard, so you [deserve] a reward.","너는 열심히 공부했으니 보상을 받을 만하다."]]},{"u":8,"n":224,"w":"bet","m":"1. (내기 등에) 돈을 걸다 2. 틀림없다, 분명하다; 내기","ex":[["People [bet] on the result of the game.","사람들이 그 경기의 결과에 돈을 건다[걸었다]."],["I [bet] that we’re too late.","우리가 너무 늦은 게 분명하다."]]},{"u":8,"n":225,"w":"monitor","m":"관찰하다; 감독하다, 감시하다; 화면, 모니터","ex":[["The teacher carefully [monitored] students’ behavior.","그 선생님은 학생들의 행동을 주의 깊게 관찰했다."],["a computer [monitor]","컴퓨터 화면[모니터]"]]},{"u":8,"n":226,"w":"ruin","m":"망치다; 파괴하다; 1. 유적, 폐허 2. 붕괴","ex":[["The bad weather [ruined] our school trip.","악천후가 우리의 수학여행을 망쳤다."],["the [ruins] of an ancient temple","고대 사원의 유적"]]},{"u":8,"n":227,"w":"cheat","m":"(시험 등에서) 부정행위를 하다; 속이다, 사기 치다","ex":[["He has been caught [cheating] on the test.","그는 시험에서 부정행위를 하다가 잡혔다."]]},{"u":8,"n":228,"w":"calculate","m":"1. 계산하다 2. 추정하다, 추산하다","ex":[["We need to [calculate] how much we spent today.","우리는 오늘 얼마를 썼는지 계산해야 한다."],["It’s difficult to [calculate] my team’s possibility of winning.","우리 팀의 우승 가능성을 추정하는 것은 어렵다."]]},{"u":8,"n":229,"w":"estimate","m":"추정하다, 추산하다; 추정, 추산","ex":[["Experts [estimate] the value of this painting at 1 million dollars.","전문가들은 이 그림의 가치를 백만 달러로 추산한다."]]},{"u":8,"n":230,"w":"evaluate","m":"(가치, 품질 등을) 평가하다, 감정하다","ex":[["The teacher made students [evaluate] each other’s work.","그 선생님은 학생들이 서로의 작품을 평가하도록 했다."]]},{"u":8,"n":231,"w":"highlight","m":"강조하다; (사건, 이야기 등의) 주요 부분, 하이라이트","ex":[["He [highlighted] the importance of interaction.","그는 상호 작용의 중요성을 강조했다."],["The art museum was the [highlight] of our trip.","그 미술관은 우리 여행의 하이라이트였다."]]},{"u":8,"n":232,"w":"confirm","m":"1. (예약, 약속 등을) 확인하다, 확정하다 2. 사실임을 보여주다","ex":[["Please [confirm] our hotel reservation.","호텔 예약 좀 확인해 주세요."],["The study [confirms] the result of an earlier experiment.","그 연구는 이전의 실험 결과가 사실임을 보여준다."]]},{"u":8,"n":233,"w":"satisfy","m":"만족시키다","ex":[["The restaurant’s food [satisfied] all of my family.","그 식당의 음식은 우리 가족 모두를 만족시켰다."]]},{"u":8,"n":234,"w":"bother","m":"1. 귀찮게 하다 2. 신경 쓰다, 일부러 ~하다","ex":[["I was trying to study, but my brother [bothered] me.","나는 공부를 하려 했지만, 내 남동생이 나를 귀찮게 했다."],["Some young people don’t [bother] to vote.","일부 젊은 사람들은 투표하는 것을 신경 쓰지 않는다."]]},{"u":8,"n":235,"w":"terrify","m":"(몹시) 무섭게 하다, 겁먹게 하다","ex":[["The thought of being alone [terrifies] me.","혼자라는 생각이 나를 무섭게 한다."]]},{"u":8,"n":236,"w":"disappoint","m":"실망시키다, 낙담시키다","ex":[["Her decision to cancel the play [disappointed] her fans.","연극을 취소하려는 그녀의 결정은 그녀의 팬들을 실망시켰다."]]},{"u":8,"n":237,"w":"regret","m":"1. 후회하다 2. 유감으로 생각하다; 1. 후회 2. 유감","ex":[["When I saw the exam questions, I [regretted] not studying harder.","시험 문제들을 보고 나는 더 열심히 공부하지 않은 걸 후회했다."],["We [regret] that we cannot accept your offer.","당신의 제안을 받아들이지 못해 유감으로 생각합니다."]]},{"u":8,"n":238,"w":"admire","m":"1. 존경하다; 칭찬하다 2. 감탄하다","ex":[["The couple [admired] each other very much.","그 두 사람은 서로를 매우 존경했다."],["We looked out the window and [admired] the view.","우리는 창밖을 내다보며 그 경관에 감탄했다."]]},{"u":8,"n":239,"w":"adore","m":"매우 좋아하다, 사랑하다","ex":[["She [adores] and cherishes her husband.","사랑하고 그녀는 남편을 소중히 여긴다."]]},{"u":8,"n":240,"w":"blame","m":"탓하다, (~의) 책임으로 보다; 탓, 책임","ex":[["People often [blame] others for their mistakes.","사람들은 종종 자신의 실수에 대해 다른 이를 탓한다."],["I’ll take the [blame] if something goes wrong.","뭔가 잘못되면 내가 책임을 질게."]]},{"u":9,"n":241,"w":"community","m":"(공통의 특징을 가진) 공동체; 지역 사회, 주민","ex":[["A festival is a great way for the [community] to come together.","축제는 공동체가 하나로 모이는 좋은 방법이다."]]},{"u":9,"n":242,"w":"material","m":"1. 재료, 원료 2. (책 등의) 소재, 자료; 1. 물질의, 물리적인 2. 물질적인, 세속적인","ex":[["Bricks were used as the main building [material] for the community center.","벽돌이 지역 주민회관의 주요 건축 재료로 사용되었
